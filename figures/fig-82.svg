<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 344" role="img" aria-label="Super C plus Super L roughly doubles usable spectrum; the S-band is still in trials" font-size="12"><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">Super C plus Super L roughly doubles usable spectrum; S-band is still in trials</text><text x="24" y="48" font-size="11.5" fill="#586572">To scale in wavelength; band edges as used in 2024–2025 studies</text><g><path d="M295.092357354292 96V102H443.77347306326953V96" fill="none" stroke="#16202a" stroke-width="1.25"></path><text x="369.43291520878074" y="88" text-anchor="middle" font-size="11.5" fill="#16202a">conventional C, about 4.4 THz</text></g><g><rect x="73.58428148878505" y="112" width="186.51950785131658" height="84" rx="8" fill="#c23d7a" fill-opacity="0.08" stroke="#c23d7a" stroke-width="1.75" stroke-dasharray="6 4"></rect><text x="166.84403541444334" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#16202a">S-band</text><text x="166.84403541444334" y="162" text-anchor="middle" font-size="11.5" fill="#586572">197–202.85 THz</text><text x="166.84403541444334" y="180" text-anchor="middle" font-size="11.5" fill="#586572">5.8 THz wide</text><text x="166.84403541444334" y="218" text-anchor="middle" font-size="11.5" fill="#16202a">thulium or Raman amplifiers</text><text x="166.84403541444334" y="236" text-anchor="middle" font-size="11.5" fill="#586572">lab and field trials</text></g><g><rect x="274.2517754489496" y="112" width="197.7656373950869" height="84" rx="8" fill="#1f5fcf" fill-opacity="0.14" stroke="#1f5fcf" stroke-width="1.75" stroke-dasharray="none"></rect><text x="373.1345941464931" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#16202a">Super C</text><text x="373.1345941464931" y="162" text-anchor="middle" font-size="11.5" fill="#586572">190.75–196.57 THz<