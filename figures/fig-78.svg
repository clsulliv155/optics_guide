<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 432" role="img" aria-label="The DSP undoes what is deterministic; noise and cross-channel distortion stay" font-size="12.5"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">The DSP undoes what is deterministic; noise and cross-channel distortion stay</text><text x="24" y="50" font-size="11.5" fill="#586572">Impairments placed by type of effect and by whether the receiver can reverse it</text><text x="264" y="74" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Linear</text><text x="576" y="74" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Nonlinear</text><text x="24" y="150" font-size="12.5" font-weight="600" fill="#16202a">Removed</text><text x="24" y="166" font-size="12.5" font-weight="600" fill="#16202a">by the DSP</text><text x="24" y="304" font-size="12.5" font-weight="600" fill="#16202a">Stays in</text><text x="24" y="320" font-size="12.5" font-weight="600" fill="#16202a">the budget</text><g><rect x="112" y="84" width="304" height="146" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><circle cx="132" cy="114" r="3" fill="#1f5fcf"></circle><text x="144" y="118" fill="#16202a">Chromatic dispersion</text><circle cx="132" cy="140" r="3" fill="#1f5fcf"></circle><text x="144" y="144" fill="#16202a">Polarization rotation and PMD (DGD)</text><circle cx="132" cy="166" r="3" fill="#1f5fcf"></circle><text x="144" y="170" fill="#16202a">Laser phase noise, frequency offset</text><text x="132" y="208" font-size="11.5" fill="#586572">Costs DSP power and latency, not reach</text></g><g><rect x="424" y="84" width="304" height="146" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><circle cx="444" cy="114" r="3" fill="#1f5fcf"></circle><text x="456" y="118" fill="#16202a">Self-channel nonlinearity (SPM)</text><text x="444" y="192" font-size="11.5" fill="#586572">Reversible only by digital back-propagation,</text><text x="444" y="208" font-size="11.5" fill="#586572">which is rarely worth its DSP power</text></g><g><rect x="112" y="238" width="304" height="146" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><circle cx="132" cy="268" r="3" fill="#16202a"></circle><text x="144" y="272" fill="#16202a">ASE noise from every amplifier</text><circle cx="132" cy="294" r="3" fill="#16202a"></circle><text x="144" y="298" fill="#16202a">Polarization-dependent loss</text><circle cx="132" cy="320" r="3" fill="#16202a"></circle><text x="144" y="324" fill="#16202a">ROADM filtering (partly equalized)</text><circle cx="132" cy="346" r="3" fill="#16202a"></circle><text x="144" y="350" fill="#16202a">Transceiver noise (DACs, ADCs, drivers)</text></g><g><rect x="424" y="238" width="304" height="146" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><circle cx="444" cy="268" r="3" fill="#16202a"></circle><text x="456" y="272" fill="#16202a">Cross-channel NLI (XPM, four-wave mixing)</text><text x="444" y="362" font-size="11.5" fill="#586572">Grows with launch power and channel load</text></g><text x="24" y="414" font-size="11.5" fill="#586572">The shaded row adds up span by span into the GSNR; the top row costs DSP effort but not reach.</text></svg>