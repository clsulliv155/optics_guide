<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="IEEE defines the link; OIF, MSAs and ITU-T define the pieces around it" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#e4eaf0">IEEE defines the link; OIF, MSAs and ITU-T define the pieces around it</text><text x="24" y="48" font-size="11.5" fill="#95a3b1">Which body owns which part of an Ethernet optical link</text><g><line x1="184" x2="184" y1="62" y2="352" stroke="#26313d"></line><line x1="294.4" x2="294.4" y1="62" y2="352" stroke="#26313d"></line><line x1="404.8" x2="404.8" y1="62" y2="352" stroke="#26313d"></line><line x1="515.2" x2="515.2" y1="62" y2="352" stroke="#26313d"></line><line x1="625.6" x2="625.6" y1="62" y2="352" stroke="#26313d"></line><line x1="736" x2="736" y1="62" y2="352" stroke="#26313d"></line><line x1="184" x2="736" y1="96" y2="96" stroke="#6f7f8f"></line><text x="239.2" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">Host ASIC</text><text x="239.2" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">and FEC</text><text x="349.59999999999997" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">Electrical</text><text x="349.59999999999997" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">interface</text><text x="460" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">Module and</text><text x="460" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">management</text><text x="570.4000000000001" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">Optical</text><text x="570.4000000000001" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">interface</text><text x="680.8000000000001" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">Fiber and</text><text x="680.8000000000001" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e4eaf0">DWDM grid</text></g><g><rect x="190" y="108" width="429.6" height="24" rx="6" fill="#6ea2ff" fill-opacity="0.14" stroke="#6ea2ff" stroke-width="1.75"></rect><text x="24" y="118" font-weight="600" fill="#e4eaf0">IEEE 802.3</text><text x="24" y="134" font-size="11.5" fill="#95a3b1">Ethernet PHY</text><text x="404.8" y="124" text-anchor="middle" font-size="11.5" fill="#e4eaf0">PCS, FEC, PMA, PMD, AUI, and the PMD names</text></g><g><rect x="300.4" y="150" width="319.20000000000005" height="24" rx="6" fill="#19222c" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="24" y="160" font-weight="600" fill="#e4eaf0">OIF</text><text x="24" y="176" font-size="11.5" fill="#95a3b1">IAs and CMIS</text><text x="460" y="166" text-anchor="middle" font-size="11.5" fill="#e4eaf0">CEI electrical · CMIS · ZR/LR coherent</text></g><g><rect x="410.8" y="192" width="98.40000000000003" height="24" rx="6" fill="#19222c" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="24" y="202" font-weight="600" fill="#e4eaf0">Form-factor MSAs</text><text x="24" y="218" font-size="11.5" fill="#95a3b1">QSFP-DD, OSFP, SFF</text><text x="460" y="208" text-anchor="middle" font-size="11.5" fill="#e4eaf0">mechanics, maps</text></g><g><rect x="521.2" y="234" width="98.39999999999998" height="24" rx="6" fill="#19222c" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="24" y="244" font-weight="600" fill="#e4eaf0">Optical MSAs</text><text x="24" y="260" font-size="11.5" fill="#95a3b1">CWDM4, 100G Lambda, LPO</text><text x="570.4000000000001" y="250" text-anchor="middle" font-size="11.5" fill="#e4eaf0">PMD variants</text></g><g><rect x="631.6" y="276" width="98.39999999999998" height="24" rx="6" fill="#19222c" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="24" y="286" font-w