/text><text x="24" y="232" fill="#16202a">LRO at switch, FRO at accelerator</text><text x="24" y="272" fill="#16202a">LRO at every end</text><text x="24" y="312" font-weight="600" fill="#16202a">LPO at switch, FRO at accelerator</text><text x="24" y="352" fill="#16202a">LPO at every end</text></g><text x="24" y="416" font-size="11.5" fill="#586572">Module watts sit within the vendor-listed 1.6T ranges in this section; host SerDes power excluded.</text><text x="24" y="434" font-size="11.5" fill="#586572">1.6T LPO is vendor-listed but not yet MSA-specified, so at 1.6T the LRO rows are the realistic mixes today.</text></svg>