" font-weight="600" fill="#16202a">connector</text><text x="343" y="290" text-anchor="middle" font-size="11.5" fill="#586572">spike and step</text><text x="460" y="274" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">bend</text><text x="460" y="290" text-anchor="middle" font-size="11.5" fill="#586572">step, worse at long λ</text><text x="603" y="274" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">fiber end</text><text x="603" y="290" text-anchor="middle" font-size="11.5" fill="#586572">big reflection</text><text x="704" y="274" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">ghost</text><text x="704" y="290" text-anchor="middle" font-size="11.5" fill="#586572">no loss</text></g></svg>