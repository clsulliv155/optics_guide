<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 486" role="img" aria-label="One laser feeds four lanes; the EIC drives and reads every lane" font-size="13"><defs><marker id="eng-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker><marker id="eng-light-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fcf"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">One laser feeds four lanes; the EIC drives and reads every lane</text><text x="24" y="50" font-size="11.5" fill="#586572">Lanes 1–4 of an 8-lane engine; a second laser feeds lanes 5–8 the same way</text><g><rect x="152" y="144" width="148" height="272" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="168" y="170" font-weight="600" fill="#16202a">Electronic IC</text><text x="168" y="188" font-size="11.5" fill="#586572">(EIC)</text></g><g><rect x="324" y="144" width="296" height="272" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="604" y="170" text-anchor="end" font-weight="600" fill="#16202a">Photonic IC (PIC)</text></g><g fill="none" stroke="#1f5fcf" stroke-width="1.5"><path d="M404 120V184" marker-end="url(#eng-light-arrow)"></path><path d="M404 216V240" marker-end="url(#eng-light-arrow)"></path><path d="M468 266H492" marker-end="url(#eng-light-arrow)"></path><path d="M604 266H644" marker-end="url(#eng-light-arrow)"></path><path d="M644 366H604" marker-end="url(#eng-light-arrow)"></path><path d="M492 366H468" marker-end="url(#eng-light-arrow)"></path></g><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M132 266H168" marker-end="url(#eng-arrow)"></path><path d="M284 266H340" marker-end="url(#eng-arrow)"></path><path d="M340 366H284" marker-end="url(#eng-arrow)"></path><path d="M168 366H132" marker-end="url(#eng-arrow)"></path><path d="M284 316H456V292" stroke-dasharray="4 3" marker-end="url(#eng-arrow)"></path></g><text x="332" y="310" font-size="11.5" fill="#586572">bias and lock</text><g><rect x="304" y="72" width="200" height="48" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="2"></rect><text x="404" y="92" text-anchor="middle" font-weight="600" fill="#16202a">Continuous-wave laser</text><text x="404" y="110" text-anchor="middle" font-size="11.5" fill="#586572">InP, on the PIC or external</text></g><g><rect x="24" y="242" width="108" height="148" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="78" y="304" text-anchor="middle" font-weight="600" fill="#16202a">Host SerDes</text><text x="78" y="322" text-anchor="middle" font-size="11.5" fill="#586572">or module DSP</text><text x="78" y="338" text-anchor="middle" font-size="11.5" fill="#586572">in pluggables</text></g><g><rect x="168" y="246" width="116" height="40" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="226" y="270" text-anchor="middle" fill="#16202a">4 drivers</text></g><g><rect x="168" y="302" width="116" height="28" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="226" y="320" text-anchor="middle" fill="#16202a">Control loops</text></g><g><rect x="168" y="346" width="116" height="40" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="226" y="370" text-anchor="middle" fill="#16202a">4 TIAs</text></g><g><rect x="340" y="184" width="128" height="32" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="404" y="204" text-anchor="middle" fill="#16202a">1:4 splitter</text></g><g><rect x="340" y="240" width="128" height="52" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="404" y="262" text-anchor="middle" font-weight="600" fill="#16202a">4 modulators</text><text x="404" y="280" text-anchor="middle" font-size="11.5" fill="#586572">MZM or ring</text></g><g><rect x="492" y="246" width="112" height="40" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="548" y="270" text-anchor="middle" fill="#16202a">Tx couplers</text></g><g><rect x="340" y="340" width="128" height="52" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="404" y="362" text-anchor="middle" font-weight="600" fill="#16202a">4 photodiodes</text><text x="404" y="380" text-anchor="middle" font-size="11.5" fill="#586572">germanium</text></g><g><rect x="492" y="346" width="112" height="40" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="548" y="370" text-anchor="middle" fill="#16202a">Rx couplers</text></g><g><rect x="644" y="240" width="92" height="152" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="690" y="296" text-anchor="middle" font-weight="600" fill="#16202a">Fiber</text><text x="690" y="312" text-anchor="middle" font-weight="600" fill="#16202a">attach</text><text x="690" y="334" text-anchor="middle" font-size="11.5" fill="#586572">4 Tx, 4 Rx</text><text x="690" y="350" text-anchor="middle" font-size="11.5" fill="#586572">V-grooves</text></g><g><line x1="24" x2="48" y1="436" y2="436" stroke="#1f5fcf" stroke-width="1.5"></line><text x="56" y="440" font-size="11.5" fill="#586572">light</text><line x1="104" x2="128" y1="436" y2="436" stroke="#8794a1" stroke-width="1.25"></line><text x="136" y="440" font-size="11.5" fill="#586572">electrical</text><line x1="216" x2="240" y1="436" y2="436" stroke="#8794a1" stroke-width="1.25" stroke-dasharray="4 3"></line><text x="248" y="440" font-size="11.5" fill="#586572">control</text></g><text x="24" y="464" font-size="11.5" fill="#586572">3D-stacked engines put the EIC on top of the PIC; CPO moves the laser to a front-panel module.</text></svg>