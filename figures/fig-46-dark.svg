<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 464" role="img" aria-label="An NPO channel past the linear budget needs lower loss or signal conditioning" font-size="13"><defs><marker id="npo-rt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7f8f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">An NPO channel past the linear budget needs lower loss or signal conditioning</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Decide per engine position; every option below linear drive gives back part of NPO&#x27;s power saving</text><g><rect x="240" y="72" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="380" y="96" text-anchor="middle" font-weight="600" fill="#e4eaf0">Within the linear budget?</text><text x="380" y="114" text-anchor="middle" font-size="11.5" fill="#95a3b1">XSR+ class, about 13 dB</text></g><g><rect x="24" y="72" width="176" height="56" rx="8" fill="#4cc47a" fill-opacity="0.12" stroke="#4cc47a" stroke-width="1.75"></rect><text x="112" y="96" text-anchor="middle" font-weight="600" fill="#e4eaf0">Linear drive</text><text x="112" y="114" text-anchor="middle" font-size="11.5" fill="#95a3b1">lowest power and latency</text></g><g><rect x="240" y="168" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="380" y="192" text-anchor="middle" font-weight="600" fill="#e4eaf0">Can you cut the loss?</text><text x="380" y="210" text-anchor="middle" font-size="11.5" fill="#95a3b1">flyover cable, laminate, placement</text></g><g><rect x="240" y="264" width="280" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="380" y="288" text-anchor="middle" font-weight="600" fill="#e4eaf0">Add signal conditioning</text><text x="380" y="306" text-anchor="middle" font-size="11.5" fill="#95a3b1">choose where it sits</text></g><g><rect x="24" y="368" width="232" height="72" rx="8" fill="#f0a43a" fill-opacity="0.12" stroke="#f0a43a" stroke-width="1.75"></rect><text x="140" y="392" text-anchor="middle" font-weight="600" fill="#e4eaf0">Half-retimed engine</text><text x="140" y="410" text-anchor="middle" font-size="11.5" fill="#95a3b1">clock recovery on transmit</text><text x="140" y="426" text-anchor="middle" font-size="11.5" fill="#e4eaf0">+ modest power</text></g><g><rect x="272" y="368" width="216" height="72" rx="8" fill="#f0a43a" fill-opacity="0.12" stroke="#f0a43a" stroke-width="1.75"></rect><text x="380" y="392" text-anchor="middle" font-weight="600" fill="#e4eaf0">Retimed engine</text><text x="380" y="410" text-anchor="middle" font-size="11.5" fill="#95a3b1">DSP in the engine</text><text x="380" y="426" text-anchor="middle" font-size="11.5" fill="#e4eaf0">+ a SerDes pair per lane</text></g><g><rect x="504" y="368" width="232" height="72" rx="8" fill="#f0a43a" fill-opacity="0.12" stroke="#f0a43a" stroke-width="1.75"></rect><text x="620" y="392" text-anchor="middle" font-weight="600" fill="#e4eaf0">Bigger host SerDes</text><text x="620" y="410" text-anchor="middle" font-size="11.5" fill="#95a3b1">MR or LR class</text><text x="620" y="426" text-anchor="middle" font-size="11.5" fill="#e4eaf0">+ ASIC power on every lane</text></g><g fill="none" stroke="#6f7f8f" stroke-width="1.25"><path d="M240 100H202" marker-end="url(#npo-rt-arrow)"></path><path d="M380 128V166" marker-end="url(#npo-rt-arrow)"></path><path d="M240 196H112V130" marker-end="url(#npo-rt-arrow)"></path><path d="M380 224V262" marker-end="url(#npo-rt-arrow)"></path><path d="M380 320V344H140V366" marker-end="url(#npo-rt-arrow)"></path><path d="M380 344V366" marker-end="url(#npo-rt-arrow)"></path><path d="M380 344H620V366" marker-end="url(#npo-rt-arrow)"></path></g><g><text x="221" y="92" text-anchor="middle" font-size="11.5" fill="#95a3b1">yes</text><text x="390" y="152" font-size="11.5" fill="#95a3b1">no</text><text x="176" y="188" text-anchor="middle" font-size="11.5" fill="#95a3b1">yes</text><text x="390" y="248" font-size="11.5" fill="#95a3b1">no</text></g></svg>