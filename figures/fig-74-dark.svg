<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 376" role="img" aria-label="Grating couplers let you test on the wafer; edge couplers lose less light" font-size="13"><defs><marker id="cpl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6ea2ff"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">Grating couplers let you test on the wafer; edge couplers lose less light</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Side views, not to scale. Blue is the light path from the chip into the fiber.</text><g><rect x="24" y="72" width="344" height="280" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="40" y="98" font-weight="600" fill="#e4eaf0">Grating coupler</text><rect x="40" y="200" width="312" height="50" rx="4" fill="#19222c" stroke="#6f7f8f" stroke-width="1"></rect><rect x="214" y="201" width="5" height="7" fill="#6f7f8f"></rect><rect x="224" y="201" width="5" height="7" fill="#6f7f8f"></rect><rect x="234" y="201" width="5" height="7" fill="#6f7f8f"></rect><rect x="244" y="201" width="5" height="7" fill="#6f7f8f"></rect><rect x="254" y="201" width="5" height="7" fill="#6f7f8f"></rect><rect x="264" y="201" width="5" height="7" fill="#6f7f8f"></rect><rect x="274" y="201" width="5" height="7" fill="#6f7f8f"></rect><rect x="284" y="201" width="5" height="7" fill="#6f7f8f"></rect><polygon points="236,196 272,196 292,96 256,96" fill="none" stroke="#6f7f8f" stroke-width="1.25"></polygon><path d="M56 212H254L274 100" fill="none" stroke="#6ea2ff" stroke-width="2" marker-end="url(#cpl-arrow)"></path><text x="56" y="192" font-size="11.5" fill="#95a3b1">waveguide</text><text x="240" y="122" text-anchor="end" font-size="11.5" fill="#95a3b1">fiber, tilted a few degrees</text><text x="254" y="270" text-anchor="middle" font-size="11.5" fill="#95a3b1">etched grating</text><text x="40" y="300" font-size="12" fill="#e4eaf0">+ test anywhere on the wafer surface</text><text x="40" y="318" font-size="12" fill="#e4eaf0">− 2.5–4.5 dB in standard kits; 20–40 nm band</text><text x="40" y="336" font-size="12" fill="#e4eaf0">• alignment tolerance about ±2.5 µm</text></g><g><rect x="392" y="72" width="344" height="280" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="408" y="98" font-weight="600" fill="#e4eaf0">Edge coupler</text><rect x="408" y="200" width="192" height="50" rx="4" fill="#19222c" stroke="#6f7f8f" stroke-width="1"></rect><rect x="420" y="217" width="60" height="6" fill="#6ea2ff"></rect><polygon points="480,217 600,219.4 600,220.6 480,223" fill="#6ea2ff"></polygon><ellipse cx="592" cy="220" rx="16" ry="11" fill="#6ea2ff" fill-opacity="0.15" stroke="#6ea2ff" stroke-width="1.25" stroke-dasharray="3 2"></ellipse><rect x="608" y="204" width="120" height="32" rx="3" fill="#19222c" stroke="#6f7f8f" stroke-width="1"></rect><path d="M608 220H726" stroke="#6ea2ff" stroke-width="2" marker-end="url(#cpl-arrow)"></path><text x="424" y="192" font-size="11.5" fill="#95a3b1">waveguide</text><text x="596" y="190" text-anchor="end" font-size="11.5" fill="#95a3b1">chip edge</text><text x="668" y="194" text-anchor="middle" font-size="11.5" fill="#95a3b1">fiber in a V-groove</text><text x="540" y="270" text-anchor="middle" font-size="11.5" fill="#95a3b1">taper expands the mode</text><text x="408" y="300" font-size="12" fill="#e4eaf0">+ 1–2 dB per facet; about 100 nm band</text><text x="408" y="318" font-size="12" fill="#e4eaf0">− needs an exposed facet to test on the wafer</text><text x="408" y="336" font-size="12" fill="#e4eaf0">• alignment tolerance about ±0.5 µm</text></g></svg>