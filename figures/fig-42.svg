<svg xmlns="http://www.w3.org/2000/svg" width="760" height="454" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 454" role="img" aria-label="Two build choices shape an NPO engine: laser placement and EIC placement" font-size="13"><defs><marker id="npo-var-las" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d4632a"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Two build choices shape an NPO engine: laser placement and EIC placement</text><text x="24" y="50" font-size="11.5" fill="#586572">Schematic; the same choices apply to CPO engines (section 25)</text><text x="24" y="82" font-weight="600" fill="#16202a">Where the light comes from</text><g><rect x="24" y="94" width="348" height="148" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="40" y="118" font-weight="600" fill="#16202a">External laser module</text><rect x="40" y="130" width="104" height="36" rx="6" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.5"></rect><text x="92" y="152" text-anchor="middle" font-size="11.5" fill="#16202a">Laser module</text><path d="M146 148H254" fill="none" stroke="#d4632a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#npo-var-las)"></path><text x="200" y="142" text-anchor="middle" font-size="11.5" fill="#586572">fiber</text><rect x="256" y="130" width="100" height="36" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="306" y="152" text-anchor="middle" font-size="11.5" fill="#16202a">Engine</text><text x="40" y="190" font-size="11.5" fill="#16202a">+ Laser swaps from the front, away from the heat</text><text x="40" y="206" font-size="11.5" fill="#16202a">− Adds a fiber feed and coupling loss per laser</text><text x="40" y="222" font-size="11.5" fill="#586572">Most CPO and NPO designs; OIF ELSFP modules</text></g><g><rect x="388" y="94" width="348" height="148" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="404" y="118" font-weight="600" fill="#16202a">Laser built into the engine</text><rect x="404" y="130" width="316" height="36" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.5"></rect><rect x="412" y="136" width="92" height="24" rx="6" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.5"></rect><text x="458" y="152" text-anchor="middle" font-size="11.5" fill="#16202a">Laser die</text><text x="612" y="152" text-anchor="middle" font-size="11.5" fill="#16202a">PIC and EIC in the same engine</text><text x="404" y="190" font-size="11.5" fill="#16202a">+ No laser fiber and no laser slots on the panel</text><text x="404" y="206" font-size="11.5" fill="#16202a">− Laser heat and failures stay inside the engine</text><text x="404" y="222" font-size="11.5" fill="#586572">Shown in a 7.2T engine in September 2026</text></g><text x="24" y="270" font-weight="600" fill="#16202a">Where the EIC sits</text><g><rect x="24" y="282" width="348" height="148" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="40" y="306" font-weight="600" fill="#16202a">Stacked on the PIC (3D)</text><rect x="96" y="316" width="128" height="22" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="160" y="331" text-anchor="middle" font-size="11.5" fill="#16202a">EIC</text><rect x="64" y="340" width="192" height="24" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="160" y="356" text-anchor="middle" font-size="11.5" fill="#16202a">PIC</text><text x="236" y="334" font-size="11.5" fill="#586572">hybrid bonds</text><text x="40" y="384" font-size="11.5" fill="#16202a">+ Shortest path, lowest drive energy</text><text x="40" y="400" font-size="11.5" fill="#16202a">− EIC heat flows straight into the photonics</text><text x="40" y="416" font-size="11.5" fill="#586572">Micrometer-pitch hybrid bonds (section 25)</text></g><g><rect x="388" y="282" width="348" height="148" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="404" y="306" font-weight="600" fill="#16202a">Beside the PIC (2.5D)</text><rect x="420" y="320" width="104" height="36" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="472" y="342" text-anchor="middle" font-size="11.5" fill="#16202a">EIC</text><path d="M524 338H580" fill="none" stroke="#8794a1" stroke-width="1.25"></path><rect x="580" y="320" width="124" height="36" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="642" y="342" text-anchor="middle" font-size="11.5" fill="#16202a">PIC</text><text x="404" y="384" font-size="11.5" fill="#16202a">+ Simpler thermals and assembly</text><text x="404" y="400" font-size="11.5" fill="#16202a">− Longer electrical path, more drive power</text><text x="404" y="416" font-size="11.5" fill="#586572">Joined by wire bonds or substrate traces</text></g></svg>