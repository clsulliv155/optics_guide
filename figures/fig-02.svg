<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 500" role="img" aria-label="Six rungs from fiber physics to the frontier, each with the sections to read and the test of having learned it" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Six rungs from photons to the frontier: what to read, and the test that you have learned it</text><text x="24" y="50" font-size="11.5" fill="#586572">Read bottom to top. Each rung assumes the ones below it; the mastery checks in section 30 draw on all six</text><text x="24" y="76" font-size="11.5" font-weight="600" fill="#16202a">Rung and sections</text><text x="512" y="76" font-size="11.5" font-weight="600" fill="#16202a">You have it when you can…</text><g><g><rect x="24" y="86" width="470" height="58" rx="6" fill="#eef2f6" stroke="#6b4fbb" stroke-width="1.5"></rect><circle cx="46" cy="115" r="13" fill="#6b4fbb"></circle></g><text x="46" y="119" text-anchor="middle" font-size="12" font-weight="600" fill="#eef2f6">6</text><text x="68" y="105" font-weight="600" fill="#16202a">Frontier: AI fabrics, silicon photonics, long haul</text><text x="68" y="120" font-size="10.5" fill="#586572">§9 AI fabric and cables · §10 LPO, NPO, CPO · §17 new fibers</text><text x="68" y="134" font-size="10.5" fill="#586572">§25 silicon photonics · §26 long-haul coherent · §27–28 standards, roadmap</text><rect x="512" y="86" width="224" height="58" rx="6" fill="none" stroke="#6b4fbb" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="105" font-size="11" fill="#16202a">argue CPO vs LPO vs pluggable</text><text x="524" y="120" font-size="11" fill="#16202a">for a given fabric with pJ/bit,</text><text x="524" y="135" font-size="11" fill="#16202a">reach and FIT numbers</text></g><g><g><rect x="24" y="152" width="470" height="58" rx="6" fill="#eef2f6" stroke="#c23d7a" stroke-width="1.5"></rect><circle cx="46" cy="181" r="13" fill="#c23d7a"></circle></g><text x="46" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#eef2f6">5</text><text x="68" y="171" font-weight="600" fill="#16202a">Measurement, reliability and the fleet</text><text x="68" y="186" font-size="10.5" fill="#586572">§22 test and measurement · §23 qualification · §24 telemetry</text><text x="68" y="200" font-size="10.5" fill="#586572">§20 latency and timing · §21 encryption · §19 optical circuit switching</text><rect x="512" y="152" width="224" height="58" rx="6" fill="none" stroke="#c23d7a" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="171" font-size="11" fill="#16202a">read TDECQ, an OTDR trace and</text><text x="524" y="186" font-size="11" fill="#16202a">a FIT figure, and say which</text><text x="524" y="201" font-size="11" fill="#16202a">counter predicts a failure</text></g><g><g><rect x="24" y="218" width="470" height="58" rx="6" fill="#eef2f6" stroke="#23397a" stroke-width="1.5"></rect><circle cx="46" cy="247" r="13" fill="#23397a"></circle></g><text x="46" y="251" text-anchor="middle" font-size="12" font-weight="600" fill="#eef2f6">4</text><text x="68" y="237" font-weight="600" fill="#16202a">Operating the link</text><text x="68" y="252" font-size="10.5" fill="#586572">§12 CMIS and DOM · §13 troubleshooting · §14 link budgets</text><text x="68" y="266" font-size="10.5" fill="#586572">§15 selection · §16 fiber plant and polarity</text><rect x="512" y="218" width="224" height="58" rx="6" fill="none" stroke="#23397a" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="237" font-size="11" fill="#16202a">close a DR4 budget with real</text><text x="524" y="252" font-size="11" fill="#16202a">connector grades and bring a</text><text x="524" y="267" font-size="11" fill="#16202a">port up from the memory map</text></g><g><g><rect x="24" y="284" width="470" height="58" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></rect><circle cx="46" cy="313" r="13" fill="#12876a"></circle></g><text x="46" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#eef2f6">3</text><text x="68" y="303" font-weight="600" fill="#16202a">The products: names, reaches, form factors</text><text x="68" y="318" font-size="10.5" fill="#586572">§6 grey optics and the PMD table · §7 form factors · §8 coherent and DCI</text><text x="68" y="332" font-size="10.5" fill="#586572">§11 1.6T in depth</text><rect x="512" y="284" width="224" height="58" rx="6" fill="none" stroke="#12876a" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="303" font-size="11" fill="#16202a">decode any PMD name into lanes,</text><text x="524" y="318" font-size="11" fill="#16202a">wavelengths, fiber and reach, and</text><text x="524" y="333" font-size="11" fill="#16202a">predict what breaks out to what</text></g><g><g><rect x="24" y="350" width="470" height="58" rx="6" fill="#eef2f6" stroke="#d4632a" stroke-width="1.5"></rect><circle cx="46" cy="379" r="13" fill="#d4632a"></circle></g><text x="46" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#eef2f6">2</text><text x="68" y="369" font-weight="600" fill="#16202a">The electrical half: SerDes, DSP, FEC</text><text x="68" y="384" font-size="10.5" fill="#586572">§3 host channel and compliance points · §4 DSP, retimed vs linear</text><text x="68" y="398" font-size="10.5" fill="#586572">§5 FEC and BER in depth</text><rect x="512" y="350" width="224" height="58" rx="6" fill="none" stroke="#d4632a" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="369" font-size="11" fill="#16202a">say where margin lives in a</text><text x="524" y="384" font-size="11" fill="#16202a">retimed link and read FEC counters</text><text x="524" y="399" font-size="11" fill="#16202a">as a distance to the cliff</text></g><g><g><rect x="24" y="416" width="470" height="58" rx="6" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.5"></rect><circle cx="46" cy="445" r="13" fill="#1f5fcf"></circle></g><text x="46" y="449" text-anchor="middle" font-size="12" font-weight="600" fill="#eef2f6">1</text><text x="68" y="435" font-weight="600" fill="#16202a">Foundations: light, fiber, symbols</text><text x="68" y="450" font-size="10.5" fill="#586572">§1 fiber, lasers, detectors, noise · §2 baud, NRZ, PAM4, coherent</text><text x="68" y="464" font-size="10.5" fill="#586572">the companion Optics Bench for eyes and constellations</text><rect x="512" y="416" width="224" height="58" rx="6" fill="none" stroke="#1f5fcf" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="435" font-size="11" fill="#16202a">explain why DR and FR live at</text><text x="524" y="450" font-size="11" fill="#16202a">1310 nm, and what a receiver&#x27;s</text><text x="524" y="465" font-size="11" fill="#16202a">sensitivity figure is made of</text></g><line x1="500" x2="500" y1="86" y2="474" stroke="#8794a1" stroke-dasharray="3 3"></line><text x="24" y="492" font-size="10.5" fill="#586572">An expert works top-down too: a field symptom (rung 4) is explained by physics (rung 1) and settled by a measurement (rung 5).</text></svg>