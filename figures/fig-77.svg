 fill="#586572">+ASE</text></g><g><rect x="24" y="106" width="92" height="48" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="70" y="134" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Transmitter</text><text x="70" y="172" text-anchor="middle" font-size="11.5" fill="#586572">Tx noise</text></g><g><text x="198" y="108" text-anchor="middle" font-size="11.5" fill="#16202a">span 1</text><text x="312" y="108" text-anchor="middle" font-size="11.5" fill="#16202a">span 2</text><text x="462" y="108" text-anchor="middle" font-size="11.5" fill="#16202a">more spans</text><text x="564" y="108" text-anchor="middle" font-size="11.5" fill="#16202a">span N</text><text x="198" y="158" text-anchor="middle" font-size="11.5" fill="#586572">CD · PMD · NLI</text><text x="312" y="158" text-anchor="middle" font-size="11.5" fill="#586572">CD · PMD · NLI</text><text x="564" y="158" text-anchor="middle" font-size="11.5" fill="#586572">CD · PMD · NLI</text><text x="462" y="158" text-anchor="middle" font-size="11.5" fill="#586572">50–100 km each</text></g><g><rect x="352" y="112" width="68" height="36" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="386" y="134" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">ROADM</text><text x="386" y="172" text-anchor="middle" font-size="11.5" fill="#586572">filtering</text></g><g><rect x="632" y="106" width="104" height="48" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="684" y="127" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Receiver DSP</text><text x="684" y="144" text-anchor="middle" font-size="11" fill="#586572">undoes CD, PMD</text></g><g><path d="M116 240H134V252L262 262V276L352 284H386V294H420L514 306V320L614 330V344H736" fill="none" stroke="#1f5fcf" stroke-width="2.25"></path><text x="24" y="244" font-size="12.5" font-weight="600" fill="#16202a">GSNR</text><text x="150" y="238" font-size="11.5" fill="