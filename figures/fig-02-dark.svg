<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 500" role="img" aria-label="Six rungs from fiber physics to the frontier, each with the sections to read and the test of having learned it" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">Six rungs from photons to the frontier: what to read, and the test that you have learned it</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Read bottom to top. Each rung assumes the ones below it; the mastery checks in section 30 draw on all six</text><text x="24" y="76" font-size="11.5" font-weight="600" fill="#e4eaf0">Rung and sections</text><text x="512" y="76" font-size="11.5" font-weight="600" fill="#e4eaf0">You have it when you can…</text><g><g><rect x="24" y="86" width="470" height="58" rx="6" fill="#19222c" stroke="#b39cff" stroke-width="1.5"></rect><circle cx="46" cy="115" r="13" fill="#b39cff"></circle></g><text x="46" y="119" text-anchor="middle" font-size="12" font-weight="600" fill="#19222c">6</text><text x="68" y="105" font-weight="600" fill="#e4eaf0">Frontier: AI fabrics, silicon photonics, long haul</text><text x="68" y="120" font-size="10.5" fill="#95a3b1">§9 AI fabric and cables · §10 LPO, NPO, CPO · §17 new fibers</text><text x="68" y="134" font-size="10.5" fill="#95a3b1">§25 silicon photonics · §26 long-haul coherent · §27–28 standards, roadmap</text><rect x="512" y="86" width="224" height="58" rx="6" fill="none" stroke="#b39cff" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="105" font-size="11" fill="#e4eaf0">argue CPO vs LPO vs pluggable</text><text x="524" y="120" font-size="11" fill="#e4eaf0">for a given fabric with pJ/bit,</text><text x="524" y="135" font-size="11" fill="#e4eaf0">reach and FIT numbers</text></g><g><g><rect x="24" y="152" width="470" height="58" rx="6" fill="#19222c" stroke="#f07aae" stroke-width="1.5"></rect><circle cx="46" cy="181" r="13" fill="#f07aae"></circle></g><text x="46" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#19222c">5</text><text x="68" y="171" font-weight="600" fill="#e4eaf0">Measurement, reliability and the fleet</text><text x="68" y="186" font-size="10.5" fill="#95a3b1">§22 test and measurement · §23 qualification · §24 telemetry</text><text x="68" y="200" font-size="10.5" fill="#95a3b1">§20 latency and timing · §21 encryption · §19 optical circuit switching</text><rect x="512" y="152" width="224" height="58" rx="6" fill="none" stroke="#f07aae" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="171" font-size="11" fill="#e4eaf0">read TDECQ, an OTDR trace and</text><text x="524" y="186" font-size="11" fill="#e4eaf0">a FIT figure, and say which</text><text x="524" y="201" font-size="11" fill="#e4eaf0">counter predicts a failure</text></g><g><g><rect x="24" y="218" width="470" height="58" rx="6" fill="#19222c" stroke="#9db1ff" stroke-width="1.5"></rect><circle cx="46" cy="247" r="13" fill="#9db1ff"></circle></g><text x="46" y="251" text-anchor="middle" font-size="12" font-weight="600" fill="#19222c">4</text><text x="68" y="237" font-weight="600" fill="#e4eaf0">Operating the link</text><text x="68" y="252" font-size="10.5" fill="#95a3b1">§12 CMIS and DOM · §13 troubleshooting · §14 link budgets</text><text x="68" y="266" font-size="10.5" fill="#95a3b1">§15 selection · §16 fiber plant and polarity</text><rect x="512" y="218" width="224" height="58" rx="6" fill="none" stroke="#9db1ff" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="237" font-size="11" fill="#e4eaf0">close a DR4 budget with real</text><text x="524" y="252" font-size="11" fill="#e4eaf0">connector grades and bring a</text><text x="524" y="267" font-size="11" fill="#e4eaf0">port up from the memory map</text></g><g><g><rect x="24" y="284" width="470" height="58" rx="6" fill="#19222c" stroke="#38c29b" stroke-width="1.5"></rect><circle cx="46" cy="313" r="13" fill="#38c29b"></circle></g><text x="46" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#19222c">3</text><text x="68" y="303" font-weight="600" fill="#e4eaf0">The products: names, reaches, form factors</text><text x="68" y="318" font-size="10.5" fill="#95a3b1">§6 grey optics and the PMD table · §7 form factors · §8 coherent and DCI</text><text x="68" y="332" font-size="10.5" fill="#95a3b1">§11 1.6T in depth</text><rect x="512" y="284" width="224" height="58" rx="6" fill="none" stroke="#38c29b" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="303" font-size="11" fill="#e4eaf0">decode any PMD name into lanes,</text><text x="524" y="318" font-size="11" fill="#e4eaf0">wavelengths, fiber and reach, and</text><text x="524" y="333" font-size="11" fill="#e4eaf0">predict what breaks out to what</text></g><g><g><rect x="24" y="350" width="470" height="58" rx="6" fill="#19222c" stroke="#f08a4b" stroke-width="1.5"></rect><circle cx="46" cy="379" r="13" fill="#f08a4b"></circle></g><text x="46" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#19222c">2</text><text x="68" y="369" font-weight="600" fill="#e4eaf0">The electrical half: SerDes, DSP, FEC</text><text x="68" y="384" font-size="10.5" fill="#95a3b1">§3 host channel and compliance points · §4 DSP, retimed vs linear</text><text x="68" y="398" font-size="10.5" fill="#95a3b1">§5 FEC and BER in depth</text><rect x="512" y="350" width="224" height="58" rx="6" fill="none" stroke="#f08a4b" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="369" font-size="11" fill="#e4eaf0">say where margin lives in a</text><text x="524" y="384" font-size="11" fill="#e4eaf0">retimed link and read FEC counters</text><text x="524" y="399" font-size="11" fill="#e4eaf0">as a distance to the cliff</text></g><g><g><rect x="24" y="416" width="470" height="58" rx="6" fill="#19222c" stroke="#6ea2ff" stroke-width="1.5"></rect><circle cx="46" cy="445" r="13" fill="#6ea2ff"></circle></g><text x="46" y="449" text-anchor="middle" font-size="12" font-weight="600" fill="#19222c">1</text><text x="68" y="435" font-weight="600" fill="#e4eaf0">Foundations: light, fiber, symbols</text><text x="68" y="450" font-size="10.5" fill="#95a3b1">§1 fiber, lasers, detectors, noise · §2 baud, NRZ, PAM4, coherent</text><text x="68" y="464" font-size="10.5" fill="#95a3b1">the companion Optics Bench for eyes and constellations</text><rect x="512" y="416" width="224" height="58" rx="6" fill="none" stroke="#6ea2ff" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="524" y="435" font-size="11" fill="#e4eaf0">explain why DR and FR live at</text><text x="524" y="450" font-size="11" fill="#e4eaf0">1310 nm, and what a receiver&#x27;s</text><text x="524" y="465" font-size="11" fill="#e4eaf0">sensitivity figure is made of</text></g><line x1="500" x2="500" y1="86" y2="474" stroke="#6f7f8f" stroke-dasharray="3 3"></line><text x="24" y="492" font-size="10.5" fill="#95a3b1">An expert works top-down too: a field symptom (rung 4) is explained by physics (rung 1) and settled by a measurement (rung 5).</text></svg>