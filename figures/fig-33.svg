<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 512" role="img" aria-label="Every cable type is the same two plugs; what sits in the plug and the medium between them set reach and power" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Same two plugs, different insides: the plug and the medium set reach and power</text><text x="24" y="50" font-size="11.5" fill="#586572">Schematic, one cable per row; status as of October 2026</text><g font-size="11.5" fill="#586572"><text x="24" y="78">Cable</text><text x="274" y="78" text-anchor="middle">Plug</text><text x="514" y="78" text-anchor="middle">Plug</text><text x="394" y="78" text-anchor="middle">Medium</text><text x="590" y="78">What it means</text></g><line x1="24" x2="736" y1="86" y2="86" stroke="#8794a1"></line><g><rect x="214" y="94" width="120" height="36" rx="6" fill="none" stroke="#d4632a" stroke-width="1.5"></rect><g stroke="#d4632a" stroke-width="3.2"><line x1="334" x2="454" y1="104" y2="104"></line><line x1="334" x2="454" y1="112" y2="112"></line><line x1="334" x2="454" y1="120" y2="120"></line></g><rect x="454" y="94" width="120" height="36" rx="6" fill="none" stroke="#d4632a" stroke-width="1.5"></rect><text x="24" y="109" font-weight="600" fill="#16202a">Passive copper (DAC)</text><text x="24" y="126" font-size="11.5" fill="#586572">Shipping</text><text x="274" y="116" text-anchor="middle" font-size="11.5" fill="#16202a">ID chip only</text><text x="514" y="116" text-anchor="middle" font-size="11.5" fill="#16202a">ID chip only</text><text x="394" y="97" text-anchor="middle" font-size="11" fill="#586572">thick twinax</text><text x="590" y="109" font-size="11.5" fill="#16202a">No power in the cable</text><text x="590" y="125" font-size="11.5" fill="#586572">Host does all the equalizing</text></g><g><rect x="214" y="156" width="120" height="36" rx="6" fill="#eef2f6" stroke="#d4632a" stroke-width="1.5"></rect><g stroke="#d4632a" stroke-width="3.2"><line x1="334" x2="454" y1="166" y2="166"></line><line x1="334" x2="454" y1="174" y2="174"></line><line x1="334" x2="454" y1="182" y2="182"></line></g><rect x="454" y="156" width="120" height="36" rx="6" fill="#eef2f6" stroke="#d4632a" stroke-width="1.5"></rect><text x="24" y="171" font-weight="600" fill="#16202a">Linear active copper (ACC)</text><text x="24" y="188" font-size="11.5" fill="#586572">Shipping</text><text x="274" y="178" text-anchor="middle" font-size="11.5" fill="#16202a">Linear redriver</text><text x="514" y="178" text-anchor="middle" font-size="11.5" fill="#16202a">Linear redriver</text><text x="394" y="159" text-anchor="middle" font-size="11" fill="#586572">twinax</text><text x="590" y="171" font-size="11.5" fill="#16202a">Boosts the lost high end</text><text x="590" y="187" font-size="11.5" fill="#586572">No clock recovery</text></g><g><rect x="214" y="218" width="120" height="36" rx="6" fill="#eef2f6" stroke="#d4632a" stroke-width="1.5"></rect><g stroke="#d4632a" stroke-width="2.2"><line x1="334" x2="454" y1="228" y2="228"></line><line x1="334" x2="454" y1="236" y2="236"></line><line x1="334" x2="454" y1="244" y2="244"></line></g><rect x="454" y="218" width="120" height="36" rx="6" fill="#eef2f6" stroke="#d4632a" stroke-width="1.5"></rect><text x="24" y="233" font-weight="600" fill="#16202a">Retimed copper (AEC)</text><text x="24" y="250" font-size="11.5" fill="#586572">Shipping</text><text x="274" y="240" text-anchor="middle" font-size="11.5" fill="#16202a">Retimer DSP</text><text x="514" y="240" text-anchor="middle" font-size="11.5" fill="#16202a">Retimer DSP</text><text x="394" y="221" text-anchor="middle" font-size="11" fill="#586572">twinax, can be thinner</text><text x="590" y="233" font-size="11.5" fill="#16202a">Recovers clock, resends</text><text x="590" y="249" font-size="11.5" fill="#586572">Can change lane rates</text></g><g><rect x="214" y="280" width="120" height="36" rx="6" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.5"></rect><line x1="334" x2="454" y1="298" y2="298" stroke="#1f5fcf" stroke-width="2"></line><rect x="454" y="280" width="120" height="36" rx="6" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="24" y="295" font-weight="600" fill="#16202a">Active optical (AOC)</text><text x="24" y="312" font-size="11.5" fill="#586572">Shipping</text><text x="274" y="302" text-anchor="middle" font-size="11.5" fill="#16202a">DSP, lasers, PDs</text><text x="514" y="302" text-anchor="middle" font-size="11.5" fill="#16202a">DSP, lasers, PDs</text><text x="394" y="283" text-anchor="middle" font-size="11" fill="#586572">fiber</text><text x="590" y="295" font-size="11.5" fill="#16202a">Optics sealed to the cable</text><text x="590" y="311" font-size="11.5" fill="#586572">Tens of meters</text></g><g><rect x="214" y="342" width="120" height="36" rx="6" fill="#eef2f6" stroke="#c23d7a" stroke-width="1.5"></rect><rect x="334" y="354" width="120" height="12" rx="6" fill="#c23d7a" fill-opacity="0.25" stroke="#c23d7a" stroke-width="1.25"></rect><rect x="454" y="342" width="120" height="36" rx="6" fill="#eef2f6" stroke="#c23d7a" stroke-width="1.5"></rect><text x="24" y="357" font-weight="600" fill="#16202a">RF over plastic waveguide</text><text x="24" y="374" font-size="11.5" fill="#586572">Emerging</text><text x="274" y="364" text-anchor="middle" font-size="11.5" fill="#16202a">mm-wave radio</text><text x="514" y="364" text-anchor="middle" font-size="11.5" fill="#16202a">mm-wave radio</text><text x="394" y="345" text-anchor="middle" font-size="11" fill="#586572">plastic waveguide</text><text x="590" y="357" font-size="11.5" fill="#16202a">A radio carrier in plastic</text><text x="590" y="373" font-size="11.5" fill="#586572">No lasers; low loss</text></g><g><rect x="214" y="404" width="120" height="36" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></rect><g fill="#12876a"><circle cx="342" cy="4