 of slow channels</text><text x="590" y="435" font-size="11.5" fill="#586572">LEDs instead of lasers</text></g><line x1="24" x2="736" y1="468" y2="468" stroke="#8794a1"></line><g><rect x="24" y="482" width="14" height="10" rx="2" fill="none" stroke="#b3bdc7" stroke-width="1.5"></rect><text x="44" y="491" font-size="11.5" fill="#586572">Unfilled plug: no signal processing</text><rect x="300" y="482" width="14" height="10" rx="2" fill="#eef2f6" stroke="#b3bdc7" stroke-width="1.5"></rect><text x="320" y="491" font-size="11.5" fill="#586572">Filled plug: powered electronics</text></g></svg>