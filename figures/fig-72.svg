<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 496" role="img" aria-label="An MZM works at any wavelength; a ring works only near its resonance" font-size="13"><defs><marker id="mod-light-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fcf"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">An MZM works at any wavelength; a ring works only near its resonance</text><text x="24" y="50" font-size="11.5" fill="#586572">Left: the device. Right: its output as the drive voltage or the wavelength changes</text><text x="24" y="84" font-weight="600" fill="#16202a">Mach-Zehnder modulator</text><g><rect x="150" y="112" width="170" height="16" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><rect x="150" y="192" width="170" height="16" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><text x="235" y="102" text-anchor="middle" font-size="11.5" fill="#586572">phase shifter: PN junction, a few mm long</text><text x="235" y="226" text-anchor="middle" font-size="11.5" fill="#586572">drive signal on each arm</text></g><g fill="none" stroke="#1f5fcf" stroke-width="1.75"><path d="M24 160H64L104 120H356L396 160H420" marker-end="url(#mod-light-arrow)"></path><path d="M64 160L104 200H356L396 160"></path></g><text x="24" y="150" font-size="11.5" fill="#586572">in</text><text x="428" y="164" font-size="11.5" fill="#586572">out</text><g><rect x="515" y="100" width="182" height="120" fill="#eef2f6"></rect><line x1="476" y1="100" x2="476" y2="220" stroke="#8794a1" stroke-width="1.25"></line><line x1="476" y1="220" x2="736" y2="220" stroke="#8794a1" stroke-width="1.25"></line><path d="M476.0 220.0L482.5 219.8L489.0 219.3L495.5 218.5L502.0 217.3L508.5 215.7L515.0 213.9L521.5 211.7L528.0 209.3L534.5 206.6L541.0 203.6L547.5 200.4L554.0 196.9L560.5 193.3L567.0 189.4L573.5 185.4L580.0 181.3L586.5 177.1L593.0 172.8L599.5 168.4L606.0 164.0L612.5 159.6L619.0 155.2L625.5 150.9L632.0 146.7L638.5 142.6L645.0 138.6L651.5 134.7L658.0 131.1L664.5 127.6L671.0 124.4L677.5 121.4L684.0 118.7L690.5 116.3L697.0 114.1L703.5 112.3L710.0 110.7L716.5 109.5L723.0 108.7L729.5 108.2L736.0 108.0" fill="none" stroke="#1f5fcf" stroke-width="2"></path><circle cx="515" cy="213.8963653545486" r="3.5" fill="#16202a"></circle><circle cx="575.658" cy="184.0740798660526" r="3.5" fill="#16202a"></circle><circle cx="636.342" cy="143.9259201339474" r="3.5" fill="#16202a"></circle><circle cx="697" cy="114.10363464545141" r="3.5" fill="#16202a"></circle><text x="476" y="94" font-size="11.5" fill="#586572">output power</text><text x="484" y="118" font-size="11.5" fill="#16202a">Four PAM4 levels:</text><text x="484" y="134" font-size="11.5" fill="#16202a">outer gaps shrink</text><text x="606" y="236" text-anchor="middle" font-size="11.5" fill="#586572">drive swing</text><text x="736" y="236" text-anchor="end" font-size="11.5" fill="#586572">drive voltage</text></g><line x1="24" x2="736" y1="252" y2="252" stroke="#dde3e9"></line><text x="24" y="280" font-weight="600" fill="#16202a">Micro-ring modulator</text><g><path d="M172 324A54 54 0 0 1 272 324" fill="none" stroke="#8794a1" stroke-width="3"></path><circle cx="222" cy="344" r="44" fill="none" stroke="#1f5fcf" stroke-width="2"></circle><text x="282" y="306" font-size="11.5" fill="#586572">heater keeps it on resonance</text><text x="282" y="350" font-size="11.5" fill="#586572">ring, a few µm in radius,</text><text x="282" y="366" font-size="11.5" fill="#586572">with a PN junction</text></g><g fill="none" stroke="#1f5fcf" stroke-width="1.75"><path d="M24 404H420" marker-end="url(#mod-light-arrow)"></path></g><text x="24" y="394" font-size="11.5" fill="#586572">in</text><text x="428" y="408" font-size="11.5" fill="#586572">out</text><g><line x1="476" y1="300" x2="476" y2="420" stroke="#8794a1" stroke-width="1.25"></line><line x1="476" y1="420" x2="736" y2="420" stroke="#8794a1" stroke-width="1.25"></line><path d="M476 309.5L480 309.6L484 309.7L488 309.9L492 310.0L496 310.2L500 310.4L504 310.6L508 310.9L512 311.1L516 311.5L520 311.9L524 312.3L528 312.9L532 313.5L536 314.3L540 315.3L544 316.5L548 318.1L552 320.0L556 322.6L560 326.0L564 330.7L568 337.1L572 346.0L576 358.4L580 374.7L584 393.2L588 406.8L592 406.8L596 393.2L600 374.7L604 358.4L608 346.0L612 337.1L616 330.7L620 326.0L624 322.6L628 320.0L632 318.1L636 316.5L640 315.3L644 314.3L648 313.5L652 312.9L656 312.3L660 311.9L664 311.5L668 311.1L672 310.9L676 310.6L680 310.4L684 310.2L688 310.0L692 309.9L696 309.7L700 309.6L704 309.5L708 309.4L712 309.3L716 309.2L720 309.2L724 309.1L728 309.0L732 309.0L736 308.9" fill="none" stroke="#1f5fcf" stroke-width="2"></path><path d="M476 309.0L480 309.1L484 309.2L488 309.2L492 309.3L496 309.4L500 309.5L504 309.6L508 309.7L512 309.9L516 310.0L520 310.2L524 310.4L528 310.6L532 310.9L536 311.1L540 311.5L544 311.9L548 312.3L552 312.9L556 313.5L560 314.3L564 315.3L568 316.5L572 318.1L576 320.0L580 322.6L584 326.0L588 330.7L592 337.1L596 346.0L600 358.4L604 374.7L608 393.2L612 406.8L616 406.8L620 393.2L624 374.7L628 358.4L632 346.0L636 337.1L640 330.7L644 326.0L648 322.6L652 320.0L656 318.1L660 316.5L664 315.3L668 314.3L672 313.5L676 312.9L680 312.3L684 311.9L688 311.5L692 311.1L696 310.9L700 310.6L704 310.4L708 310.2L712 310.0L716 309.9L720 309.7L724 309.6L728 309.5L732 309.4L736 309.3" fill="none" stroke="#1f5fcf" stroke-width="2" stroke-dasharray="5 4"></path><line x1="578" x2="578" y1="300" y2="420" stroke="#16202a" stroke-width="1" stroke-dasharray="2 3"></line><circle cx="578" cy="366.10823529411766" r="3.5" fill="#16202a"></circle><circle cx="578" cy="321.2418230563003" r="3.5" fill="#16202a"></circle><text x="476" y="292" font-size="11.5" fill="#586572">transmission</text><text x="578" y="292" text-anchor="middle" font-size="11.5" fill="#16202a">laser</text><text x="640" y="372" font-size="11.5" fill="#16202a">dip shifts with</text><text x="640" y="388" font-size="11.5" fill="#16202a">drive or heat</text><line x1="476" x2="496" y1="436" y2="436" stroke="#1f5fcf" stroke-width="2"></line><text x="502" y="440" font-size="11.5" fill="#586572">drive off</text><line x1="566" x2="586" y1="436" y2="436" stroke="#1f5fcf" stroke-width="2" stroke-dasharray="5 4"></line><text x="592" y="440" font-size="11.5" fill="#586572">drive on</text><text x="736" y="440" text-anchor="end" font-size="11.5" fill="#586572">wavelength</text></g><text x="24" y="474" font-size="11.5" fill="#586572">Both curves are nonlinear, so PAM4 needs pre-distortion; the ring also needs a lock loop because heat moves its dip.</text></svg>