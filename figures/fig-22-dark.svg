<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 440" role="img" aria-label="CWDM4 lanes spread 20 nm apart with wide tolerance, LAN-WDM lanes huddle within 15 nm of 1310 nm with tight tolerance" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">CWDM4 spreads four cheap lasers 20 nm apart; LAN-WDM huddles four cooled ones near 1310 nm</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">O-band lane plans to scale; each box is the allowed wavelength range of one lane, with the fiber&#x27;s dispersion curve beneath</text><g><g><line x1="150" x2="150" y1="84" y2="392" stroke="#26313d"></line><text x="150" y="410" text-anchor="middle" font-size="11" fill="#95a3b1">1260 nm</text></g><g><line x1="291.5" x2="291.5" y1="84" y2="392" stroke="#26313d"></line><text x="291.5" y="410" text-anchor="middle" font-size="11" fill="#95a3b1">1280 nm</text></g><g><line x1="433" x2="433" y1="84" y2="392" stroke="#26313d"></line><text x="433" y="410" text-anchor="middle" font-size="11" fill="#95a3b1">1300 nm</text></g><g><line x1="574.5" x2="574.5" y1="84" y2="392" stroke="#26313d"></line><text x="574.5" y="410" text-anchor="middle" font-size="11" fill="#95a3b1">1320 nm</text></g><g><line x1="716" x2="716" y1="84" y2="392" stroke="#26313d"></line><text x="716" y="410" text-anchor="middle" font-size="11" fill="#95a3b1">1340 nm</text></g></g><g><g><rect x="181.8375" y="98" width="91.975" height="28" rx="4" fill="#f08a4b" fill-opacity="0.22" stroke="#f08a4b" stroke-width="1.5"></rect><line x1="227.825" x2="227.825" y1="98" y2="126" stroke="#f08a4b" stroke-width="2"></line><text x="227.825" y="142" text-anchor="middle" font-size="10.5" fill="#95a3b1">1271</text></g><g><rect x="323.3375" y="98" width="91.97500000000002" height="28" rx="4" fill="#f08a4b" fill-opacity="0.22" stroke="#f08a4b" stroke-width="1.5"></rect><line x1="369.32500000000