l="#95a3b1">1304.6</text></g><g><rect x="490.23674999999946" y="158" width="14.857500000000925" height="28" rx="4" fill="#6ea2ff" fill-opacity="0.22" stroke="#6ea2ff" stroke-width="1.5"></rect><line x1="497.66550000000075" x2="497.66550000000075" y1="158" y2="186" stroke="#6ea2ff" stroke-width="2"></line><text x="497.66550000000075" y="214" text-anchor="middle" font-size="10.5" fill="#95a3b1">1309.1</text></g><g><rect x="464.83750000000003" y="218" width="91.97499999999997" height="28" rx="4" fill="#38c29b" fill-opacity="0.22" stroke="#38c29b" stroke-width="1.5"></rect><line x1="510.825" x2="510.825" y1="218" y2="246" stroke="#38c29b" stroke-width="2"></line><text x="510.825" y="262" text-anchor="middle" font-size="10.5" fill="#95a3b1">1311</text></g></g><g><text x="24" y="110" font-weight="600" fill="#e4eaf0">CWDM4</text><text x="24" y="126" font-size="11" fill="#95a3b1">±6.5 nm, uncooled DFB</text><text x="24" y="140" font-size="11" fill="#95a3b1">100G CWDM4, 400G FR4, 800G FR4</text><text x="24" y="170" font-weight="600" fill="#e4eaf0">LAN-WDM</text><text x="24" y="186" font-size="11" fill="#95a3b1">about ±1 nm, TEC-cooled</text><text x="24" y="200" font-size="11" fill="#95a3b1">100G LR4, 400G LR8, 800G LR4</text><text x="24" y="230" font-weight="600" fill="#e4eaf0">DR, parallel</text><text x="24" y="246" font-size="11" fill="#95a3b1">one wavelength per fiber</text><text x="24" y="260" font-size="11" fill="#95a3b1">DR1, DR4, DR8</text></g><g><g><line x1="150" x2="716" y1="380.5" y2="380.5" stroke="#26313d" stroke-width="1"></line><text x="142" y="384.5" text-anchor="end" font-size="11" fill="#95a3b1">-4</text></g><g><line x1="150" x2="716" y1="334.5" y2="334.5" stroke="#6f7f8f" stroke-width="1.25"></line><text x="142" y="338.5" text-anchor="end" font-size="11" fill="#95a3b1">0</text></g><g><line x1="150" x2="716" y1="311.5" y2="311.5" stroke="#26313d" stroke-width="1"></line><text x="142" y="315.5" text-anchor="end" font-size="11" fill="#95a3b1">2</text></g><line x1="150" x2="150" y1="300" y2="392" stroke="#6f7f8f" stroke-width="1.25"></line></g><text x="24" y="292" font-size="11.5" fill="#95a3b1">Dispersion D, ps/(nm·km), λ₀ = 1310 nm</text><path d="M150 390.62 L220.75 378.89 L291.5 367.39 L362.25 356.12 L433 345.195 L503.75 334.5 L574.5 324.03499999999997 L645.25 313.8 L716 303.795" fill="none" stroke="#9db1ff" stroke-width="2.25"></path><g><circle cx="150" cy="390.62" r="2.2" fill="#9db1ff"></circle><circle cx="220.75" cy="378.89" r="2.2" fill="#9db1ff"></circle><circle cx="291.5" cy="367.39" r="2.2" fill="#9db1ff"></circle><circle cx="362.25" cy="356.12" r="2.2" fill="#9db1ff"></circle><circle cx="433" cy="345.195" r="2.2" fill="#9db1ff"></circle><circle cx="503.75" cy="334.5" r="2.2" fill="#9db1ff"></circle><circle cx="574.5" cy="324.03499999999997" r="2.2" fill="#9db1ff"></circle><circle cx="645.25" cy="313.8" r="2.2" fill="#9db1ff"></circle><circle cx="716" cy="303.795" r="2.2" fill="#9db1ff"></circle></g><text x="158" y="314" font-size="11" fill="#95a3b1">outer CWDM lane: about −4 here, −40 to −60 ps/nm over 10 km</text><text x="716" y="364.4" text-anchor="end" font-size="11" fill="#95a3b1">LAN-WDM lanes: under 2 here, under 3 at the λ₀ = 1324 nm corner</text><g font-size="11" fill="#95a3b1"><text x="24" y="428">A DFB drifts about 0.1 nm per °C, 7 nm over a 70 °C range: it fits a 13 nm CWDM box uncooled, but a 2 nm LAN-WDM box needs a TEC.</text></g></svg>