<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 420" role="img" aria-label="PTP splits round-trip delay evenly, so any asymmetry becomes time error" font-size="13"><defs><marker id="ptp-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fcf"></path></marker><marker id="ptp-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d4632a"></path></marker><marker id="ptp-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">PTP splits round-trip delay evenly, so any asymmetry becomes time error</text><text x="24" y="48" font-size="11.5" fill="#586572">Two-way timestamp exchange over a path that is longer in one direction</text><g stroke="#8794a1" stroke-width="1.25"><line x1="160" x2="160" y1="92" y2="290"></line><line x1="520" x2="520" y1="92" y2="290"></line><path d="M64 100V282" fill="none" marker-end="url(#ptp-e)"></path></g><text x="56" y="96" text-anchor="end" font-size="11.5" fill="#586572">time</text><text x="160" y="80" text-anchor="middle" font-weight="600" fill="#16202a">Time transmitter</text><text x="520" y="80" text-anchor="middle" font-weight="600" fill="#16202a">Time receiver</text><g><path d="M160 112L518 192" fill="none" stroke="#1f5fcf" stroke-width="2" marker-end="url(#ptp-f)"></path><text x="330" y="128" font-size="11.5" fill="#16202a">Sync: forward path, longer</text><text x="152" y="116" text-anchor="end" font-size="12" font-weight="600" fill="#16202a">t1</text><text x="530" y="196" font-size="12" font-weight="600" fill="#16202a">t2</text></g><g><path d="M520 232L162 272" fill="none" stroke="#d4632a" stroke-width="2" marker-end="url(#ptp-r)"></path><text x="340" y="224" text-anchor="middle" font-size="11.5" fill="#16202a">Delay_Req: reverse path, shorter</text><text x="530" y="236" font-size="12" font-weight="600" fill="#16202a">t3</text><text x="152" y="276" text-anchor="end" font-size="12" font-weight="600" fill="#16202a">t4</text></g><g><rect x="24" y="306" width="712" height="100" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="40" y="330" font-weight="600" fill="#16202a">PTP assumes the forward and reverse delays are equal</text><text x="40" y="350" font-size="12" fill="#16202a">measured delay = ((t2 − t1) + (t4 − t3)) ÷ 2</text><text x="40" y="370" font-size="12" font-weight="600" fill="#16202a">time error = (forward delay − reverse delay) ÷ 2</text><text x="40" y="392" font-size="11.5" fill="#586572">Example: 1 m of extra fiber in one direction ≈ 5 ns of asymmetry ≈ 2.5 ns of time error</text></g></svg>