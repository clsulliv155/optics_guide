<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 500" role="img" aria-label="Cisco covers every reach at 100G and 400G; 800G and 1.6T are still filling in" font-size="11.5"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Cisco covers every reach at 100G and 400G; 800G and 1.6T are still filling in</text><text x="24" y="50" fill="#586572">Cisco pluggables by speed and reach, from its data sheets as of October 2026</text><g><text x="120" y="76" font-size="12.5" font-weight="600" fill="#16202a">Multimode</text><text x="120" y="92" fill="#586572">up to 150 m</text><text x="225" y="76" font-size="12.5" font-weight="600" fill="#16202a">DR</text><text x="225" y="92" fill="#586572">500 m</text><text x="330" y="76" font-size="12.5" font-weight="600" fill="#16202a">FR, DR-2</text><text x="330" y="92" fill="#586572">2 km</text><text x="435" y="76" font-size="12.5" font-weight="600" fill="#16202a">LR</text><text x="435" y="92" fill="#586572">10 km</text><text x="540" y="76" font-size="12.5" font-weight="600" fill="#16202a">Grey, long</text><text x="540" y="92" fill="#586572">20–80 km</text><text x="645" y="76" font-size="12.5" font-weight="600" fill="#16202a">Coherent</text><text x="645" y="92" fill="#586572">DWDM</text></g><g><text x="24" y="126" font-size="14" font-weight="600" fill="#16202a">100G</text><text x="24" y="144" fill="#586572">QSFP28</text><text x="24" y="226" font-size="14" font-weight="600" fill="#16202a">400G</text><text x="24" y="244" fill="#586572">QSFP-DD,</text><text x="24" y="260" fill="#586572">QSFP112</text><text x="24" y="326" font-size="14" font-weight="600" fill="#16202a">800G</text><text x="24" y="344" fill="#586572">OSFP,</text><text x="24" y="360" fill="#586572">QSFP-DD800</text><text x="24" y="410" font-size="14" font-weight="600" fill="#16202a">1.6T</text><text x="24" y="428" fill="#586572">OSFP</text></g><g><r