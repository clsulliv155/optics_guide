<svg xmlns="http://www.w3.org/2000/svg" width="760" height="568" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 568" role="img" aria-label="A Cisco grey PID reads form factor, speed, PMD, then suffix" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">A Cisco grey PID reads form factor, speed, PMD, then suffix</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Five real PIDs taken apart; Cisco&#x27;s 40G sheet calls -S parts S-Class without defining it</text><text x="24" y="76" font-weight="600" fill="#e4eaf0">Grey PIDs</text><text x="736" y="76" text-anchor="end" font-size="11.5" fill="#95a3b1">As ordered</text><text x="736" y="108" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e4eaf0">QSFP-100G-DR-S</text><text x="736" y="200" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e4eaf0">QDD-4X100G-FR-S</text><text x="736" y="292" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e4eaf0">OSFP-800G-DR8P</text><text x="736" y="384" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e4eaf0">OSFP-L800G-DR8P</text><g><rect x="24" y="88" width="56" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="34" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">QSFP</text><line x1="161" x2="169" y1="103" y2="103" stroke="#95a3b1" stroke-width="2"></line><rect x="176" y="88" width="56" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="186" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">100G</text><line x1="313" x2="321" y1="103" y2="103" stroke="#95a3b1" stroke-width="2"></line><rect x="328" y="88" width="38" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="338" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">DR</text><line x1="465" x2="473" y1="103" y2="103" stroke="#95a3b1" stroke-width="2"></line><rect x="480" y="88" width="29" height="30" rx="6" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.25"></rect><text x="490" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">S</text><text x="24" y="136" font-size="11.5" fill="#95a3b1">QSFP28 module</text><text x="176" y="136" font-size="11.5" fill="#95a3b1">Port speed</text><text x="328" y="136" font-size="11.5" fill="#95a3b1">PMD: 500 m, one</text><text x="328" y="152" font-size="11.5" fill="#95a3b1">100G wavelength</text><text x="480" y="136" font-size="11.5" fill="#95a3b1">S-Class; Cisco does</text><text x="480" y="152" font-size="11.5" fill="#95a3b1">not define it</text></g><g><rect x="24" y="180" width="47" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="34" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">QDD</text><line x1="161" x2="169" y1="195" y2="195" stroke="#95a3b1" stroke-width="2"></line><rect x="176" y="180" width="74" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="186" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">4X100G</text><line x1="313" x2="321" y1="195" y2="195" stroke="#95a3b1" stroke-width="2"></line><rect x="328" y="180" width="38" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="338" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">FR</text><line x1="465" x2="473" y1="195" y2="195" stroke="#95a3b1" stroke-width="2"></line><rect x="480" y="180" width="29" height="30" rx="6" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.25"></rect><text x="490" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">S</text><text x="24" y="228" font-size="11.5" fill="#95a3b1">QSFP-DD module</text><text x="176" y="228" font-size="11.5" fill="#95a3b1">Four 100G ports</text><text x="176" y="244" font-size="11.5" fill="#95a3b1">in one module</text><text x="328" y="228" font-size="11.5" fill="#95a3b1">PMD: 2 km per lane</text><text x="480" y="228" font-size="11.5" fill="#95a3b1">Same suffix</text></g><g><rect x="24" y="272" width="56" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="34" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">OSFP</text><line x1="161" x2="169" y1="287" y2="287" stroke="#95a3b1" stroke-width="2"></line><rect x="176" y="272" width="56" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="186" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">800G</text><line x1="313" x2="321" y1="287" y2="287" stroke="#95a3b1" stroke-width="2"></line><rect x="328" y="272" width="47" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="338" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">DR8</text><rect x="480" y="272" width="29" height="30" rx="6" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.25"></rect><text x="490" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">P</text><text x="24" y="320" font-size="11.5" fill="#95a3b1">OSFP module</text><text x="176" y="320" font-size="11.5" fill="#95a3b1">Port speed</text><text x="328" y="320" font-size="11.5" fill="#95a3b1">PMD: 8 lanes, 500 m</text><text x="480" y="320" font-size="11.5" fill="#95a3b1">One MPO-16, not two</text><text x="480" y="336" font-size="11.5" fill="#95a3b1">MPO-12s (no hyphen)</text></g><g><rect x="24" y="364" width="56" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="34" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">OSFP</text><line x1="161" x2="169" y1="379" y2="379" stroke="#95a3b1" stroke-width="2"></line><rect x="176" y="364" width="65" height="30" rx="6" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.25"></rect><text x="186" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">L800G</text><line x1="313" x2="321" y1="379" y2="379" stroke="#95a3b1" stroke-width="2"></line><rect x="328" y="364" width="47" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="338" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">DR8</text><rect x="480" y="364" width="29" height="30" rx="6" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.25"></rect><text x="490" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">P</text><text x="176" y="412" font-size="11.5" fill="#95a3b1">L marks linear (LPO),</text><text x="176" y="428" font-size="11.5" fill="#95a3b1">named for Q3 2026</text></g><line x1="24" x2="736" y1="444" y2="444" stroke="#26313d"></line><text x="24" y="468" font-weight="600" fill="#e4eaf0">Coherent PIDs</text><text x="736" y="468" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e4eaf0">DP08SFP8-ZRB-A2</text><g><rect x="24" y="480" width="38" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="34" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">DP</text><rect x="176" y="480" width="38" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="186" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">08</text><rect x="328" y="480" width="56" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="338" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">SFP8</text><line x1="465" x2="473" y1="495" y2="495" stroke="#95a3b1" stroke-width="2"></line><rect x="480" y="480" width="47" height="30" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.25"></rect><text x="490" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">ZRB</text><line x1="617" x2="625" y1="495" y2="495" stroke="#95a3b1" stroke-width="2"></line><rect x="632" y="480" width="38" height="30" rx="6" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.25"></rect><text x="642" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e4eaf0">A2</text><text x="24" y="528" font-size="11.5" fill="#95a3b1">Coherent pluggable</text><text x="176" y="528" font-size="11.5" fill="#95a3b1">Speed in 100G units:</text><text x="176" y="544" font-size="11.5" fill="#95a3b1">01, 04 or 08</text><text x="328" y="528" font-size="11.5" fill="#95a3b1">SFP8 = OSFP,</text><text x="328" y="544" font-size="11.5" fill="#95a3b1">QSDD = QSFP-DD</text><text x="480" y="528" font-size="11.5" fill="#95a3b1">ZRB = 800G ZR+,</text><text x="480" y="544" font-size="11.5" fill="#95a3b1">ZRA = 800ZR</text><text x="632" y="528" font-size="11.5" fill="#95a3b1">Ordering suffix</text></g></svg>