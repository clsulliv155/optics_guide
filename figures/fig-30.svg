<svg xmlns="http://www.w3.org/2000/svg" width="760" height="708" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 708" role="img" aria-label="Each tier of an AI cluster has its own optics trade-off" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Each tier of an AI cluster has its own optics trade-off</text><text x="24" y="50" font-size="11.5" fill="#586572">From the GPU outward; each chip names the section whose pros-and-cons callout covers that choice</text><g><rect x="24" y="76" width="712" height="140" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><text x="40" y="104" font-weight="600" fill="#16202a">Scale-up</text><text x="40" y="122" font-size="11.5" fill="#586572">in rack or pod, 1–2 m</text><rect x="216" y="84" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="107" font-size="12" fill="#16202a">Copper vs AEC vs optics</text><text x="448" y="107" text-anchor="end" font-size="11.5" fill="#586572">§9</text><rect x="476" y="84" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="107" font-size="12" fill="#16202a">CPO and NPO for multi-rack</text><text x="708" y="107" text-anchor="end" font-size="11.5" fill="#586572">§10</text><rect x="216" y="128" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="151" font-size="12" fill="#16202a">Lighter FEC for latency</text><text x="448" y="151" text-anchor="end" font-size="11.5" fill="#586572">§5</text><rect x="476" y="128" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="151" font-size="12" fill="#16202a">Fast/narrow vs slow/wide</text><text x="708" y="151" text-anchor="end" font-size="11.5" fill="#586572">§10</text><rect x="216" y="172" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="195" font-size="12" fill="#16202a">CPC vs OCI optics</text><text x="448" y="195" text-anchor="end" font-size="11.5" fill="#586572">§10</text><rect x="476" y="172" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="195" font-size="12" fill="#16202a">AEC, AOC, RF or microLED cable</text><text x="708" y="195" text-anchor="end" font-size="11.5" fill="#586572">§9</text></g><g><rect x="24" y="232" width="712" height="272" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><text x="40" y="260" font-weight="600" fill="#16202a">Scale-out back-end</text><text x="40" y="278" font-size="11.5" fill="#586572">2 m to 2 km</text><rect x="216" y="240" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.2" stroke="#1f5fcf" stroke-width="2.25"></rect><text x="228" y="263" font-size="12" font-weight="600" fill="#16202a">Retimed vs LRO vs LPO</text><text x="448" y="263" text-anchor="end" font-size="11.5" fill="#586572">§4</text><rect x="476" y="240" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="263" font-size="12" fill="#16202a">Pluggable vs XPO, NPO, CPO</text><text x="708" y="263" text-anchor="end" font-size="11.5" fill="#586572">§10</text><rect x="216" y="284" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="307" font-size="12" fill="#16202a">Multimode vs single-mode</text><text x="448" y="307" text-anchor="end" font-size="11.5" fill="#586572">§6</text><rect x="476" y="284" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="307" font-size="12" fill="#16202a">Parallel vs WDM fiber</text><text x="708" y="307" text-anchor="end" font-size="11.5" fill="#586572">§6</text><rect x="216" y="328" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="351" font-size="12" fill="#16202a">External vs built-in lasers</text><text x="448" y="351" text-anchor="end" font-size="11.5" fill="#586572">§10</text><rect x="476" y="328" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="351" font-size="12" fill="#16202a">Silicon photonics vs EML</text><text x="708" y="351" text-anchor="end" font-size="11.5" fill="#586572">§25</text><rect x="216" y="372" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="395" font-size="12" fill="#16202a">OCS vs packet spine</text><text x="448" y="395" text-anchor="end" font-size="11.5" fill="#586572">§19</text><rect x="476" y="372" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="395" font-size="12" fill="#16202a">Dense NPO and retiming</text><text x="708" y="395" text-anchor="end" font-size="11.5" fill="#586572">§10</text><rect x="216" y="416" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="439" font-size="12" fill="#16202a">MPO vs VSFF connectors</text><text x="448" y="439" text-anchor="end" font-size="11.5" fill="#586572">§16</text><rect x="476" y="416" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="439" font-size="12" fill="#16202a">Fewer fibers: WDM, BiDi, MCF</text><text x="708" y="439" text-anchor="end" font-size="11.5" fill="#586572">§16</text><rect x="216" y="460" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="483" font-size="12" fill="#16202a">LPO switch, FRO accelerator</text><text x="448" y="483" text-anchor="end" font-size="11.5" fill="#586572">§4</text></g><g><rect x="24" y="520" width="712" height="96" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><text x="40" y="548" font-weight="600" fill="#16202a">Campus</text><text x="40" y="566" font-size="11.5" fill="#586572">2–10 km,</text><text x="40" y="582" font-size="11.5" fill="#586572">between buildings</text><rect x="216" y="528" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="551" font-size="12" fill="#16202a">PAM4 LR vs coherent-lite</text><text x="448" y="551" text-anchor="end" font-size="11.5" fill="#586572">§8</text><rect x="476" y="528" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="551" font-size="12" fill="#16202a">Inner FEC for 2 km+ links</text><text x="708" y="551" text-anchor="end" font-size="11.5" fill="#586572">§5</text><rect x="216" y="572" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="595" font-size="12" fill="#16202a">Hollow-core vs standard fiber</text><text x="448" y="595" text-anchor="end" font-size="11.5" fill="#586572">§17</text></g><g><rect x="24" y="632" width="712" height="52" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><text x="40" y="654" font-weight="600" fill="#16202a">Between sites</text><text x="40" y="672" font-size="11.5" fill="#586572">10 km and beyond</text><rect x="216" y="640" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="228" y="663" font-size="12" fill="#16202a">ZR/ZR+ vs transponders</text><text x="448" y="663" text-anchor="end" font-size="11.5" fill="#586572">§8</text><rect x="476" y="640" width="244" height="36" rx="8" fill="#1f5fcf" fill-opacity="0.08" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="488" y="663" font-size="12" fill="#16202a">Encrypt every hop or DCI only</text><text x="708" y="663" text-anchor="end" font-size="11.5" fill="#586572">§21</text></g></svg>