<svg xmlns="http://www.w3.org/2000/svg" width="760" height="568" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 568" role="img" aria-label="A Cisco grey PID reads form factor, speed, PMD, then suffix" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">A Cisco grey PID reads form factor, speed, PMD, then suffix</text><text x="24" y="50" font-size="11.5" fill="#586572">Five real PIDs taken apart; Cisco&#x27;s 40G sheet calls -S parts S-Class without defining it</text><text x="24" y="76" font-weight="600" fill="#16202a">Grey PIDs</text><text x="736" y="76" text-anchor="end" font-size="11.5" fill="#586572">As ordered</text><text x="736" y="108" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16202a">QSFP-100G-DR-S</text><text x="736" y="200" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16202a">QDD-4X100G-FR-S</text><text x="736" y="292" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16202a">OSFP-800G-DR8P</text><text x="736" y="384" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16202a">OSFP-L800G-DR8P</text><g><rect x="24" y="88" width="56" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="34" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">QSFP</text><line x1="161" x2="169" y1="103" y2="103" stroke="#586572" stroke-width="2"></line><rect x="176" y="88" width="56" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="186" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">100G</text><line x1="313" x2="321" y1="103" y2="103" stroke="#586572" stroke-width="2"></line><rect x="328" y="88" width="38" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="338" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">DR</text><line x1="465" x2="473" y1="103" y2="103" stroke="#586572" stroke-width="2"></line><rect x="480" y="88" width="29" height="30" rx="6" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.25"></rect><text x="490" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">S</text><text x="24" y="136" font-size="11.5" fill="#586572">QSFP28 module</text><text x="176" y="136" font-size="11.5" fill="#586572">Port speed</text><text x="328" y="136" font-size="11.5" fill="#586572">PMD: 500 m, one</text><text x="328" y="152" font-size="11.5" fill="#586572">100G wavelength</text><text x="480" y="136" font-size="11.5" fill="#586572">S-Class; Cisco does</text><text x="480" y="152" font-size="11.5" fill="#586572">not define it</text></g><g><rect x="24" y="180" width="47" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="34" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">QDD</text><line x1="161" x2="169" y1="195" y2="195" stroke="#586572" stroke-width="2"></line><rect x="176" y="180" width="74" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="186" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">4X100G</text><line x1="313" x2="321" y1="195" y2="195" stroke="#586572" stroke-width="2"></line><rect x="328" y="180" width="38" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="338" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">FR</text><line x1="465" x2="473" y1="195" y2="195" stroke="#586572" stroke-width="2"></line><rect x="480" y="180" width="29" height="30" rx="6" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.25"></rect><text x="490" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">S</text><text x="24" y="228" font-size="11.5" fill="#586572">QSFP-DD module</text><text x="176" y="228" font-size="11.5" fill="#586572">Four 100G ports</text><text x="176" y="244" font-size="11.5" fill="#586572">in one module</text><text x="328" y="228" font-size="11.5" fill="#586572">PMD: 2 km per lane</text><text x="480" y="228" font-size="11.5" fill="#586572">Same suffix</text></g><g><rect x="24" y="272" width="56" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="34" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">OSFP</text><line x1="161" x2="169" y1="287" y2="287" stroke="#586572" stroke-width="2"></line><rect x="176" y="272" width="56" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="186" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">800G</text><line x1="313" x2="321" y1="287" y2="287" stroke="#586572" stroke-width="2"></line><rect x="328" y="272" width="47" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="338" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">DR8</text><rect x="480" y="272" width="29" height="30" rx="6" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.25"></rect><text x="490" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">P</text><text x="24" y="320" font-size="11.5" fill="#586572">OSFP module</text><text x="176" y="320" font-size="11.5" fill="#586572">Port speed</text><text x="328" y="320" font-size="11.5" fill="#586572">PMD: 8 lanes, 500 m</text><text x="480" y="320" font-size="11.5" fill="#586572">One MPO-16, not two</text><text x="480" y="336" font-size="11.5" fill="#586572">MPO-12s (no hyphen)</text></g><g><rect x="24" y="364" width="56" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="34" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">OSFP</text><line x1="161" x2="169" y1="379" y2="379" stroke="#586572" stroke-width="2"></line><rect x="176" y="364" width="65" height="30" rx="6" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.25"></rect><text x="186" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">L800G</text><line x1="313" x2="321" y1="379" y2="379" stroke="#586572" stroke-width="2"></line><rect x="328" y="364" width="47" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="338" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">DR8</text><rect x="480" y="364" width="29" height="30" rx="6" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.25"></rect><text x="490" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">P</text><text x="176" y="412" font-size="11.5" fill="#586572">L marks linear (LPO),</text><text x="176" y="428" font-size="11.5" fill="#586572">named for Q3 2026</text></g><line x1="24" x2="736" y1="444" y2="444" stroke="#dde3e9"></line><text x="24" y="468" font-weight="600" fill="#16202a">Coherent PIDs</text><text x="736" y="468" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#16202a">DP08SFP8-ZRB-A2</text><g><rect x="24" y="480" width="38" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="34" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">DP</text><rect x="176" y="480" width="38" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="186" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">08</text><rect x="328" y="480" width="56" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="338" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">SFP8</text><line x1="465" x2="473" y1="495" y2="495" stroke="#586572" stroke-width="2"></line><rect x="480" y="480" width="47" height="30" rx="6" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="490" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">ZRB</text><line x1="617" x2="625" y1="495" y2="495" stroke="#586572" stroke-width="2"></line><rect x="632" y="480" width="38" height="30" rx="6" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.25"></rect><text x="642" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#16202a">A2</text><text x="24" y="528" font-size="11.5" fill="#586572">Coherent pluggable</text><text x="176" y="528" font-size="11.5" fill="#586572">Speed in 100G units:</text><text x="176" y="544" font-size="11.5" fill="#586572">01, 04 or 08</text><text x="328" y="528" font-size="11.5" fill="#586572">SFP8 = OSFP,</text><text x="328" y="544" font-size="11.5" fill="#586572">QSDD = QSFP-DD</text><text x="480" y="528" font-size="11.5" fill="#586572">ZRB = 800G ZR+,</text><text x="480" y="544" font-size="11.5" fill="#586572">ZRA = 800ZR</text><text x="632" y="528" font-size="11.5" fill="#586572">Ordering suffix</text></g></svg>