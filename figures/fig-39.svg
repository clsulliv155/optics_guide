<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 456" role="img" aria-label="Each step inward shortens the electrical path the SerDes must drive" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">Each step inward shortens the electrical path the SerDes must drive</text><text x="24" y="48" font-size="11.5" fill="#586572">Schematic, not to scale; one switch port shown per approach</text><g><line x1="24" x2="48" y1="66" y2="66" stroke="#1f5fcf" stroke-width="3"></line><text x="54" y="70" font-size="11.5" fill="#586572">electrical path</text><line x1="160" x2="184" y1="66" y2="66" stroke="#d4632a" stroke-width="2"></line><text x="190" y="70" font-size="11.5" fill="#586572">fiber</text></g><g><line x1="708" x2="708" y1="94" y2="402" stroke="#8794a1" stroke-dasharray="5 4"></line><text x="736" y="86" text-anchor="end" font-size="11.5" fill="#586572">front panel</text></g><g><text x="24" y="118" font-weight="600" fill="#16202a">Pluggable</text><text x="24" y="134" font-size="11.5" fill="#586572">retimed DSP module</text><g><rect x="176" y="102" width="72" height="36" rx="6" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="212" y="125" text-anchor="middle" font-weight="600" fill="#16202a">ASIC</text></g><line x1="248" x2="612" y1="120" y2="120" stroke="#1f5fcf" stroke-width="3"></line><text x="430" y="110" text-anchor="middle" font-size="11.5" fill="#586572">10–30 cm of board trace</text><rect x="612" y="100" width="104" height="40" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="664" y="124" text-anchor="middle" font-size="11.5" fill="#16202a">DSP + optics</text><line x1="716" x2="736" y1="120" y2="120" stroke="#d4632a" stroke-width="2"></line></g><g><text x="24" y="182" font-weight="600" fill="#16202a">LPO / LRO</text><text x="24" y="198" font-size="11.5" fill="#586572">DSP removed/halved</text><g><rect x="176" y="166" width="72" height="36" rx="6" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="212" y="189" text-anchor="middle" font-weight="600" fill="#16202a">ASIC</text></g><line x1="248" x2="612" y1="184" y2="184" stroke="#1f5fcf" stroke-width="3"></line><text x="430" y="174" text-anchor="middle" font-size="11.5" fill="#586572">same path; the host SerDes does more work</text><rect x="612" y="164" width="104" height="40" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="664" y="188" text-anchor="middle" font-size="11.5" fill="#16202a">linear optics</text><line x1="716" x2="736" y1="184" y2="184" stroke="#d4632a" stroke-width="2"></line></g><g><text x="24" y="246" font-weight="600" fill="#16202a">XPO</text><text x="24" y="262" font-size="11.5" fill="#586572">dense, liquid-cooled</text><g><rect x="176" y="230" width="72" height="36" rx="6" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="212" y="253" text-anchor="middle" font-weight="600" fill="#16202a">ASIC</text></g><line x1="248" x2="580" y1="248" y2="248" stroke="#1f5fcf" stroke-width="3"></line><text x="414" y="238" text-anchor="middle" font-size="11.5" fill="#586572">board trace to one 64-lane module</text><rect x="580" y="224" width="136" height="48" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="648" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#16202a">XPO, 12.8T</text><text x="648" y="261" text-anchor="middle" font-size="11.5" fill="#16202a">liquid-cooled</text><line x1="716" x2="736" y1="248" y2="248" stroke="#d4632a" stroke-width="2"></line></g><g><text x="24" y="310" font-weight="600" fill="#16202a">NPO</text><text x="24" y="326" font-size="11.5" fill="#586572">engine near the ASIC</text><g><rect x="176" y="294" width="72" height="36" rx="6" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="212" y="317" text-anchor="middle" font-weight="600" fill="#16202a">ASIC</text></g><line x1="248" x2="300" y1="312" y2="312" stroke="#1f5fcf" stroke-width="3"></line><text x="274" y="288" text-anchor="middle" font-size="11.5" fill="#586572">a few cm</text><rect x="300" y="294" width="72" height="36" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="336" y="316" text-anchor="middle" font-size="11.5" fill="#16202a">engine</text><line x1="372" x2="736" y1="312" y2="312" stroke="#d4632a" stroke-width="2"></line><text x="540" y="304" text-anchor="middle" font-size="11.5" fill="#586572">fiber to the front panel</text></g><g><text x="24" y="374" font-weight="600" fill="#16202a">CPO</text><text x="24" y="390" font-size="11.5" fill="#586572">engine in the package</text><rect x="168" y="350" width="132" height="52" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25" stroke-dasharray="4 3"></rect><g><rect x="176" y="358" width="72" height="36" rx="6" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="212" y="381" text-anchor="middle" font-weight="600" fill="#16202a">ASIC</text></g><line x1="248" x2="254" y1="376" y2="376" stroke="#1f5fcf" stroke-width="3"></line><rect x="254" y="358" width="40" height="36" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="274" y="380" text-anchor="middle" font-size="11.5" fill="#16202a">OE</text><text x="234" y="418" text-anchor="middle" font-size="11.5" fill="#586572">one package, mm apart</text><line x1="294" x2="736" y1="376" y2="376" stroke="#d4632a" stroke-width="2"></line><text x="500" y="368" text-anchor="middle" font-size="11.5" fill="#586572">fiber to panel; lasers in front-panel ELSFPs</text></g><text x="24" y="440" font-size="11.5" fill="#586572">Shorter electrical paths need less equalization, so power per bit falls as optics move inward. OE = optical engine.</text></svg>