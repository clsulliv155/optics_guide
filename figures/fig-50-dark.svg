<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 352" role="img" aria-label="A 1.6T module is eight 200G lanes, packaged three ways on the fiber side" font-size="13"><defs><marker id="t16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7f8f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#e4eaf0">A 1.6T module is eight 200G lanes, packaged three ways on the fiber side</text><text x="24" y="48" font-size="11.5" fill="#95a3b1">Same 8 × 200G electrical interface; the optics decide one 1.6T port or two 800G ports</text><g><rect x="24" y="96" width="148" height="136" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="98" y="120" text-anchor="middle" font-weight="600" fill="#e4eaf0">Switch ASIC</text><text x="98" y="138" text-anchor="middle" font-size="11.5" fill="#e4eaf0">8 × 200G SerDes</text><text x="98" y="154" text-anchor="middle" font-size="11.5" fill="#e4eaf0">1.6TAUI-8</text><text x="98" y="170" text-anchor="middle" font-size="11.5" fill="#95a3b1">106.25 GBd PAM4</text></g><g stroke="#6f7f8f" stroke-width="1.25"><line x1="172" x2="220" y1="108" y2="108"></line><line x1="172" x2="220" y1="124" y2="124"></line><line x1="172" x2="220" y1="140" y2="140"></line><line x1="172" x2="220" y1="156" y2="156"></line><line x1="172" x2="220" y1="172" y2="172"></line><line x1="172" x2="220" y1="188" y2="188"></line><line x1="172" x2="220" y1="204" y2="204"></line><line x1="172" x2="220" y1="220" y2="220"></line></g><g><rect x="220" y="88" width="168" height="152" rx="8" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="2"></rect><text x="304" y="112" text-anchor="middle" font-weight="600" fill="#e4eaf0">OSFP1600 module</text><text x="304" y="130" text-anchor="middle" font-size="11.5" fill="#e4eaf0">200G-lane DSP (3 nm)</text><text x="304" y="146" text-anchor="middle" font-size="11.5" fill="#e4eaf0">8 EML lasers, or silicon</text><text x="304" y="162" text-anchor="middle" font-size="11.5" fill="#e4eaf0">photonics + CW laser</text><text x="304" y="186" text-anchor="middle" font-size="11.5" fill="#95a3b1">~20–26 W retimed</text><text x="304" y="202" text-anchor="middle" font-size="11.5" fill="#95a3b1">under 10 W as LPO</text></g><g fill="none" stroke="#6f7f8f" stroke-width="1.25"><path d="M388 140H414V104H438" marker-end="url(#t16-arrow)"></path><path d="M388 164H414V180H438" marker-end="url(#t16-arrow)"></path><path d="M388 188H414V256H438" marker-end="url(#t16-arrow)"></path></g><g><rect x="440" y="72" width="296" height="64" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="456" y="94" font-weight="600" fill="#e4eaf0">1.6T DR8 / DR8-2</text><text x="456" y="112" font-size="11.5" fill="#e4eaf0">8 fiber pairs, MPO-16 APC</text><text x="456" y="128" font-size="11.5" fill="#95a3b1">one 1.6T port, 500 m or 2 km</text></g><g><rect x="440" y="148" width="296" height="64" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="456" y="170" font-weight="600" fill="#e4eaf0">2×DR4</text><text x="456" y="188" font-size="11.5" fill="#e4eaf0">two MPO-12 APC, 4 fiber pairs each</text><text x="456" y="204" font-size="11.5" fill="#95a3b1">two 800G ports, 500 m or 2 km</text></g><g><rect x="440" y="224" width="296" height="64" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="456" y="246" font-weight="600" fill="#e4eaf0">2×FR4</text><text x="456" y="264" font-size="11.5" fill="#e4eaf0">two duplex LC, 4 wavelengths each</text><text x="456" y="280" font-size="11.5" fill="#95a3b1">two 800G ports, 2 km</text></g><text x="24" y="318" font-size="11.5" fill="#e4eaf0">102.4 Tb/s switch = 512 × 200G SerDes = 64 of these modules.</text><text x="24" y="336" font-size="11.5" fill="#95a3b1">Optical lanes run 106.25 GBd at 500 m, and 113.4375 GBd with the inner FEC on 2 km links.</text></svg>