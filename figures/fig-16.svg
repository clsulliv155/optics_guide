<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 320" role="img" aria-label="2 km-plus 200G links nest an inner code inside the end-to-end code" font-size="13"><defs><marker id="fec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">2 km-plus 200G links nest an inner code inside the end-to-end code</text><text x="24" y="48" font-size="11.5" fill="#586572">Transmit direction shown; 500 m DR links use the outer code alone</text><g><rect x="24" y="62" width="712" height="32" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="2"></rect><text x="380" y="83" text-anchor="middle" fill="#16202a">Outer code: RS(544,514), host A to host B</text><g stroke="#1f5fcf" stroke-width="1.25" stroke-dasharray="3 3"><line x1="84" x2="84" y1="94" y2="162"></line><line x1="676" x2="676" y1="94" y2="162"></line></g></g><g><rect x="172" y="108" width="416" height="32" rx="8" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="2"></rect><text x="380" y="129" text-anchor="middle" fill="#16202a">Inner code: Hamming(128,120), module to module</text><g stroke="#d4632a" stroke-width="1.25" stroke-dasharray="3 3"><line x1="232" x2="232" y1="140" y2="162"></line><line x1="528" x2="528" y1="140" y2="162"></line></g></g><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M144 188H170" marker-end="url(#fec-arrow)"></path><path d="M292 188H318" marker-end="url(#fec-arrow)"></path><path d="M440 188H466" marker-end="url(#fec-arrow)"></path><path d="M588 188H614" marker-end="url(#fec-arrow)"></path></g><g><rect x="24" y="164" width="120" height="48" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.75"></rect><text x="84" y="192" text-anchor="middle" font-weight="600" fill="#16202a">Host A</text></g><g><rect x="172" y="164" width="120" height="48" rx="8" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.75"></rect><text x="232" y="192" text-anchor="middle" font-weight="600" fill="#16202a">Module A</text></g><g><rect x="320" y="164" width="120" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="380" y="192" text-anchor="middle" font-weight="600" fill="#16202a">Fiber, 2 km+</text></g><g><rect x="468" y="164" width="120" height="48" rx="8" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.75"></rect><text x="528" y="192" text-anchor="middle" font-weight="600" fill="#16202a">Module B</text></g><g><rect x="616" y="164" width="120" height="48" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.75"></rect><text x="676" y="192" text-anchor="middle" font-weight="600" fill="#16202a">Host B</text></g><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M88 224V232H228V224"></path><path d="M236 224V232H524V224"></path><path d="M532 224V232H672V224"></path></g><text x="158" y="252" text-anchor="middle" font-weight="600" fill="#16202a">106.25 GBd</text><text x="380" y="252" text-anchor="middle" font-weight="600" fill="#16202a">113.4375 GBd</text><text x="602" y="252" text-anchor="middle" font-weight="600" fill="#16202a">106.25 GBd</text><text x="158" y="270" text-anchor="middle" font-size="11.5" fill="#586572">electrical</text><text x="380" y="270" text-anchor="middle" font-size="11.5" fill="#586572">optical, carrying the inner code</text><text x="602" y="270" text-anchor="middle" font-size="11.5" fill="#586572">electrical</text><text x="24" y="302" font-size="11.5" fill="#586572">The inner code tolerates a raw optical BER roughly 10× worse; hosts still see the same RS(544,514) stream.</text></svg>