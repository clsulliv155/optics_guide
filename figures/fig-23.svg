<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 352" role="img" aria-label="A DR4 port becomes four 100G ports because each lane has its own fibers" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">A DR4 port becomes four 100G ports because each lane has its own fibers</text><text x="24" y="48" font-size="11.5" fill="#586572">400G DR4 to four 100G-DR modules through an MPO-to-LC breakout</text><g><rect x="24" y="128" width="150" height="96" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="2"></rect><text x="99" y="156" text-anchor="middle" font-weight="600" fill="#16202a">400G DR4</text><text x="99" y="174" text-anchor="middle" font-size="11.5" fill="#16202a">4 × 100G PAM4</text><text x="99" y="190" text-anchor="middle" font-size="11.5" fill="#16202a">MPO-12 APC</text><text x="99" y="206" text-anchor="middle" font-size="11.5" fill="#586572">one switch port</text></g><g><line x1="174" x2="300" y1="176" y2="176" stroke="#b3bdc7" stroke-width="7" stroke-linecap="round"></line><text x="237" y="162" text-anchor="middle" font-size="11.5" fill="#586572">MPO trunk, 8 fibers</text></g><g><polygon points="300,164 360,98 360,254 300,188" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></polygon><text x="330" y="88" text-anchor="middle" font-size="11.5" fill="#586572">fanout</text></g><g fill="none" stroke="#8794a1" stroke-width="1.5"><line x1="360" x2="520" y1="104" y2="104"></line><line x1="360" x2="520" y1="152" y2="152"></line><line x1="360" x2="520" y1="200" y2="200"></line><line x1="360" x2="520" y1="248" y2="248"></line></g><g><g><rect x="520" y="86" width="120" height="36" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect></g><g><rect x="520" y="134" width="120" height="36" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect></g><g><rect x="520" y="182" width="120" height="36" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect></g><g><rect x="520" y="230" width="120" height="36" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect></g><text x="580" y="108" text-anchor="middle" font-weight="600" fill="#16202a">100G-DR</text><text x="580" y="156" text-anchor="middle" font-weight="600" fill="#16202a">100G-DR</text><text x="580" y="204" text-anchor="middle" font-weight="600" fill="#16202a">100G-DR</text><text x="580" y="252" text-anchor="middle" font-weight="600" fill="#16202a">100G-DR</text><text x="652" y="108" font-size="11.5" fill="#586572">port 1</text><text x="652" y="156" font-size="11.5" fill="#586572">port 2</text><text x="652" y="204" font-size="11.5" fill="#586572">port 3</text><text x="652" y="252" font-size="11.5" fill="#586572">port 4</text></g><text x="440" y="286" text-anchor="middle" font-size="11.5" fill="#586572">each branch: duplex LC, 1 Tx + 1 Rx fiber</text><text x="24" y="320" font-size="11.5" fill="#586572">It works because the lanes match: 100G PAM4 on one wavelength at both ends.</text><text x="24" y="338" font-size="11.5" fill="#586572">A 100G-CWDM4 or PSM4 at the far end (4 × 25G NRZ inside) would not link.</text></svg>