<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 456" role="img" aria-label="A gearbox does extra work when host and optical lane rates differ" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">A gearbox does extra work when host and optical lane rates differ</text><text x="24" y="48" font-size="11.5" fill="#586572">The same 400G DR4 optics behind two host generations</text><g><text x="24" y="74" font-weight="600" fill="#16202a">Gearbox</text><text x="90" y="74" font-size="11.5" fill="#586572">400G QSFP-DD DR4 on a 50G-lane host</text><g fill="none" stroke="#8794a1" stroke-width="1.25"><line x1="136" x2="300" y1="106" y2="106"></line><line x1="136" x2="300" y1="120" y2="120"></line><line x1="136" x2="300" y1="134" y2="134"></line><line x1="136" x2="300" y1="148" y2="148"></line><line x1="136" x2="300" y1="162" y2="162"></line><line x1="136" x2="300" y1="176" y2="176"></line><line x1="136" x2="300" y1="190" y2="190"></line><line x1="136" x2="300" y1="204" y2="204"></line><line x1="420" x2="560" y1="113" y2="113"></line><line x1="420" x2="560" y1="141" y2="141"></line><line x1="420" x2="560" y1="169" y2="169"></line><line x1="420" x2="560" y1="197" y2="197"></line></g><rect x="24" y="100" width="112" height="112" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="300" y="100" width="120" height="112" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="2"></rect><rect x="560" y="100" width="152" height="112" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="80" y="124" text-anchor="middle" font-weight="600" fill="#16202a">Host ASIC</text><text x="80" y="142" text-anchor="middle" font-size="11.5" fill="#16202a">8 × 50G PAM4</text><text x="360" y="124" text-anchor="middle" font-weight="600" fill="#16202a">Gearbox DSP</text><text x="360" y="142" text-anchor="middle" font-size="11.5" fill="#16202a">50G → 100G</text><text x="360" y="158" text-anchor="middle" font-size="11.5" fill="#16202a">re-maps lanes</text><text x="636" y="124" text-anchor="middle" font-weight="600" fill="#16202a">Optics</text><text x="636" y="142" text-anchor="middle" font-size="11.5" fill="#16202a">4 lasers, PAM4</text><text x="636" y="158" text-anchor="middle" font-size="11.5" fill="#16202a">MPO-12 to fiber</text><text x="218" y="232" text-anchor="middle" font-size="11.5" fill="#586572">8 × 50G electrical (26.5625 GBd)</text><text x="490" y="232" text-anchor="middle" font-size="11.5" fill="#586572">4 × 100G optical (53.125 GBd)</text></g><line x1="24" x2="736" y1="252" y2="252" stroke="#dde3e9"></line><g><text x="24" y="280" font-weight="600" fill="#16202a">Retimer</text><text x="90" y="280" font-size="11.5" fill="#586572">400G QSFP112 DR4 on a 100G-lane host</text><g fill="none" stroke="#8794a1" stroke-width="1.25"><line x1="136" x2="300" y1="310" y2="310"></line><line x1="136" x2="300" y1="330" y2="330"></line><line x1="136" x2="300" y1="350" y2="350"></line><line x1="136" x2="300" y1="370" y2="370"></line><line x1="420" x2="560" y1="310" y2="310"></line><line x1="420" x2="560" y1="330" y2="330"></line><line x1="420" x2="560" y1="350" y2="350"></line><line x1="420" x2="560" y1="370" y2="370"></line></g><rect x="24" y="298" width="112" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="300" y="298" width="120" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="560" y="298" width="152" height="88" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="80" y="322" text-anchor="middle" font-weight="600" fill="#16202a">Host ASIC</text><text x="80" y="340" text-anchor="middle" font-size="11.5" fill="#16202a">4 × 100G PAM4</text><text x="360" y="322" text-anchor="middle" font-weight="600" fill="#16202a">Retimer DSP</text><text x="360" y="340" text-anchor="middle" font-size="11.5" fill="#16202a">100G → 100G</text><text x="360" y="356" text-anchor="middle" font-size="11.5" fill="#16202a">clean-up only</text><text x="636" y="322" text-anchor="middle" font-weight="600" fill="#16202a">Optics</text><text x="636" y="340" text-anchor="middle" font-size="11.5" fill="#16202a">4 lasers, PAM4</text><text x="636" y="356" text-anchor="middle" font-size="11.5" fill="#16202a">MPO-12 to fiber</text><text x="218" y="406" text-anchor="middle" font-size="11.5" fill="#586572">4 × 100G electrical (53.125 GBd)</text><text x="490" y="406" text-anchor="middle" font-size="11.5" fill="#586572">4 × 100G optical (53.125 GBd)</text></g><text x="24" y="438" font-size="11.5" fill="#586572">Matching lane rates on both sides is what allows a simpler retimer, or a linear module with no DSP at all.</text></svg>