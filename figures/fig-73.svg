<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 552" role="img" aria-label="Three of the four laser options ship today; monolithic growth is still research" font-size="13"><defs><marker id="las-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fcf"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Three of the four laser options ship today; monolithic growth is still research</text><text x="24" y="50" font-size="11.5" fill="#586572">Side views, not to scale. Blue is the light path; orange is InP or other III-V laser material.</text><g><rect x="24" y="72" width="344" height="216" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="40" y="98" font-weight="600" fill="#16202a">External laser source</text><circle cx="44" cy="114" r="4" fill="#1a8a46"></circle><text x="54" y="118" font-size="11.5" fill="#586572">Standard in CPO</text><rect x="40" y="152" width="84" height="48" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><rect x="50" y="170" width="24" height="12" fill="#d4632a" fill-opacity="0.3" stroke="#d4632a"></rect><text x="82" y="180" font-size="11.5" fill="#16202a">ELSFP</text><path d="M124 176C164 142 184 210 224 176" fill="none" stroke="#1f5fcf" stroke-width="2"></path><text x="174" y="150" text-anchor="middle" font-size="11.5" fill="#586572">PM fiber</text><rect x="224" y="160" width="128" height="40" rx="4" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><path d="M224 176H344" stroke="#1f5fcf" stroke-width="2" marker-end="url(#las-arrow)"></path><text x="288" y="218" text-anchor="middle" font-size="11.5" fill="#586572">silicon PIC</text><text x="40" y="248" font-size="12" fill="#16202a">+ cool, replaceable, shared across lanes</text><text x="40" y="266" font-size="12" fill="#16202a">− extra connector loss; needs high-power lasers</text></g><g><rect x="392" y="72" width="344" height="216" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="408" y="98" font-weight="600" fill="#16202a">Hybrid: flip-chip or micro-optic</text><circle cx="412" cy="114" r="4" fill="#1a8a46"></circle><text x="422" y="118" font-size="11.5" fill="#586572">Most silicon photonic pluggables</text><path d="M408 172H452V188H536V172H720V212H408Z" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></path><rect x="460" y="164" width="68" height="22" rx="2" fill="#d4632a" fill-opacity="0.3" stroke="#d4632a"></rect><text x="494" y="156" text-anchor="middle" font-size="11.5" fill="#586572">InP laser die</text><path d="M528 180H712" stroke="#1f5fcf" stroke-width="2" marker-end="url(#las-arrow)"></path><text x="624" y="230" text-anchor="middle" font-size="11.5" fill="#586572">silicon PIC</text><text x="408" y="248" font-size="12" fill="#16202a">+ lasers tested before assembly; mature</text><text x="408" y="266" font-size="12" fill="#16202a">− sub-micron alignment for every die</text></g><g><rect x="24" y="312" width="344" height="216" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="40" y="338" font-weight="600" fill="#16202a">Heterogeneous: bonded III-V</text><circle cx="44" cy="354" r="4" fill="#1a8a46"></circle><text x="54" y="358" font-size="11.5" fill="#586572">Shipping; one vendor passed 32M lasers by 2024</text><rect x="40" y="412" width="312" height="40" rx="4" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><rect x="128" y="400" width="140" height="12" rx="2" fill="#d4632a" fill-opacity="0.3" stroke="#d4632a"></rect><text x="198" y="392" text-anchor="middle" font-size="11.5" fill="#586572">III-V film bonded on the wafer</text><path d="M128 424H344" stroke="#1f5fcf" stroke-width="2" marker-end="url(#las-arrow)"></path><text x="196" y="470" text-anchor="middle" font-size="11.5" fill="#586572">silicon PIC; the laser forms over the waveguide</text><text x="40" y="488" font-size="12" fill="#16202a">+ sub-dB coupling; tested on the wafer</text><text x="40" y="506" font-size="12" fill="#16202a">− heat removal; thermal-expansion mismatch</text></g><g><rect x="392" y="312" width="344" height="216" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="408" y="338" font-weight="600" fill="#16202a">Monolithic: grown on silicon</text><circle cx="412" cy="354" r="4" fill="#c27c0e"></circle><text x="422" y="358" font-size="11.5" fill="#586572">Research; 300 mm wafer-scale demos in 2025</text><rect x="408" y="412" width="312" height="40" rx="4" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><rect x="496" y="408" width="96" height="28" rx="2" fill="#d4632a" fill-opacity="0.18" stroke="#d4632a"></rect><circle cx="504" cy="416" r="1.8" fill="#d4632a"></circle><circle cx="515" cy="416" r="1.8" fill="#d4632a"></circle><circle cx="526" cy="416" r="1.8" fill="#d4632a"></circle><circle cx="537" cy="416" r="1.8" fill="#d4632a"></circle><circle cx="548" cy="416" r="1.8" fill="#d4632a"></circle><circle cx="559" cy="416" r="1.8" fill="#d4632a"></circle><circle cx="570" cy="416" r="1.8" fill="#d4632a"></circle><circle cx="581" cy="416" r="1.8" fill="#d4632a"></circle><circle cx="504" cy="422" r="1.8" fill="#d4632a"></circle><circle cx="515" cy="422" r="1.8" fill="#d4632a"></circle><circle cx="526" cy="422" r="1.8" fill="#d4632a"></circle><circle cx="537" cy="422" r="1.8" fill="#d4632a"></circle><circle cx="548" cy="422" r="1.8" fill="#d4632a"></circle><circle cx="559" cy="422" r="1.8" fill="#d4632a"></circle><circle cx="570" cy="422" r="1.8" fill="#d4632a"></circle><circle cx="581" cy="422" r="1.8" fill="#d4632a"></circle><circle cx="504" cy="428" r="1.8" fill="#d4632a"></circle><circle cx="515" cy="428" r="1.8" fill="#d4632a"></circle><circle cx="526" cy="428" r="1.8" fill="#d4632a"></circle><circle cx="537" cy="428" r="1.8" fill="#d4632a"></circle><circle cx="548" cy="428" r="1.8" fill="#d4632a"></circle><circle cx="559" cy="428" r="1.8" fill="#d4632a"></circle><circle cx="570" cy="428" r="1.8" fill="#d4632a"></circle><circle cx="581" cy="428" r="1.8" fill="#d4632a"></circle><text x="544" y="396" text-anchor="middle" font-size="11.5" fill="#586572">quantum dots grown in a pocket</text><path d="M592 424H712" stroke="#1f5fcf" stroke-width="2" marker-end="url(#las-arrow)"></path><text x="624" y="470" text-anchor="middle" font-size="11.5" fill="#586572">silicon PIC</text><text x="408" y="488" font-size="12" fill="#16202a">+ lowest assembly cost, eventually</text><text x="408" y="506" font-size="12" fill="#16202a">− crystal defects and lifetime still open</text></g></svg>