<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 480" role="img" aria-label="Parallel adds fibers, WDM adds wavelengths, BiDi shares each fiber" font-size="13"><defs><marker id="arch-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker><marker id="arch-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fcf"></path></marker><marker id="arch-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d4632a"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">Parallel adds fibers, WDM adds wavelengths, BiDi shares each fiber</text><text x="24" y="48" font-size="11.5" fill="#586572">Transmit lanes run left to right, receive lanes right to left</text><g><g><rect x="176" y="72" width="108" height="120" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><rect x="568" y="72" width="108" height="120" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect></g><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M284 88H566" marker-end="url(#arch-g)"></path><path d="M284 102H566" marker-end="url(#arch-g)"></path><path d="M284 116H566" marker-end="url(#arch-g)"></path><path d="M284 130H566" marker-end="url(#arch-g)"></path><path d="M568 142H286" marker-end="url(#arch-g)"></path><path d="M568 156H286" marker-end="url(#arch-g)"></path><path d="M568 170H286" marker-end="url(#arch-g)"></path><path d="M568 184H286" marker-end="url(#arch-g)"></path></g><text x="230" y="136" text-anchor="middle" font-weight="600" fill="#16202a">DR4</text><text x="622" y="136" text-anchor="middle" font-weight="600" fill="#16202a">DR4</text><text x="426" y="80" text-anchor="middle" font-size="11.5" fill="#586572">4 fibers out, 4 back, all at one wavelength</text><text x="24" y="96" font-weight="600" fill="#16202a">Parallel</text><text x="24" y="114" font-size="11.5" fill="#586572">DR4, SR4, DR8</text><text x="24" y="132" font-size="11.5" fill="#586572">1 wavelength</text><text x="24" y="150" font-size="11.5" fill="#586572">8 fibers for 4 lanes</text></g><line x1="24" x2="736" y1="208" y2="208" stroke="#dde3e9"></line><g><g><rect x="176" y="224" width="108" height="80" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><rect x="568" y="224" width="108" height="80" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect></g><path d="M284 248H566" fill="none" stroke="#8794a1" stroke-width="1.25" marker-end="url(#arch-g)"></path><path d="M568 280H286" fill="none" stroke="#8794a1" stroke-width="1.25" marker-end="url(#arch-g)"></path><circle cx="380" cy="248" r="4.5" fill="#1f5fcf"></circle><circle cx="398" cy="248" r="4.5" fill="#d4632a"></circle><circle cx="416" cy="248" r="4.5" fill="#12876a"></circle><circle cx="434" cy="248" r="4.5" fill="#23397a"></circle><circle cx="436" cy="280" r="4.5" fill="#1f5fcf"></circle><circle cx="454" cy="280" r="4.5" fill="#d4632a"></circle><circle cx="472" cy="280" r="4.5" fill="#12876a"></circle><circle cx="490" cy="280" r="4.5" fill="#23397a"></circle><text x="230" y="260" text-anchor="middle" font-weight="600" fill="#16202a">FR4</text><text x="230" y="278" text-anchor="middle" font-size="11.5" fill="#586572">mux / demux</text><text x="622" y="260" text-anchor="middle" font-weight="600" fill="#16202a">FR4</text><text x="622" y="278" text-anchor="middle" font-size="11.5" fill="#586572">mux / demux</text><text x="426" y="236" text-anchor="middle" font-size="11.5" fill="#586572">4 wavelengths share one fiber each way</text><text x="24" y="244" font-weight="600" fill="#16202a">WDM duplex</text><text x="24" y="262" font-size="11.5" fill="#586572">FR4, LR4, CWDM4</text><text x="24" y="280" font-size="11.5" fill="#586572">4 wavelengths</text><text x="24" y="298" font-size="11.5" fill="#586572">2 fibers for 4 lanes</text></g><line x1="24" x2="736" y1="320" y2="320" stroke="#dde3e9"></line><g><g><rect x="176" y="336" width="108" height="96" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><rect x="568" y="336" width="108" height="96" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect></g><g fill="none" stroke-width="1.5"><path d="M284 364H566" stroke="#1f5fcf" marker-end="url(#arch-1)"></path><path d="M568 372H286" stroke="#d4632a" marker-end="url(#arch-2)"></path><path d="M284 400H566" stroke="#1f5fcf" marker-end="url(#arch-1)"></path><path d="M568 408H286" stroke="#d4632a" marker-end="url(#arch-2)"></path></g><text x="230" y="382" text-anchor="middle" font-weight="600" fill="#16202a">SR4.2</text><text x="230" y="400" text-anchor="middle" font-size="11.5" fill="#586572">2 of 8 fibers shown</text><text x="622" y="382" text-anchor="middle" font-weight="600" fill="#16202a">SR4.2</text><text x="426" y="350" text-anchor="middle" font-size="11.5" fill="#586572">850 nm one way, ~910 nm the other, on every fiber</text><text x="24" y="356" font-weight="600" fill="#16202a">BiDi</text><text x="24" y="374" font-size="11.5" fill="#586572">SR4.2, SR1.2</text><text x="24" y="392" font-size="11.5" fill="#586572">2 wavelengths per fiber</text><text x="24" y="410" font-size="11.5" fill="#586572">opposite directions</text></g><text x="24" y="462" font-size="11.5" fill="#586572">WDM duplex optics cannot break out because all lanes share one fiber pair; parallel optics can.</text></svg>