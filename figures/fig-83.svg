<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="IEEE defines the link; OIF, MSAs and ITU-T define the pieces around it" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">IEEE defines the link; OIF, MSAs and ITU-T define the pieces around it</text><text x="24" y="48" font-size="11.5" fill="#586572">Which body owns which part of an Ethernet optical link</text><g><line x1="184" x2="184" y1="62" y2="352" stroke="#dde3e9"></line><line x1="294.4" x2="294.4" y1="62" y2="352" stroke="#dde3e9"></line><line x1="404.8" x2="404.8" y1="62" y2="352" stroke="#dde3e9"></line><line x1="515.2" x2="515.2" y1="62" y2="352" stroke="#dde3e9"></line><line x1="625.6" x2="625.6" y1="62" y2="352" stroke="#dde3e9"></line><line x1="736" x2="736" y1="62" y2="352" stroke="#dde3e9"></line><line x1="184" x2="736" y1="96" y2="96" stroke="#8794a1"></line><text x="239.2" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">Host ASIC</text><text x="239.2" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">and FEC</text><text x="349.59999999999997" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">Electrical</text><text x="349.59999999999997" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">interface</text><text x="460" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">Module and</text><text x="460" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">management</text><text x="570.4000000000001" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">Optical</text><text x="570.4000000000001" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">interface</text><text x="680.8000000000001" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">Fiber and</text><text x="680.8000000000001" y="88" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">DWDM grid</text></g><g><rect x="190" y="108" width="429.6" height="24" rx="6" fill="#1f5fcf" fill-opacity="0.14" stroke="#1f5fcf" stroke-width="1.75"></rect><text x="24" y="118" font-weight="600" fill="#16202a">IEEE 802.3</text><text x="24" y="134" font-size="11.5" fill="#586572">Ethernet PHY</text><text x="404.8" y="124" text-anchor="middle" font-size="11.5" fill="#16202a">PCS, FEC, PMA, PMD, AUI, and the PMD names</text></g><g><rect x="300.4" y="150" width="319.20000000000005" height="24" rx="6" fill="#eef2f6" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="24" y="160" font-weight="600" fill="#16202a">OIF</text><text x="24" y="176" font-size="11.5" fill="#586572">IAs and CMIS</text><text x="460" y="166" text-anchor="middle" font-size="11.5" fill="#16202a">CEI electrical · CMIS · ZR/LR coherent</text></g><g><rect x="410.8" y="192" width="98.40000000000003" height="24" rx="6" fill="#eef2f6" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="24" y="202" font-weight="600" fill="#16202a">Form-factor MSAs</text><text x="24" y="218" font-size="11.5" fill="#586572">QSFP-DD, OSFP, SFF</text><text x="460" y="208" text-anchor="middle" font-size="11.5" fill="#16202a">mechanics, maps</text></g><g><rect x="521.2" y="234" width="98.39999999999998" height="24" rx="6" fill="#eef2f6" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="24" y="244" font-weight="600" fill="#16202a">Optical MSAs</text><text x="24" y="260" font-size="11.5" fill="#586572">CWDM4, 100G Lambda, LPO</text><text x="570.4000000000001" y="250" text-anchor="middle" font-size="11.5" fill="#16202a">PMD variants</text></g><g><rect x="631.6" y="276" width="98.39999999999998" height="24" rx="6" fill="#eef2f6" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="24" y="286" font-weight="600" fill="#16202a">ITU-T</text><text x="24" y="302" font-size="11.5" fill="#586572">G.652, G.694.1</text><text x="680.8000000000001" y="292" text-anchor="middle" font-size="11.5" fill="#16202a">fiber, grid</text></g><g><rect x="631.6" y="318" width="98.39999999999998" height="24" rx="6" fill="#eef2f6" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="24" y="328" font-weight="600" fill="#16202a">TIA / IEC</text><text x="24" y="344" font-size="11.5" fill="#586572">Cabling, inspection</text><text x="680.8000000000001" y="334" text-anchor="middle" font-size="11.5" fill="#16202a">cabling</text></g><text x="24" y="378" font-size="11.5" fill="#586572">When two documents seem to disagree, check which column each one owns.</text></svg>