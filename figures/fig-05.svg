<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 462" role="img" aria-label="A PIN receiver is thermal-noise limited, which is where most of the 33 dB between the quantum limit and a real PAM4 sensitivity goes" font-size="12"><defs><marker id="rx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f5fcf"></path></marker></defs><text x="24" y="30" font-size="14.5" font-weight="600" fill="#16202a">A PIN receiver is thermal-noise limited: that is where most of the 33 dB above the quantum limit goes</text><text x="24" y="50" font-size="11.5" fill="#586572">Left: the IM-DD receive chain and where each noise enters. Right: how a 100G PAM4 lane&#x27;s sensitivity is built up, approximate</text><g><line x1="24" x2="60" y1="150" y2="150" stroke="#1f5fcf" stroke-width="2" marker-end="url(#rx-arrow)"></line><text x="24" y="138" font-size="11" fill="#586572">light</text><rect x="60" y="124" width="74" height="52" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="97" y="146" text-anchor="middle" font-weight="600" fill="#16202a">PIN PD</text><text x="97" y="164" text-anchor="middle" font-size="10.5" fill="#586572">0.8–1 A/W</text><line x1="134" x2="176" y1="150" y2="150" stroke="#1f5fcf" stroke-width="2" marker-end="url(#rx-arrow)"></line><rect x="176" y="124" width="74" height="52" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="213" y="146" text-anchor="middle" font-weight="600" fill="#16202a">TIA</text><text x="213" y="164" text-anchor="middle" font-size="10.5" fill="#586572">current to volts</text><line x1="250" x2="292" y1="150" y2="150" stroke="#1f5fcf" stroke-width="2" marker-end="url(#rx-arrow)"></line><rect x="292" y="124" width="84" height="52" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="334" y="146" text-anchor="middle" font-weight="600" fill="#16202a">CTLE, ADC</text><text x="334" y="164" text-anchor="middle" font-size="10.5" fill="#586572">equalizer</text><line x1="376" x2="410" y1="150" y2="150" stroke="#1f5fcf" stroke-width="2" marker-end="url(#rx-arrow)"></line><rect x="410" y="124" width="50" height="52" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="435" y="154" text-anchor="middle" font-weight="600" fill="#16202a">slicer</text></g><g><path d="M87 108 q5 -8 10 0 t10 0" fill="none" stroke="#d4632a" stroke-width="2"></path><text x="97" y="96" text-anchor="middle" font-size="10.5" fill="#d4632a">shot noise ∝ √P</text><path d="M203 108 q5 -8 10 0 t10 0" fill="none" stroke="#d4632a" stroke-width="2"></path><text x="213" y="96" text-anchor="middle" font-size="10.5" fill="#d4632a">thermal noise, fixed</text><path d="M30 190 q5 -8 10 0 t10 0" fill="none" stroke="#d4632a" stroke-width="2"></path><text x="24" y="214" font-size="10.5" fill="#d4632a">laser RIN and ASE ride in with the light, ∝ P</text></g><g><text x="24" y="250" font-size="11.5" font-weight="600" fill="#16202a">Three regimes, three rules of thumb</text><text x="24" y="272" font-size="11" fill="#16202a">Thermal-limited (PIN + TIA): signal ∝ P, noise fixed, so SNR ∝ P²</text><text x="24" y="288" font-size="11" fill="#586572">1 dB of optical power is worth 2 dB of electrical SNR</text><text x="24" y="310" font-size="11" fill="#16202a">Shot-limited (APD gain, coherent with a strong local laser): SNR ∝ P</text><text x="24" y="326" font-size="11" fill="#586572">1 dB optical is 1 dB SNR; this is why coherent needs far less light</text><text x="24" y="348" font-size="11" fill="#16202a">RIN- or ASE-limited: noise grows with P, so more power stops helping</text><text x="24" y="364" font-size="11" fill="#586572">an error floor; only a cleaner laser or more OSNR fixes it</text><text x="24" y="392" font-size="11" fill="#16202a">APD and SOA preamplifiers buy back 5–10 dB for ER-class optics</text><text x="24" y="414" font-size="11" fill="#16202a">Coherent detection with a strong local laser reaches the shot-noise regime</text><text x="24" y="430" font-size="11" fill="#586572">which is a large part of why coherent wins beyond tens of km</text></g><g><line x1="470" x2="470" y1="126" y2="410" stroke="#8794a1" stroke-width="1.25"></line><g><circle cx="470" cy="118" r="5" fill="#12876a" stroke="#eef2f6" stroke-width="1.5"></circle></g><g><circle cx="470" cy="143" r="5" fill="#d4632a" stroke="#eef2f6" stroke-width="1.5"></circle></g><g><circle cx="470" cy="326.3333333333333" r="5" fill="#d4632a" stroke="#eef2f6" stroke-width="1.5"></circle></g><g><circle cx="470" cy="366.33333333333337" r="5" fill="#d4632a" stroke="#eef2f6" stroke-width="1.5"></circle></g><g><circle cx="470" cy="398" r="5" fill="#d4632a" stroke="#eef2f6" stroke-width="1.5"></circle></g><g><circle cx="470" cy="418.8333333333333" r="5" fill="#c27c0e" stroke="#eef2f6" stroke-width="1.5"></circle></g></g><g font-size="10.5"><text x="482" y="122" fill="#16202a" font-weight="600">−38 dBm: quantum limit</text><text x="482" y="136" fill="#586572">10 photons per bit at 106 Gb/s, 1310 nm, BER 10⁻⁹</text><text x="482" y="147" fill="#16202a">shot noise alone (NRZ, Gaussian): about −35 dBm</text><text x="482" y="330.3333333333333" fill="#16202a">TIA thermal noise, net of the FEC target: about 22 dB</text><text x="482" y="370.33333333333337" fill="#16202a">PAM4: eyes a third the height, 4.8 dB optical</text><text x="482" y="402" fill="#16202a" font-weight="600">−4.4 dBm OMA: DR4 sensitivity, clean signal</text><text x="482" y="386" fill="#586572">finite ER, bandwidth, ISI, reflections: 3–4 dB</text><text x="482" y="424.8333333333333" fill="#16202a" font-weight="600">−1.9 dBm: stressed sensitivity</text><text x="482" y="438.8333333333333" fill="#586572">2.5 dB given back for a Tx at the TDECQ limit</text></g><text x="464" y="102" text-anchor="end" font-size="11.5" fill="#586572">sensitivity, dBm</text><text x="24" y="456" font-size="10.5" fill="#586572">Ladder values are approximate; sensitivities are the 400GBASE-DR4 table rows, the PAM4 penalty is 10·log₁₀ 3 in optical power.</text></svg>