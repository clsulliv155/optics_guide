<svg xmlns="http://www.w3.org/2000/svg" width="760" height="296" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 296" role="img" aria-label="Optics telemetry is a loop: collect, baseline, detect, act, re-baseline" font-size="13"><defs><marker id="tel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7f8f"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#e4eaf0">Optics telemetry is a loop: collect, baseline, detect, act, re-baseline</text><text x="24" y="48" font-size="11.5" fill="#95a3b1">Top row collects data; bottom row turns it into action</text><g><rect x="24" y="80" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="104" y="103" text-anchor="middle" font-weight="600" fill="#e4eaf0">Optics</text><text x="104" y="121" text-anchor="middle" font-size="11.5" fill="#95a3b1">DOM, VDM, FEC</text><text x="104" y="137" text-anchor="middle" font-size="11.5" fill="#95a3b1">per lane</text></g><g><rect x="208" y="80" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="288" y="103" text-anchor="middle" font-weight="600" fill="#e4eaf0">Switch agent</text><text x="288" y="121" text-anchor="middle" font-size="11.5" fill="#95a3b1">OpenConfig models</text><text x="288" y="137" text-anchor="middle" font-size="11.5" fill="#95a3b1">transceiver, ethernet</text></g><g><rect x="392" y="80" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="472" y="103" text-anchor="middle" font-weight="600" fill="#e4eaf0">gNMI streaming</text><text x="472" y="121" text-anchor="middle" font-size="11.5" fill="#95a3b1">SAMPLE for values</text><text x="472" y="137" text-anchor="middle" font-size="11.5" fill="#95a3b1">ON_CHANGE for state</text></g><g><rect x="576" y="80" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="656" y="103" text-anchor="middle" font-weight="600" fill="#e4eaf0">Collector + TSDB</text><text x="656" y="121" text-anchor="middle" font-size="11.5" fill="#95a3b1">time series per link</text><text x="656" y="137" text-anchor="middle" font-size="11.5" fill="#95a3b1">both ends joined</text></g><g><rect x="536" y="200" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="636" y="223" text-anchor="middle" font-weight="600" fill="#e4eaf0">Baselines</text><text x="636" y="241" text-anchor="middle" font-size="11.5" fill="#95a3b1">per link at turn-up</text><text x="636" y="257" text-anchor="middle" font-size="11.5" fill="#95a3b1">cohorts: part, FW, lot</text></g><g><rect x="288" y="200" width="200" height="72" rx="8" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="2"></rect><text x="388" y="223" text-anchor="middle" font-weight="600" fill="#e4eaf0">Detection</text><text x="388" y="241" text-anchor="middle" font-size="11.5" fill="#e4eaf0">drift, steps, bias creep</text><text x="388" y="257" text-anchor="middle" font-size="11.5" fill="#e4eaf0">FEC histogram tail</text></g><g><rect x="40" y="200" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="140" y="223" text-anchor="middle" font-weight="600" fill="#e4eaf0">Action</text><text x="140" y="241" text-anchor="middle" font-size="11.5" fill="#95a3b1">drain link, open ticket</text><text x="140" y="257" text-anchor="middle" font-size="11.5" fill="#95a3b1">clean or swap the optic</text></g><g fill="none" stroke="#6f7f8f" stroke-width="1.25"><path d="M184 116H206" marker-end="url(#tel-arrow)"></path><path d="M368 116H390" marker-end="url(#tel-arrow)"></path><path d="M552 116H574" marker-end="url(#tel-arrow)"></path><path d="M656 152V198" marker-end="url(#tel-arrow)"></path><path d="M536 236H490" marker-end="url(#tel-arrow)"></path><path d="M288 236H242" marker-end="url(#tel-arrow)"></path><path d="M100 200V154" stroke-dasharray="4 3" marker-end="url(#tel-arrow)"></path></g><text x="108" y="181" font-size="11.5" fill="#95a3b1">re-baseline after repair</text></svg>