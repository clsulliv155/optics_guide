<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 510" role="img" aria-label="The CMIS memory map puts identity and advertising on low pages, control on page 10h, status on 11h and diagnostics on 20h to 2Fh; bring-up stages a control set then applies it" font-size="12"><defs><marker id="cm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">CMIS: identity and limits on low pages, control on 10h, status on 11h, diagnostics on 20h–2Fh</text><text x="24" y="50" font-size="11.5" fill="#586572">Left: the memory map a host reads over I²C. Right: how a data path is provisioned once the module is ready</text><text x="24" y="80" font-size="11.5" font-weight="600" fill="#16202a">Memory map (page and bank select at bytes 126–127)</text><g><rect x="24" y="90" width="340" height="50" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></rect><text x="36" y="107" font-weight="600" fill="#16202a">Lower memory 00h, bytes 0–127</text><text x="36" y="121" font-size="10.5" fill="#586572">identifier, module state, global flags,</text><text x="36" y="134" font-size="10.5" fill="#586572">temperature, Vcc, LPMode</text><rect x="24" y="146" width="340" height="50" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></rect><text x="36" y="163" font-weight="600" fill="#16202a">Pages 00h, 01h, 02h: identity, advertising, limits</text><text x="36" y="177" font-size="10.5" fill="#586572">vendor and part, power class and MaxPower (bytes</text><text x="36" y="190" font-size="10.5" fill="#586572">200–201), applications, durations, alarm thresholds</text><rect x="24" y="202" width="340" height="50" rx="6" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="36" y="219" font-weight="600" fill="#16202a">Page 10h: lane control, banked</text><text x="36" y="233" font-size="10.5" fill="#586572">data path deinit, Tx disable, squelch, staged control</text><text x="36" y="246" font-size="10.5" fill="#586572">sets: AppSel, DataPathID, ExplicitControl, SI settings</text><rect x="24" y="258" width="340" height="50" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></rect><text x="36" y="275" font-weight="600" fill="#16202a">Page 11h: lane status, banked</text><text x="36" y="289" font-size="10.5" fill="#586572">data path state per lane, latched flags, per-lane Tx</text><text x="36" y="302" font-size="10.5" fill="#586572">and Rx power, laser bias, active control set</text><rect x="24" y="314" width="340" height="50" rx="6" fill="#eef2f6" stroke="#d4632a" stroke-width="1.5"></rect><text x="36" y="331" font-weight="600" fill="#16202a">Pages 13h, 14h: diagnostics</text><text x="36" y="345" font-size="10.5" fill="#586572">host- and media-side loopbacks, PRBS generators</text><text x="36" y="358" font-size="10.5" fill="#586572">and checkers, per-lane BER readout</text><rect x="24" y="370" width="340" height="50" rx="6" fill="#eef2f6" stroke="#d4632a" stroke-width="1.5"></rect><text x="36" y="387" font-weight="600" fill="#16202a">Pages 20h–2Fh: VDM</text><text x="36" y="401" font-size="10.5" fill="#586572">descriptors, samples, thresholds and flags: eSNR,</text><text x="36" y="414" font-size="10.5" fill="#586572">pre-FEC BER, FERC, laser temperature and age</text><rect x="24" y="426" width="340" height="50" rx="6" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="36" y="443" font-weight="600" fill="#16202a">Page 9Fh: CDB</text><text x="36" y="457" font-size="10.5" fill="#586572">command data block: firmware download and</text><text x="36" y="470" font-size="10.5" fill="#586572">other long commands</text></g><text x="380" y="80" font-size="11.5" font-weight="600" fill="#16202a">Bringing up a data path</text><g><rect x="380" y="90" width="356" height="40" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.25"></rect><text x="392" y="107" font-weight="600" fill="#16202a">1. Module: LowPwr to ModuleReady</text><text x="392" y="122" font-size="10.5" fill="#586572">host checks power class against the port, releases LPMode</text><line x1="558" x2="558" y1="130" y2="142" stroke="#8794a1" stroke-width="1.5" marker-end="url(#cm-arrow)"></line><rect x="380" y="146" width="356" height="40" rx="6" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="392" y="163" font-weight="600" fill="#16202a">2. Read what the module offers</text><text x="392" y="178" font-size="10.5" fill="#586572">applications (host rate, media type), MaxDurationDPInit (Page 01h)</text><line x1="558" x2="558" y1="186" y2="198" stroke="#8794a1" stroke-width="1.5" marker-end="url(#cm-arrow)"></line><rect x="380" y="202" width="356" height="40" rx="6" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="392" y="219" font-weight="600" fill="#16202a">3. Stage a control set, lanes deactivated</text><text x="392" y="234" font-size="10.5" fill="#586572">AppSel, DataPathID, ExplicitControl, SI knobs: Page 10h bytes 145–152</text><line x1="558" x2="558" y1="242" y2="254" stroke="#8794a1" stroke-width="1.5" marker-end="url(#cm-arrow)"></line><rect x="380" y="258" width="356" height="40" rx="6" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.25"></rect><text x="392" y="275" font-weight="600" fill="#16202a">4. ApplyDPInit (Page 10h byte 143)</text><text x="392" y="290" font-size="10.5" fill="#586572">DPDeactivated to DPInit to DPInitialized, within MaxDurationDPInit</text><line x1="558" x2="558" y1="298" y2="310" stroke="#8794a1" stroke-width="1.5" marker-end="url(#cm-arrow)"></line><rect x="380" y="314" width="356" height="40" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.25"></rect><text x="392" y="331" font-weight="600" fill="#16202a">5. Enable: DPActivated, Tx on</text><text x="392" y="346" font-size="10.5" fill="#586572">lane state and flags on Page 11h; the host side trains if it can</text><line x1="558" x2="558" y1="354" y2="366" stroke="#8794a1" stroke-width="1.5" marker-end="url(#cm-arrow)"></line><rect x="380" y="370" width="356" height="40" rx="6" fill="#eef2f6" stroke="#d4632a" stroke-width="1.25"></rect><text x="392" y="387" font-weight="600" fill="#16202a">6. Watch: DOM, flags, VDM</text><text x="392" y="402" font-size="10.5" fill="#586572">poll or use IntL; VDM thresholds warn before failure</text></g><g font-size="11" fill="#586572"><rect x="24" y="488" width="14" height="10" rx="2" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></rect><text x="44" y="497">read: identity and status</text><rect x="200" y="488" width="14" height="10" rx="2" fill="#eef2f6" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="220" y="497">write: control</text><rect x="320" y="488" width="14" height="10" rx="2" fill="#eef2f6" stroke="#d4632a" stroke-width="1.5"></rect><text x="340" y="497">diagnostics and telemetry</text><text x="736" y="497" text-anchor="end" font-size="10.5">Pages per OIF CMIS 5.x</text></g></svg>