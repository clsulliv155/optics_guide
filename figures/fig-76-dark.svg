ke="#f07aae" stroke-width="2"></line><rect x="684" y="150" width="28" height="16" rx="3" fill="#19222c" stroke="#6f7f8f" stroke-width="1"></rect><line x1="698" x2="698" y1="136" y2="150" stroke="#6f7f8f" stroke-width="1.25"></line></g><text x="572" y="162" text-anchor="middle" font-size="10.5" fill="#e4eaf0">PD</text><text x="614" y="162" text-anchor="middle" font-size="10.5" fill="#e4eaf0">PD</text><text x="656" y="162" text-anchor="middle" font-size="10.5" fill="#e4eaf0">PD</text><text x="698" y="162" text-anchor="middle" font-size="10.5" fill="#e4eaf0">PD</text><circle cx="572" cy="200" r="15" fill="none" stroke="#f08a4b" stroke-width="2.25"></circle><circle cx="614" cy="200" r="15" fill="none" stroke="#38c29b" stroke-width="2.25"></circle><circle cx="656" cy="200" r="15" fill="none" stroke="#9db1ff" stroke-width="2.25"></circle><circle cx="698" cy="200" r="15" fill="none" stroke="#f07aae" stroke-width="2.25"></circle><text x="572" y="204" text-anchor="middle" font-size="11.5" fill="#e4eaf0">λ1</text><text x="614" y="204" text-anchor="middle" font-size="11.5" fill="#e4eaf0">λ2</text><text x="656" y="204" text-anchor="middle" font-size="11.5" fill="#e4eaf0">λ3</text><text x="698" y="204" text-anchor="middle" font-size="11.5" fill="#e4eaf0">λ4</text><text x="632" y="272" text-anchor="middle" font-size="11.5" fill="#95a3b1">each ring drops one λ to a PD</text></g><text x="24" y="318" font-size="11.5" fill="#95a3b1">Every ring has a heater and a lock loop; the laser grid must sit inside each ring&#x27;s 20–40 GHz resonance.</text></svg>