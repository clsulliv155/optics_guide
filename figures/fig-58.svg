<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 320" role="img" aria-label="Every hop from the engine to the far end has a denser option coming" font-size="13"><defs><marker id="fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Every hop from the engine to the far end has a denser option coming</text><text x="24" y="50" font-size="11.5" fill="#586572">Connectivity in a CPO or NPO switch and its cabling: what ships today (outline) and what is next (blue)</text><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M152 92H168" marker-end="url(#fc-arrow)"></path><path d="M298 92H314" marker-end="url(#fc-arrow)"></path><path d="M444 92H460" marker-end="url(#fc-arrow)"></path><path d="M590 92H606" marker-end="url(#fc-arrow)"></path></g><g><rect x="24" y="72" width="128" height="40" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="88" y="97" text-anchor="middle" font-weight="600" fill="#16202a">Engine attach</text><rect x="24" y="124" width="128" height="80" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="34" y="142" font-size="11.5" font-weight="600" fill="#16202a">Today</text><text x="34" y="158" font-size="11.5" fill="#16202a">Fiber array (FAU),</text><text x="34" y="174" font-size="11.5" fill="#16202a">glued pigtails,</text><text x="34" y="190" font-size="11.5" fill="#16202a">edge or grating</text><rect x="24" y="216" width="128" height="80" rx="8" fill="#1f5fcf" fill-opacity="0.10" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="34" y="234" font-size="11.5" font-weight="600" fill="#16202a">Next</text><text x="34" y="250" font-size="11.5" fill="#16202a">Detachable fiber</text><text x="34" y="266" font-size="11.5" fill="#16202a">connectors; glass</text><text x="34" y="282" font-size="11.5" fill="#16202a">or polymer guides</text></g><g><rect x="170" y="72" width="128" height="40" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="234" y="97" text-anchor="middle" font-weight="600" fill="#16202a">Inside the box</text><rect x="170" y="124" width="128" height="80" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="180" y="142" font-size="11.5" font-weight="600" fill="#16202a">Today</text><text x="180" y="158" font-size="11.5" fill="#16202a">Fiber shuffles</text><text x="180" y="174" font-size="11.5" fill="#16202a">and ribbons</text><text x="180" y="190" font-size="11.5" fill="#16202a">to the panel</text><rect x="170" y="216" width="128" height="80" rx="8" fill="#1f5fcf" fill-opacity="0.10" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="180" y="234" font-size="11.5" font-weight="600" fill="#16202a">Next</text><text x="180" y="250" font-size="11.5" fill="#16202a">Blind-mate MT,</text><text x="180" y="266" font-size="11.5" fill="#16202a">expanded-beam</text><text x="180" y="282" font-size="11.5" fill="#16202a">ferrules</text></g><g><rect x="316" y="72" width="128" height="40" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="380" y="97" text-anchor="middle" font-weight="600" fill="#16202a">Front panel</text><rect x="316" y="124" width="128" height="80" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="326" y="142" font-size="11.5" font-weight="600" fill="#16202a">Today</text><text x="326" y="158" font-size="11.5" fill="#16202a">MPO-12, MPO-16;</text><text x="326" y="174" font-size="11.5" fill="#16202a">LC, SN, MDC duplex;</text><text x="326" y="190" font-size="11.5" fill="#16202a">MT-12 laser ports</text><rect x="316" y="216" width="128" height="80" rx="8" fill="#1f5fcf" fill-opacity="0.10" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="326" y="234" font-size="11.5" font-weight="600" fill="#16202a">Next</text><text x="326" y="250" font-size="11.5" fill="#16202a">MMC and SN-MT:</text><text x="326" y="266" font-size="11.5" fill="#16202a">16–32 fibers, about</text><text x="326" y="282" font-size="11.5" fill="#16202a">3× MPO density</text></g><g><rect x="462" y="72" width="128" height="40" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="526" y="97" text-anchor="middle" font-weight="600" fill="#16202a">Plant and trunks</text><rect x="462" y="124" width="128" height="80" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="472" y="142" font-size="11.5" font-weight="600" fill="#16202a">Today</text><text x="472" y="158" font-size="11.5" fill="#16202a">MPO trunks,</text><text x="472" y="174" font-size="11.5" fill="#16202a">high-count ribbon</text><text x="472" y="190" font-size="11.5" fill="#16202a">cables</text><rect x="462" y="216" width="128" height="80" rx="8" fill="#1f5fcf" fill-opacity="0.10" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="472" y="234" font-size="11.5" font-weight="600" fill="#16202a">Next</text><text x="472" y="250" font-size="11.5" fill="#16202a">VSFF panels: up</text><text x="472" y="266" font-size="11.5" fill="#16202a">to 3,456 fibers</text><text x="472" y="282" font-size="11.5" fill="#16202a">in one rack unit</text></g><g><rect x="608" y="72" width="128" height="40" rx="8" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="672" y="97" text-anchor="middle" font-weight="600" fill="#16202a">The fiber</text><rect x="608" y="124" width="128" height="80" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="618" y="142" font-size="11.5" font-weight="600" fill="#16202a">Today</text><text x="618" y="158" font-size="11.5" fill="#16202a">G.652, G.657</text><text x="618" y="174" font-size="11.5" fill="#16202a">single-mode;</text><text x="618" y="190" font-size="11.5" fill="#16202a">OM4, OM5</text><rect x="608" y="216" width="128" height="80" rx="8" fill="#1f5fcf" fill-opacity="0.10" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="618" y="234" font-size="11.5" font-weight="600" fill="#16202a">Next</text><text x="618" y="250" font-size="11.5" fill="#16202a">4-core fiber</text><text x="618" y="266" font-size="11.5" fill="#16202a">(SDM4 v1.0);</text><text x="618" y="282" font-size="11.5" fill="#16202a">hollow-core</text></g></svg>