<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 380" role="img" aria-label="A fiber mode is about 20 times wider than a silicon waveguide mode" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">A fiber mode is about 20 times wider than a silicon waveguide mode</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Left: both modes at the same scale. Right: the silicon-on-insulator stack, enlarged</text><text x="24" y="84" font-weight="600" fill="#e4eaf0">Same scale</text><text x="440" y="84" font-weight="600" fill="#e4eaf0">Silicon-on-insulator stack</text><line x1="412" x2="412" y1="72" y2="356" stroke="#26313d"></line><g><circle cx="140" cy="214" r="115" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.5"></circle><line x1="236" y1="150" x2="266" y2="138" stroke="#6f7f8f"></line><text x="272" y="134" font-weight="600" fill="#e4eaf0">Fiber mode</text><text x="272" y="150" font-size="11.5" fill="#95a3b1">9.2 µm at 1310 nm</text></g><g><rect x="133.75" y="210.25" width="12.5" height="7.5" fill="#e4eaf0"></rect><line x1="148" y1="216" x2="266" y2="262" stroke="#6f7f8f"></line><text x="272" y="266" font-weight="600" fill="#e4eaf0">Waveguide mode</text><text x="272" y="282" font-size="11.5" fill="#95a3b1">about 0.5 × 0.3 µm</text></g><g><line x1="24" x2="49" y1="352" y2="352" stroke="#e4eaf0" stroke-width="1.5"></line><text x="56" y="356" font-size="11.5" fill="#95a3b1">1 µm</text></g><g><rect x="440" y="100" width="136" height="60" fill="#19222c" stroke="#6f7f8f" stroke-width="1"></rect><text x="588" y="112" font-size="11.5" fill="#95a3b1">oxide cladding</text></g><g><rect x="440" y="160" width="136" height="120" fill="#19222c" stroke="#6f7f8f" stroke-width="1"></rect><text x="588" y="216" font-weight="600" fill="#e4eaf0">Buried oxide</text><text x="588" y="232" font-size="11.5" fill="#95a3b1">2 µm, n = 1.44</text></g><g><rect x="440" y="280" width="136" height="36" fill="#6f7f8f" fill-opacity="0.25" stroke="#6f7f8f" stroke-width="1"></rect><text x="588" y="302" font-size="11.5" fill="#95a3b1">silicon substrate</text></g><g><ellipse cx="508" cy="153" rx="20" ry="12" fill="#6ea2ff" fill-opacity="0.2" stroke="#6ea2ff" stroke-width="1.25" stroke-dasharray="3 2"></ellipse><rect x="493" y="147" width="30" height="13" fill="#e4eaf0"></rect><line x1="528" y1="148" x2="582" y2="138" stroke="#6f7f8f"></line><text x="588" y="138" font-weight="600" fill="#e4eaf0">Silicon core</text><text x="588" y="154" font-size="11.5" fill="#95a3b1">220 × 500 nm, n = 3.48</text></g><g><line x1="440" x2="500" y1="352" y2="352" stroke="#e4eaf0" stroke-width="1.5"></line><text x="508" y="356" font-size="11.5" fill="#95a3b1">1 µm</text></g></svg>