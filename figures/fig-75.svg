<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="3D stacking gives the shortest EIC-to-PIC path without tying the EIC to an old CMOS node" font-size="13"><defs><marker id="stk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">3D stacking gives the shortest path without an old CMOS node</text><text x="24" y="50" font-size="11.5" fill="#586572">Cross-sections, not to scale. EIC = drivers and TIAs; PIC = the photonic chip.</text><g><rect x="24" y="68" width="166" height="256" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="107" y="92" text-anchor="middle" font-weight="600" fill="#16202a">Wire bond</text><rect x="36" y="212" width="142" height="16" rx="2" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><rect x="40" y="188" width="80" height="24" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><rect x="128" y="192" width="46" height="20" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="80" y="204" text-anchor="middle" font-size="11.5" fill="#16202a">PIC</text><text x="151" y="206" text-anchor="middle" font-size="11.5" fill="#16202a">EIC</text><path d="M138 192C138 150 110 150 110 188" fill="none" stroke="#8794a1" stroke-width="1.5"></path><text x="124" y="140" text-anchor="middle" font-size="11.5" fill="#586572">bond wire</text><text x="40" y="252" font-size="11.5" fill="#16202a">joined by bond wires</text><text x="40" y="270" font-size="11.5" fill="#586572">highest parasitics</text><text x="40" y="288" font-size="11.5" fill="#16202a">− caps bandwidth</text></g><g><rect x="206" y="68" width="166" height="256" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="289" y="92" text-anchor="middle" font-weight="600" fill="#16202a">Flip-chip / 2.5D</text><rect x="218" y="212" width="142" height="16" rx="2" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><text x="289" y="224" text-anchor="middle" font-size="10.5" fill="#586572">interposer</text><rect x="222" y="182" width="76" height="22" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><rect x="310" y="182" width="46" height="22" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><circle cx="230" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="242" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="254" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="266" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="278" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="290" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="316" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="327" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="338" cy="208" r="2.5" fill="#8794a1"></circle><circle cx="349" cy="208" r="2.5" fill="#8794a1"></circle><text x="260" y="197" text-anchor="middle" font-size="11.5" fill="#16202a">PIC</text><text x="333" y="197" text-anchor="middle" font-size="11.5" fill="#16202a">EIC</text><text x="289" y="170" text-anchor="middle" font-size="11.5" fill="#586572">micro-bumps</text><text x="222" y="252" font-size="11.5" fill="#16202a">joined by micro-bumps</text><text x="222" y="270" font-size="11.5" fill="#586572">lower parasitics</text><text x="222" y="288" font-size="11.5" fill="#16202a">− longer path than 3D</text></g><g><rect x="388" y="68" width="166" height="256" rx="8" fill="none" stroke="#1f5fcf" stroke-width="2"></rect><text x="471" y="92" text-anchor="middle" font-weight="600" fill="#16202a">3D hybrid bond</text><rect x="400" y="212" width="142" height="16" rx="2" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><rect x="404" y="186" width="134" height="24" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><rect x="436" y="158" width="70" height="24" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><rect x="440" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="446" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="452" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="458" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="464" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="470" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="476" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="482" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="488" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="494" y="182" width="3" height="4" fill="#8794a1"></rect><rect x="500" y="182" width="3" height="4" fill="#8794a1"></rect><text x="420" y="202" text-anchor="middle" font-size="11.5" fill="#16202a">PIC</text><text x="471" y="174" text-anchor="middle" font-size="11.5" fill="#16202a">EIC</text><text x="471" y="146" text-anchor="middle" font-size="11.5" fill="#586572">Cu-Cu bonds, µm pitch</text><text x="404" y="252" font-size="11.5" fill="#16202a">joined by Cu-Cu bonds</text><text x="404" y="270" font-size="11.5" fill="#586572">lowest parasitics</text><text x="404" y="288" font-size="11.5" fill="#16202a">− EIC heat into the PIC</text><text x="404" y="308" font-size="11.5" font-weight="600" fill="#16202a">In volume in 2026</text></g><g><rect x="570" y="68" width="166" height="256" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="653" y="92" text-anchor="middle" font-weight="600" fill="#16202a">Monolithic</text><rect x="582" y="212" width="142" height="16" rx="2" fill="#eef2f6" stroke="#8794a1" stroke-width="1"></rect><rect x="586" y="182" width="134" height="28" rx="3" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><rect x="594" y="190" width="7" height="8" fill="#8794a1"></rect><rect x="606" y="190" width="7" height="8" fill="#8794a1"></rect><rect x="618" y="190" width="7" height="8" fill="#8794a1"></rect><rect x="630" y="190" width="7" height="8" fill="#8794a1"></rect><path d="M654 198H712" stroke="#1f5fcf" stroke-width="2"></path><text x="653" y="170" text-anchor="middle" font-size="11.5" fill="#586572">CMOS + photonics</text><text x="586" y="252" font-size="11.5" fill="#16202a">one chip</text><text x="586" y="270" font-size="11.5" fill="#586572">no bond parasitics</text><text x="586" y="288" font-size="11.5" fill="#16202a">− older CMOS node</text></g><g><path d="M40 348H538" stroke="#8794a1" stroke-width="1.25" marker-end="url(#stk-arrow)"></path><text x="289" y="370" text-anchor="middle" font-size="11.5" fill="#586572">shorter connections: fewer parasitics, less drive energy per bit</text></g></svg>