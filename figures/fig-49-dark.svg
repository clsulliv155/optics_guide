<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 330" role="img" aria-label="OCI runs four wavelengths each way on one fiber, in two O-band groups" font-size="13"><defs><marker id="oci-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6ea2ff"></path></marker><marker id="oci-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38c29b"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">OCI runs four wavelengths each way on one fiber, in two O-band groups</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">200G-OCI PHY v1.0; wavelength groups to scale, link schematic above</text><g><rect x="24" y="72" width="160" height="72" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="40" y="96" font-weight="600" fill="#e4eaf0">End A</text><text x="40" y="114" font-size="11.5" fill="#95a3b1">sends the short group</text><text x="40" y="130" font-size="11.5" fill="#95a3b1">receives the long group</text></g><g><rect x="576" y="72" width="160" height="72" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="592" y="96" font-weight="600" fill="#e4eaf0">End B</text><text x="592" y="114" font-size="11.5" fill="#95a3b1">sends the long group</text><text x="592" y="130" font-size="11.5" fill="#95a3b1">receives the short group</text></g><g><line x1="184" x2="576" y1="108" y2="108" stroke="#6f7f8f" stroke-width="4"></line><path d="M196 94H564" fill="none" stroke="#6ea2ff" stroke-width="1.5" marker-end="url(#oci-f)"></path><path d="M564 122H196" fill="none" stroke="#38c29b" stroke-width="1.5" marker-end="url(#oci-r)"></path><text x="380" y="86" text-anchor="middle" font-size="11.5" fill="#e4eaf0">4 × 53.125 GBd NRZ = 212.5 Gb/s</text><text x="380" y="140" text-anchor="middle" font-size="11.5" fill="#e4eaf0">4 × 53.125 GBd NRZ back</text><text x="380" y="164" text-anchor="middle" font-size="11.5" fill="#95a3b1">one single-mode fiber, under 100 m (budget to about 500 m)</text></g><g><rect x="200" y="206" width="103.50000000000136" height="40" rx="6" fill="#6ea2ff" fill-opacity="0.18" stroke="#6ea2ff" stroke-width="1.5"></rect><rect x="495.5000000000007" y="206" width="106.49999999999864" height="40" rx="6" fill="#38c29b" fill-opacity="0.18" stroke="#38c29b" stroke-width="1.5"></rect><text x="251.75000000000068" y="198" text-anchor="middle" font-size="11.5" fill="#e4eaf0">1308.0–1314.9 nm</text><text x="548.75" y="198" text-anchor="middle" font-size="11.5" fill="#e4eaf0">1327.7–1334.8 nm</text><text x="251.75000000000068" y="230" text-anchor="middle" font-weight="600" fill="#e4eaf0">short group</text><text x="548.75" y="230" text-anchor="middle" font-weight="600" fill="#e4eaf0">long group</text></g><g><line x1="80" x2="680" y1="262" y2="262" stroke="#6f7f8f" stroke-width="1.25"></line><g><line x1="80" x2="80" y1="262" y2="267" stroke="#6f7f8f"></line><text x="80" y="284" text-anchor="middle" font-size="11.5" fill="#95a3b1">1300</text></g><g><line x1="230" x2="230" y1="262" y2="267" stroke="#6f7f8f"></line><text x="230" y="284" text-anchor="middle" font-size="11.5" fill="#95a3b1">1310</text></g><g><line x1="380" x2="380" y1="262" y2="267" stroke="#6f7f8f"></line><text x="380" y="284" text-anchor="middle" font-size="11.5" fill="#95a3b1">1320</text></g><g><line x1="530" x2="530" y1="262" y2="267" stroke="#6f7f8f"></line><text x="530" y="284" text-anchor="middle" font-size="11.5" fill="#95a3b1">1330</text></g><g><line x1="680" x2="680" y1="262" y2="267" stroke="#6f7f8f"></line><text x="680" y="284" text-anchor="middle" font-size="11.5" fill="#95a3b1">1340</text></g><text x="680" y="306" text-anchor="end" font-size="11.5" fill="#95a3b1">Wavelength, nm (O-band)</text></g></svg>