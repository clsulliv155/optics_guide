<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 320" role="img" aria-label="Dropping the DSP saves over 10 W per 1.6T module, over 1 MW per 100,000" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">Dropping the DSP saves over 10 W per 1.6T module, over 1 MW per 100,000</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Vendor-listed power per 1.6T module; LPO lists under 10 W, so its dashed bar marks a ceiling</text><g><text x="232" y="88" font-size="11.5" fill="#95a3b1">Module power, watts</text><text x="590" y="88" text-anchor="middle" font-size="11.5" fill="#95a3b1">pJ/bit</text><text x="690" y="88" text-anchor="middle" font-size="11.5" fill="#95a3b1">MW per 100,000</text></g><g><g><line x1="232" x2="232" y1="100" y2="248" stroke="#26313d"></line><text x="232" y="266" text-anchor="middle" font-size="11.5" fill="#95a3b1">0</text></g><g><line x1="328" x2="328" y1="100" y2="248" stroke="#26313d"></line><text x="328" y="266" text-anchor="middle" font-size="11.5" fill="#95a3b1">10</text></g><g><line x1="424" x2="424" y1="100" y2="248" stroke="#26313d"></line><text x="424" y="266" text-anchor="middle" font-size="11.5" fill="#95a3b1">20</text></g><g><line x1="520" x2="520" y1="100" y2="248" stroke="#26313d"></line><text x="520" y="266" text-anchor="middle" font-size="11.5" fill="#95a3b1">30</text></g><line x1="232" x2="520" y1="248" y2="248" stroke="#6f7f8f" stroke-width="1.25"></line></g><g><g><rect x="424" y="108" width="57.60000000000002" height="24" rx="4" fill="#4f5d6b" fill-opacity="0.35" stroke="#4f5d6b" stroke-width="1.5" stroke-dasharray="none"></rect><text x="489.6" y="124" font-size="11.5" font-weight="600" fill="#e4eaf0">20–26 W</text><text x="590" y="124" text-anchor="middle" fill="#e4eaf0">12.5–16.3</text><text x="690" y="124" text-anchor="middle" font-weight="400" fill="#e4eaf0">2.0–2.6</text></g><g><rect x="337.6" y="160" width="38.39999999999998" height="24" rx="4" fill="#4f5d6b" fill-opacity="0.35" stroke="#4f5d6b" stroke-width="1.5" stroke-dasharray="none"></rect><text x="384" y="176" font-size="11.5" font-weight="600" fill="#e4eaf0">11–15 W</text><text x="590" y="176" text-anchor="middle" fill="#e4eaf0">6.9–9.4</text><text x="690" y="176" text-anchor="middle" font-weight="400" fill="#e4eaf0">1.1–1.5</text></g><g><rect x="232" y="212" width="96" height="24" rx="4" fill="#6ea2ff" fill-opacity="0.14" stroke="#6ea2ff" stroke-width="1.5" stroke-dasharray="5 4"></rect><text x="336" y="228" font-size="11.5" font-weight="600" fill="#e4eaf0">under 10 W</text><text x="590" y="228" text-anchor="middle" fill="#e4eaf0">under 6.3</text><text x="690" y="228" text-anchor="middle" font-weight="600" fill="#e4eaf0">under 1.0</text></g></g><g><text x="24" y="124" font-weight="600" fill="#e4eaf0">Retimed (full DSP)</text><text x="24" y="176" font-weight="600" fill="#e4eaf0">LRO (half-retimed)</text><text x="24" y="228" font-weight="600" fill="#e4eaf0">LPO (linear)</text></g><text x="24" y="300" font-size="11.5" fill="#95a3b1">100,000 modules ≈ the optics for 17,000–25,000 GPU ports at four to six per port; host SerDes power excluded.</text></svg>