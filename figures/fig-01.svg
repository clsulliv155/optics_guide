ont-size="11.5" fill="#16202a">Equalization</text><text x="672" y="198" text-anchor="middle" font-size="11.5" fill="#16202a">FEC decode</text></g><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M92 228V236H230V228"></path><path d="M238 228V236H522V228"></path><path d="M530 228V236H668V228"></path></g><text x="161" y="256" text-anchor="middle" font-weight="600" fill="#16202a">Electrical segment</text><text x="380" y="256" text-anchor="middle" font-weight="600" fill="#16202a">Optical segment</text><text x="599" y="256" text-anchor="middle" font-weight="600" fill="#16202a">Electrical segment</text><text x="161" y="274" text-anchor="middle" font-size="11.5" fill="#586572">host + module DSP</text><text x="380" y="274" text-anchor="middle" font-size="11.5" fill="#586572">module DSP to module DSP</text><text x="599" y="274" text-anchor="middle" font-size="11.5" fill="#586572">module DSP + host</text><text x="26" y="304" font-size="11.5" fill="#586572">With LPO there is no module DSP: the host SerDes equalizes all three segments as one channel.</text></svg>