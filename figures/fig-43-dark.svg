<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 428" role="img" aria-label="An external laser pays for its cool, swappable home in coupling loss and fiber" font-size="13"><defs><marker id="npo-lp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7f8f"></path></marker><marker id="npo-lp-heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a43a"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">An external laser pays for its cool, swappable home in coupling loss and fiber</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Schematic light path in an NPO design: what each option costs before the light reaches a modulator</text><text x="24" y="84" font-weight="600" fill="#e4eaf0">External laser: the light travels in from the front panel</text><g><rect x="24" y="96" width="124" height="72" rx="8" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.75"></rect><text x="40" y="120" font-weight="600" fill="#e4eaf0">Laser module</text><text x="40" y="136" font-size="11.5" fill="#95a3b1">front panel,</text><text x="40" y="152" font-size="11.5" fill="#95a3b1">cooler, hot-swap</text></g><g><rect x="170" y="96" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="186" y="120" font-weight="600" fill="#e4eaf0">PM fiber</text><text x="186" y="136" font-size="11.5" fill="#95a3b1">MT connector,</text><text x="186" y="152" font-size="11.5" fill="#95a3b1">clean end face</text></g><g><rect x="316" y="96" width="124" height="72" rx="8" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.75"></rect><text x="332" y="120" font-weight="600" fill="#e4eaf0">Fiber attach</text><text x="332" y="136" font-size="11.5" fill="#95a3b1">fiber-to-chip</text><text x="332" y="152" font-size="11.5" fill="#95a3b1">coupling loss</text></g><g><rect x="462" y="96" width="124" height="72" rx="8" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.75"></rect><text x="478" y="120" font-weight="600" fill="#e4eaf0">Splitter</text><text x="478" y="136" font-size="11.5" fill="#95a3b1">one laser feeds</text><text x="478" y="152" font-size="11.5" fill="#95a3b1">several lanes</text></g><g><rect x="608" y="96" width="124" height="72" rx="8" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.75"></rect><text x="624" y="120" font-weight="600" fill="#e4eaf0">Modulators</text><text x="624" y="136" font-size="11.5" fill="#95a3b1">in the PIC,</text><text x="624" y="152" font-size="11.5" fill="#95a3b1">polarized input</text></g><g fill="none" stroke="#6f7f8f" stroke-width="1.25"><path d="M148 132H168" marker-end="url(#npo-lp-arrow)"></path><path d="M294 132H314" marker-end="url(#npo-lp-arrow)"></path><path d="M440 132H460" marker-end="url(#npo-lp-arrow)"></path><path d="M586 132H606" marker-end="url(#npo-lp-arrow)"></path></g><g><path d="M170 178V186H586V178" fill="none" stroke="#f0a43a" stroke-width="1.5"></path><text x="378" y="204" text-anchor="middle" font-size="11.5" fill="#e4eaf0">optical loss the laser must overcome</text></g><text x="24" y="240" font-weight="600" fill="#e4eaf0">Built-in laser: the light starts inside the engine</text><g><rect x="24" y="252" width="124" height="72" rx="8" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.75"></rect><text x="40" y="276" font-weight="600" fill="#e4eaf0">Laser die</text><text x="40" y="292" font-size="11.5" fill="#95a3b1">on or beside</text><text x="40" y="308" font-size="11.5" fill="#95a3b1">the PIC</text></g><g><rect x="170" y="252" width="124" height="72" rx="8" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.75"></rect><text x="186" y="276" font-weight="600" fill="#e4eaf0">Modulators</text><text x="186" y="292" font-size="11.5" fill="#95a3b1">no fiber</text><text x="186" y="308" font-size="11.5" fill="#95a3b1">coupling</text></g><g><rect x="316" y="252" width="124" height="72" rx="8" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.75"></rect><text x="332" y="276" font-weight="600" fill="#e4eaf0">Fiber attach</text><text x="332" y="292" font-size="11.5" fill="#95a3b1">data fiber</text><text x="332" y="308" font-size="11.5" fill="#95a3b1">out only</text></g><g><rect x="462" y="252" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="478" y="276" font-weight="600" fill="#e4eaf0">Data fiber</text><text x="478" y="292" font-size="11.5" fill="#95a3b1">to the front</text><text x="478" y="308" font-size="11.5" fill="#95a3b1">panel</text></g><g><rect x="608" y="252" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="624" y="276" font-weight="600" fill="#e4eaf0">Front panel</text><text x="624" y="292" font-size="11.5" fill="#95a3b1">data fiber only,</text><text x="624" y="308" font-size="11.5" fill="#95a3b1">no laser slots</text></g><g fill="none" stroke="#6f7f8f" stroke-width="1.25"><path d="M148 288H168" marker-end="url(#npo-lp-arrow)"></path><path d="M294 288H314" marker-end="url(#npo-lp-arrow)"></path><path d="M440 288H460" marker-end="url(#npo-lp-arrow)"></path><path d="M586 288H606" marker-end="url(#npo-lp-arrow)"></path></g><g><rect x="24" y="348" width="270" height="56" rx="8" fill="#f0a43a" fill-opacity="0.10" stroke="#f0a43a" stroke-width="1.5"></rect><text x="40" y="372" font-weight="600" fill="#e4eaf0">EIC and nearby ASIC</text><text x="40" y="390" font-size="11.5" fill="#95a3b1">heat raises laser threshold</text><path d="M86 348V328" fill="none" stroke="#f0a43a" stroke-width="1.5" marker-end="url(#npo-lp-heat)"></path><text x="96" y="342" font-size="11.5" fill="#e4eaf0">heat</text></g><g><rect x="330" y="352" width="14" height="10" rx="2" fill="#f08a4b" fill-opacity="0.12" stroke="#f08a4b" stroke-width="1.5"></rect><text x="352" y="361" font-size="11.5" fill="#e4eaf0">Light source</text><rect x="330" y="370" width="14" height="10" rx="2" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="352" y="379" font-size="11.5" fill="#e4eaf0">Inside the socketed engine</text><rect x="330" y="388" width="14" height="10" rx="2" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="352" y="397" font-size="11.5" fill="#e4eaf0">Fiber path and front panel</text></g></svg>