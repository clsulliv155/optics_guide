<svg xmlns="http://www.w3.org/2000/svg" width="760" height="308" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 308" role="img" aria-label="Optics fail early, then rarely, then increasingly as lasers age" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">Optics fail early, then rarely, then increasingly as lasers age</text><text x="24" y="48" font-size="11.5" fill="#586572">The bathtub curve; schematic, no scale implied</text><g><rect x="64" y="80" width="136" height="164" fill="#eef2f6"></rect><rect x="580" y="80" width="140" height="164" fill="#eef2f6"></rect><g stroke="#dde3e9" stroke-dasharray="4 4"><line x1="200" x2="200" y1="80" y2="244"></line><line x1="580" x2="580" y1="80" y2="244"></line></g></g><g stroke="#8794a1" stroke-width="1.25"><line x1="64" x2="720" y1="244" y2="244"></line><line x1="64" x2="64" y1="70" y2="244"></line></g><text x="70" y="74" font-size="11.5" fill="#586572">failure rate</text><text x="720" y="262" text-anchor="end" font-size="11.5" fill="#586572">time in service</text><path d="M64 130C100 215 140 232 200 236L580 236C640 236 680 200 720 130" fill="none" stroke="#1f5fcf" stroke-width="2.5"></path><g><text x="132" y="100" text-anchor="middle" font-weight="600" fill="#16202a">Infant mortality</text><text x="132" y="116" text-anchor="middle" font-size="11.5" fill="#586572">screened by burn-in</text></g><g><text x="390" y="190" text-anchor="middle" font-weight="600" fill="#16202a">Useful life</text><text x="390" y="206" text-anchor="middle" font-size="11.5" fill="#586572">random failures: the FIT rate</text></g><g><text x="650" y="100" text-anchor="middle" font-weight="600" fill="#16202a">Wear-out</text><text x="650" y="116" text-anchor="middle" font-size="11.5" fill="#586572">mostly laser aging</text></g><text x="24" y="292" font-size="11.5" fill="#586572">Burn-in removes the early failures; telemetry (section 24) catches wear-out before it causes outages.</text></svg>