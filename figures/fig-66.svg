<svg xmlns="http://www.w3.org/2000/svg" width="760" height="436" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 436" role="img" aria-label="OMA is the outer swing, ER the ratio of outer levels, TDECQ the noise a transmitter can tolerate relative to ideal" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Three transmitter numbers: OMA is the swing, ER the level ratio, TDECQ the lost noise tolerance</text><text x="24" y="50" font-size="11.5" fill="#586572">Left: a PAM4 eye and the quantities read from its level histograms. Right: the TDECQ measurement path</text><g><line x1="56" x2="300" y1="300" y2="300" stroke="#8794a1" stroke-dasharray="3 3"></line><line x1="56" x2="300" y1="240" y2="240" stroke="#8794a1" stroke-dasharray="3 3"></line><line x1="56" x2="300" y1="180" y2="180" stroke="#8794a1" stroke-dasharray="3 3"></line><line x1="56" x2="300" y1="120" y2="120" stroke="#8794a1" stroke-dasharray="3 3"></line><path d="M56 270 C116 270 116 300 178 300 S240 270 300 270 M56 270 C116 270 116 240 178 240 S240 270 300 270" fill="none" stroke="#1f5fcf" stroke-width="2" stroke-opacity="0.85"></path><path d="M56 210 C116 210 116 240 178 240 S240 210 300 210 M56 210 C116 210 116 180 178 180 S240 210 300 210" fill="none" stroke="#1f5fcf" stroke-width="2" stroke-opacity="0.85"></path><path d="M56 150 C116 150 116 180 178 180 S240 150 300 150 M56 150 C116 150 116 120 178 120 S240 150 300 150" fill="none" stroke="#1f5fcf" stroke-width="2" stroke-opacity="0.85"></path><line x1="56" x2="56" y1="104" y2="316" stroke="#8794a1" stroke-width="1.25"></line></g><g font-size="11" fill="#586572" text-anchor="end"><text x="48" y="124">P3</text><text x="48" y="184">P2</text><text x="48" y="244">P1</text><text x="48" y="304">P0</text></g><g><line x1="314" x2="314" y1="120" y2="300" stroke="#d4632a" stroke-width="2"></line><line x1="308" x2="320" y1="120" y2="120" stroke="#d4632a" stroke-width="2"></line><line x1="308" x2="320" y1="300" y2="300" stroke="#d4632a" stroke-width="2"></line><text x="322" y="208" font-size="11" font-weight="600" fill="#d4632a">OMA outer</text><text x="322" y="222" font-size="10.5" fill="#586572">P3 − P0</text><line x1="56" x2="300" y1="210" y2="210" stroke="#d4632a" stroke-width="1.25" stroke-dasharray="6 4"></line><text x="296" y="204" text-anchor="end" font-size="10.5" fill="#d4632a">P avg: what DOM reports</text></g><g font-size="10.5" fill="#586572" text-anchor="middle"><text x="178" y="154">upper eye</text><text x="116" y="214">middle eye</text><text x="178" y="274">lower eye</text></g><g font-size="11" fill="#16202a"><text x="24" y="346">ER = P3 / P0 in dB; OMA = 2 · P avg · (ER − 1) / (ER + 1)</text><text x="24" y="364" fill="#586572">ER 3.5 dB: OMA sits 1.2 dB below P avg; ER 6 dB: 0.8 dB above</text><text x="24" y="386">Specs bind on OMA outer minus TDECQ, not on P avg</text><text x="24" y="404" fill="#586572">a worse Tx must launch more OMA; Rx are rated in OMA too</text></g><g><rect x="410" y="80" width="326" height="58" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.25"></rect><text x="422" y="99" font-weight="600" fill="#16202a">Reference receiver</text><text x="422" y="115" font-size="10.5" fill="#586572">Bessel-Thomson filter at half the symbol rate:</text><text x="422" y="129" font-size="10.5" fill="#586572">26.6 GHz at 53 GBd, 53.1 GHz at 106 GBd</text><rect x="410" y="146" width="326" height="58" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.25"></rect><text x="422" y="165" font-weight="600" fill="#16202a">Reference equalizer</text><text x="422" y="181" font-size="10.5" fill="#586572">5-tap FFE at 100G per lane; 802.3dj drafts</text><text x="422" y="195" font-size="10.5" fill="#586572">use 15 taps plus one DFE tap</text><rect x="410" y="212" width="326" height="58" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.25"></rect><text x="422" y="231" font-weight="600" fill="#16202a">Add Gaussian noise</text><text x="422" y="247" font-size="10.5" fill="#586572">until the symbol error ratio reaches</text><text x="422" y="261" font-size="10.5" fill="#586572">4.8 × 10⁻⁴, twice the 2.4 × 10⁻⁴ BER</text><rect x="410" y="278" width="326" height="58" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.25"></rect><text x="422" y="297" font-weight="600" fill="#16202a">Compare with ideal</text><text x="422" y="313" font-size="10.5" fill="#586572">TDECQ = 10·log(noise an ideal Tx tolerates</text><text x="422" y="327" font-size="10.5" fill="#586572">÷ noise this one tolerates); limit 3.4 dB</text><rect x="410" y="344" width="326" height="58" rx="6" fill="#eef2f6" stroke="#12876a" stroke-width="1.25"></rect><text x="422" y="363" font-weight="600" fill="#16202a">Pattern and scope</text><text x="422" y="379" font-size="10.5" fill="#586572">SSPRQ pattern; scope bandwidth well above the</text><text x="422" y="393" font-size="10.5" fill="#586572">filter so it can be applied in software</text></g><g stroke="#8794a1" stroke-width="1.5"><line x1="573" x2="573" y1="138" y2="146"></line><line x1="573" x2="573" y1="204" y2="212"></line><line x1="573" x2="573" y1="270" y2="278"></line><line x1="573" x2="573" y1="336" y2="344"></line></g><text x="24" y="424" font-size="10.5" fill="#586572">TDECQ replaced the NRZ-era TDP: it penalizes what an equalizing receiver cannot recover, not raw eye closure.</text></svg>