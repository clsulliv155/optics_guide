/text><text x="24" y="232" fill="#e4eaf0">LRO at switch, FRO at accelerator</text><text x="24" y="272" fill="#e4eaf0">LRO at every end</text><text x="24" y="312" font-weight="600" fill="#e4eaf0">LPO at switch, FRO at accelerator</text><text x="24" y="352" fill="#e4eaf0">LPO at every end</text></g><text x="24" y="416" font-size="11.5" fill="#95a3b1">Module watts sit within the vendor-listed 1.6T ranges in this section; host SerDes power excluded.</text><text x="24" y="434" font-size="11.5" fill="#95a3b1">1.6T LPO is vendor-listed but not yet MSA-specified, so at 1.6T the LRO rows are the realistic mixes today.</text></svg>