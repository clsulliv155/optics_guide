<svg xmlns="http://www.w3.org/2000/svg" width="760" height="458" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 458" role="img" aria-label="FRO on the accelerator still keeps three-quarters of the linear saving" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">FRO on the accelerator still keeps three-quarters of the linear saving</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Two-tier fabric, all optical, 1.6T modules; each bar runs accelerator end, leaf down, leaf up, spine</text><g><g><rect x="292" y="84" width="14" height="14" rx="3" fill="#4f5d6b" fill-opacity="0.5"></rect><text x="314" y="95" font-size="11.5" fill="#e4eaf0">FRO, 23 W per module</text></g><g><rect x="442" y="84" width="14" height="14" rx="3" fill="#f08a4b" fill-opacity="0.85"></rect><text x="464" y="95" font-size="11.5" fill="#e4eaf0">LRO, 13 W per module</text></g><g><rect x="592" y="84" width="14" height="14" rx="3" fill="#6ea2ff" fill-opacity="0.85"></rect><text x="614" y="95" font-size="11.5" fill="#e4eaf0">LPO, 9 W per module</text></g></g><g><text x="292" y="124" font-size="11.5" fill="#95a3b1">Optics watts per accelerator port</text><text x="690" y="124" text-anchor="middle" font-size="11.5" fill="#95a3b1">MW per 100,000</text></g><g><g><line x1="292" x2="292" y1="132" y2="368" stroke="#26313d"></line><text x="292" y="386" text-anchor="middle" font-size="11.5" fill="#95a3b1">0</text></g><g><line x1="372" x2="372" y1="132" y2="368" stroke="#26313d"></line><text x="372" y="386" text-anchor="middle" font-size="11.5" fill="#95a3b1">25</text></g><g><line x1="452" x2="452" y1="132" y2="368" stroke="#26313d"></line><text x="452" y="386" text-anchor="middle" font-size="11.5" fill="#95a3b1">50</text></g><g><line x1="532" x2="532" y1="132" y2="368" stroke="#26313d"></line><text x="532" y="386" text-anchor="middle" font-size="11.5" fill="#95a3b1">75</text></g><g><line x1="612" x2="612" y1="132" y2="36