<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 524" role="img" aria-label="Keep FRO on the accelerator unless its SerDes is qualified for linear" font-size="13"><defs><marker id="end-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Keep FRO on the accelerator unless its SerDes is qualified for linear</text><text x="24" y="50" font-size="11.5" fill="#586572">Decide each end in turn, accelerator first; at 200G per lane, read linear as LRO</text><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M256 112H176V200" marker-end="url(#end-arrow)"></path><path d="M504 112H584V200" marker-end="url(#end-arrow)"></path><path d="M176 272V292H104V316" marker-end="url(#end-arrow)"></path><path d="M176 292H280V316" marker-end="url(#end-arrow)"></path><path d="M584 272V292H464V316" marker-end="url(#end-arrow)"></path><path d="M584 292H648V316" marker-end="url(#end-arrow)"></path><path d="M648 388V408H472V428" marker-end="url(#end-arrow)"></path><path d="M648 408V428" marker-end="url(#end-arrow)"></path></g><g><text x="216" y="104" text-anchor="middle" font-size="11.5" fill="#586572">yes</text><text x="544" y="104" text-anchor="middle" font-size="11.5" fill="#586572">no</text><text x="140" y="286" text-anchor="middle" font-size="11.5" fill="#586572">yes</text><text x="228" y="286" text-anchor="middle" font-size="11.5" fill="#586572">no</text><text x="524" y="286" text-anchor="middle" font-size="11.5" fill="#586572">no</text><text x="616" y="286" text-anchor="middle" font-size="11.5" fill="#586572">yes</text><text x="560" y="402" text-anchor="middle" font-size="11.5" fill="#586572">yes</text><text x="656" y="422" font-size="11.5" fill="#586572">no</text></g><g><polygon points="256,112 380,76 504,112 380,148" fill="none" stroke="#8794a1" stroke-width="1.25"></polygon><text x="380" y="108" text-anchor="middle" fill="#16202a">Accelerator SerDes</text><text x="380" y="124" text-anchor="middle" fill="#16202a">qualified for linear?</text></g><g><polygon points="64,236 176,200 288,236 176,272" fill="none" stroke="#8794a1" stroke-width="1.25"></polygon><text x="176" y="232" text-anchor="middle" fill="#16202a">Switch qualified</text><text x="176" y="248" text-anchor="middle" fill="#16202a">for linear too?</text></g><g><polygon points="472,236 584,200 696,236 584,272" fill="none" stroke="#8794a1" stroke-width="1.25"></polygon><text x="584" y="232" text-anchor="middle" fill="#16202a">Switch qualified</text><text x="584" y="248" text-anchor="middle" fill="#16202a">for linear?</text></g><g><polygon points="560,352 648,316 736,352 648,388" fill="none" stroke="#8794a1" stroke-width="1.25"></polygon><text x="648" y="348" text-anchor="middle" fill="#16202a">LPO facing FRO</text><text x="648" y="364" text-anchor="middle" fill="#16202a">supported?</text></g><g><rect x="24" y="316" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="104" y="340" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Switch: linear</text><text x="104" y="356" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Accelerator: linear</text><text x="104" y="376" text-anchor="middle" font-size="11.5" fill="#586572">LPO, or LRO at 200G</text></g><g><rect x="200" y="316" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="280" y="340" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Switch: FRO</text><text x="280" y="356" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Accelerator: linear</text><text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#586572">LRO, or engineered LPO</text></g><g><rect x="384" y="316" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="464" y="340" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Switch: FRO</text><text x="464" y="356" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Accelerator: FRO</text><text x="464" y="376" text-anchor="middle" font-size="11.5" fill="#586572">Plug-and-play default</text></g><g><rect x="392" y="428" width="160" height="72" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="2"></rect><text x="472" y="452" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Switch: LPO</text><text x="472" y="468" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Accelerator: FRO</text><text x="472" y="488" text-anchor="middle" font-size="11.5" fill="#586572">Engineered; 100G lanes</text></g><g><rect x="568" y="428" width="160" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="648" y="452" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Switch: LRO</text><text x="648" y="468" text-anchor="middle" font-size="12.5" font-weight="600" fill="#16202a">Accelerator: FRO</text><text x="648" y="488" text-anchor="middle" font-size="11.5" fill="#586572">Fits 200G lanes</text></g></svg>