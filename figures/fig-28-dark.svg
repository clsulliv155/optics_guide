<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 460" role="img" aria-label="A coherent receiver mixes the signal with its own laser to recover phase" font-size="13"><defs><marker id="coh-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7f8f"></path></marker><marker id="coh-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f08a4b"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#e4eaf0">A coherent receiver mixes the signal with its own laser to recover phase</text><g><line x1="24" x2="48" y1="45" y2="45" stroke="#f08a4b" stroke-width="2"></line><text x="54" y="49" font-size="11.5" fill="#95a3b1">light</text><line x1="100" x2="124" y1="45" y2="45" stroke="#6f7f8f" stroke-width="1.5"></line><text x="130" y="49" font-size="11.5" fill="#95a3b1">electrical</text><rect x="204" y="40" width="14" height="10" rx="2" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="224" y="49" font-size="11.5" fill="#95a3b1">DSP</text></g><text x="24" y="72" font-size="11" font-weight="600" letter-spacing="1" fill="#95a3b1">TRANSMIT</text><g><rect x="24" y="80" width="152" height="88" rx="8" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="2"></rect><text x="100" y="104" text-anchor="middle" font-weight="600" fill="#e4eaf0">Transmit DSP</text><text x="100" y="122" text-anchor="middle" font-size="11.5" fill="#e4eaf0">FEC encode</text><text x="100" y="138" text-anchor="middle" font-size="11.5" fill="#e4eaf0">Map to 16QAM</text><text x="100" y="154" text-anchor="middle" font-size="11.5" fill="#e4eaf0">Pulse shaping</text></g><g><rect x="200" y="80" width="128" height="88" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="264" y="104" text-anchor="middle" font-weight="600" fill="#e4eaf0">DACs + drivers</text><text x="264" y="122" text-anchor="middle" font-size="11.5" fill="#e4eaf0">4 drive signals</text><text x="264" y="138" text-anchor="middle" font-size="11.5" fill="#e4eaf0">XI, XQ, YI, YQ</text></g><g><rect x="352" y="80" width="176" height="88" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="440" y="104" text-anchor="middle" font-weight="600" fill="#e4eaf0">DP-IQ modulator</text><text x="440" y="122" text-anchor="middle" font-size="11.5" fill="#e4eaf0">Nested Mach-Zehnders</text><text x="440" y="138" text-anchor="middle" font-size="11.5" fill="#e4eaf0">a pair per polarization</text></g><g><rect x="576" y="102" width="112" height="44" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="632" y="129" text-anchor="middle" font-weight="600" fill="#e4eaf0">To fiber</text></g><g><rect x="352" y="192" width="176" height="44" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="440" y="219" text-anchor="middle" font-weight="600" fill="#e4eaf0">Tunable laser (ITLA)</text></g><g fill="none" stroke-width="1.5"><path d="M176 124H198" stroke="#6f7f8f" marker-end="url(#coh-e)"></path><path d="M328 124H350" stroke="#6f7f8f" marker-end="url(#coh-e)"></path><path d="M528 124H574" stroke="#f08a4b" stroke-width="2" marker-end="url(#coh-o)"></path><path d="M440 192V170" stroke="#f08a4b" stroke-width="2" marker-end="url(#coh-o)"></path></g><line x1="24" x2="736" y1="252" y2="252" stroke="#26313d"></line><text x="24" y="272" font-size="11" font-weight="600" letter-spacing="1" fill="#95a3b1">RECEIVE</text><g><rect x="24" y="302" width="100" height="44" rx="8" fill="none" fill-opacity="1" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="74" y="329" text-anchor="middle" font-weight="600" fill="#e4eaf0">From fiber</text></g><g><rect x="148" y="280" widt