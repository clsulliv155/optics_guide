<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 400" role="img" aria-label="Only a linear-to-linear direction puts the whole path on one equalizer" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Only a linear-to-linear direction puts the whole path on one equalizer</text><text x="24" y="50" font-size="11.5" fill="#586572">One direction of a link, by what its transmitting and receiving ends hold</text><g><text x="318" y="82" text-anchor="middle" font-weight="600" fill="#16202a">Receive end retimes</text><text x="318" y="99" text-anchor="middle" font-size="11.5" fill="#586572">FRO</text><text x="602" y="82" text-anchor="middle" font-weight="600" fill="#16202a">Receive end is linear</text><text x="602" y="99" text-anchor="middle" font-size="11.5" fill="#586572">LRO or LPO</text></g><g><text x="24" y="160" font-weight="600" fill="#16202a">Transmit end</text><text x="24" y="177" font-weight="600" fill="#16202a">retimes</text><text x="24" y="196" font-size="11.5" fill="#586572">FRO or LRO</text><text x="24" y="300" font-weight="600" fill="#16202a">Transmit end</text><text x="24" y="317" font-weight="600" fill="#16202a">is linear</text><text x="24" y="336" font-size="11.5" fill="#586572">LPO</text></g><g><rect x="184" y="112" width="268" height="124" rx="8" fill="#1a8a46" fill-opacity="0.1" stroke="#1a8a46" stroke-width="2"></rect><text x="200" y="138" font-weight="600" fill="#16202a">Three short segments</text><text x="200" y="160" font-size="11.5" fill="#16202a">Each segment meets its own budget;</text><text x="200" y="176" font-size="11.5" fill="#16202a">any compliant host meets any module.</text><text x="200" y="200" font-size="11.5" fill="#586572">IEEE 802.3 PMDs</text><text x="200" y="220" font-size="11.5" font-weight="600" fill="#16202a">Easiest to qualify</text></g><g><rect x="468" y="112" width="268" height="124" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="484" y="138" font-weight="600" fill="#16202a">One equalizer after the fiber</text><text x="484" y="160" font-size="11.5" fill="#16202a">Clean light, the far TIA and the far</text><text x="484" y="176" font-size="11.5" fill="#16202a">host trace, recovered by its SerDes.</text><text x="484" y="200" font-size="11.5" fill="#586572">OIF 112G RTLR; 224G project open</text><text x="484" y="220" font-size="11.5" font-weight="600" fill="#16202a">In between</text></g><g><rect x="184" y="252" width="268" height="124" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="200" y="278" font-weight="600" fill="#16202a">One equalizer before the far DSP</text><text x="200" y="300" font-size="11.5" fill="#16202a">Near host trace, driver, laser and</text><text x="200" y="316" font-size="11.5" fill="#16202a">fiber; the far DSP cleans it up.</text><text x="200" y="340" font-size="11.5" fill="#586572">No spec yet: an engineered link</text><text x="200" y="360" font-size="11.5" font-weight="600" fill="#16202a">In between</text></g><g><rect x="468" y="252" width="268" height="124" rx="8" fill="#c27c0e" fill-opacity="0.1" stroke="#c27c0e" stroke-width="2"></rect><text x="484" y="278" font-weight="600" fill="#16202a">One equalizer for the whole path</text><text x="484" y="300" font-size="11.5" fill="#16202a">Both host traces, both modules and the</text><text x="484" y="316" font-size="11.5" fill="#16202a">fiber, all in the far host SerDes.</text><text x="484" y="340" font-size="11.5" fill="#586572">LPO MSA, 100G lanes only</text><text x="484" y="360" font-size="11.5" font-weight="600" fill="#16202a">Hardest to qualify</text></g></svg>