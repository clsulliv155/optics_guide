<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 330" role="img" aria-label="Transmitters and receivers are each tested against a reference" font-size="13"><defs><marker id="tb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#16202a">Transmitters and receivers are each tested against a reference</text><text x="24" y="48" font-size="11.5" fill="#586572">Blue marks the device under test; everything else is a defined reference</text><text x="24" y="76" font-size="11" font-weight="600" letter-spacing="1" fill="#586572">TRANSMITTER TEST (TDECQ)</text><g><rect x="24" y="86" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="170" y="86" width="128" height="56" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="2"></rect><rect x="316" y="86" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="462" y="86" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="608" y="86" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M152 114H168" marker-end="url(#tb-arrow)"></path><path d="M298 114H314" marker-end="url(#tb-arrow)"></path><path d="M444 114H460" marker-end="url(#tb-arrow)"></path><path d="M590 114H606" marker-end="url(#tb-arrow)"></path></g><text x="88" y="109" text-anchor="middle" font-weight="600" fill="#16202a">Pattern</text><text x="88" y="127" text-anchor="middle" font-size="11.5" fill="#586572">SSPRQ</text><text x="234" y="109" text-anchor="middle" font-weight="600" fill="#16202a">Transmitter</text><text x="234" y="127" text-anchor="middle" font-size="11.5" fill="#586572">under test</text><text x="380" y="109" text-anchor="middle" font-weight="600" fill="#16202a">Reference Rx</text><text x="380" y="127" text-anchor="middle" font-size="11.5" fill="#586572">Bessel-Thomson</text><text x="526" y="109" text-anchor="middle" font-weight="600" fill="#16202a">Scope</text><text x="526" y="127" text-anchor="middle" font-size="11.5" fill="#586572">captures the eye</text><text x="672" y="109" text-anchor="middle" font-weight="600" fill="#16202a">Ref. equalizer</text><text x="672" y="127" text-anchor="middle" font-size="11.5" fill="#586572">→ TDECQ in dB</text></g><line x1="24" x2="736" y1="170" y2="170" stroke="#dde3e9"></line><text x="24" y="196" font-size="11" font-weight="600" letter-spacing="1" fill="#586572">RECEIVER TEST (STRESSED SENSITIVITY)</text><g><rect x="24" y="206" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="170" y="206" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="316" y="206" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><rect x="462" y="206" width="128" height="56" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="2"></rect><rect x="608" y="206" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M152 234H168" marker-end="url(#tb-arrow)"></path><path d="M298 234H314" marker-end="url(#tb-arrow)"></path><path d="M444 234H460" marker-end="url(#tb-arrow)"></path><path d="M590 234H606" marker-end="url(#tb-arrow)"></path></g><text x="88" y="229" text-anchor="middle" font-weight="600" fill="#16202a">Reference Tx</text><text x="88" y="247" text-anchor="middle" font-size="11.5" fill="#586572">clean source</text><text x="234" y="229" text-anchor="middle" font-weight="600" fill="#16202a">Stress</text><text x="234" y="247" text-anchor="middle" font-size="11.5" fill="#586572">adds ISI, jitter</text><text x="380" y="229" text-anchor="middle" font-weight="600" fill="#16202a">Attenuator</text><text x="380" y="247" text-anchor="middle" font-size="11.5" fill="#586572">sets Rx power</text><text x="526" y="229" text-anchor="middle" font-weight="600" fill="#16202a">Receiver</text><text x="526" y="247" text-anchor="middle" font-size="11.5" fill="#586572">under test</text><text x="672" y="229" text-anchor="middle" font-weight="600" fill="#16202a">Error detector</text><text x="672" y="247" text-anchor="middle" font-size="11.5" fill="#586572">PRBS31Q → BER</text></g><text x="24" y="296" font-size="11.5" fill="#16202a">Worst legal transmitter + worst legal channel + worst legal receiver must still meet the BER target.</text><text x="24" y="314" font-size="11.5" fill="#586572">The stress stage also adds interference and noise until the signal is as bad as the worst legal transmitter.</text></svg>