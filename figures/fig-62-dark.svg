<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 400" role="img" aria-label="An OCS aims light with mirrors; it never reads a bit" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#e4eaf0">An OCS aims light with mirrors; it never reads a bit</text><text x="24" y="48" font-size="11.5" fill="#95a3b1">Schematic 3D MEMS switch; two of the N paths shown</text><text x="24" y="86" font-size="11.5" font-weight="600" fill="#95a3b1">Input fibers</text><text x="240" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="#95a3b1">Mirror array 1</text><text x="500" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="#95a3b1">Mirror array 2</text><text x="736" y="86" text-anchor="end" font-size="11.5" font-weight="600" fill="#95a3b1">Output fibers</text><g stroke="#26313d" stroke-width="2"><line x1="24" x2="120" y1="110" y2="110"></line><line x1="24" x2="120" y1="150" y2="150"></line><line x1="24" x2="120" y1="190" y2="190"></line><line x1="24" x2="120" y1="230" y2="230"></line><line x1="24" x2="120" y1="270" y2="270"></line><line x1="640" x2="736" y1="110" y2="110"></line><line x1="640" x2="736" y1="150" y2="150"></line><line x1="640" x2="736" y1="190" y2="190"></line><line x1="640" x2="736" y1="230" y2="230"></line><line x1="640" x2="736" y1="270" y2="270"></line></g><g><rect x="120" y="96" width="24" height="188" rx="4" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></rect><rect x="616" y="96" width="24" height="188" rx="4" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></rect></g><g stroke="#6f7f8f" stroke-width="3" stroke-linecap="round"><line x1="234" y1="118" x2="246" y2="102"></line><line x1="234" y1="158" x2="246" y2="142"></line><line x1="234" y1="198" x2="246" y2="182"></line><line x1="234" y1="238" x2="246" y2="222"></line><line x1="234" y1="278" x2="246" y2="262"></line><line x1="494" y1="102" x2="506" y2="118"></line><line x1="494" y1="142" x2="506" y2="158"></line><line x1="494" y1="182" x2="506" y2="198"></line><line x1="494" y1="222" x2="506" y2="238"></line><line x1="494" y1="262" x2="506" y2="278"></line></g><g fill="none" stroke="#6ea2ff" stroke-width="2.5"><path d="M24 150H240L500 230H736"></path></g><g fill="none" stroke="#f08a4b" stroke-width="2.5"><path d="M24 230H240L500 110H736"></path></g><text x="736" y="222" text-anchor="end" font-size="11.5" fill="#e4eaf0">from input 2</text><text x="736" y="102" text-anchor="end" font-size="11.5" fill="#e4eaf0">from input 4</text><g><rect x="290" y="312" width="180" height="44" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="380" y="331" text-anchor="middle" font-size="12" font-weight="600" fill="#e4eaf0">Camera + control</text><text x="380" y="347" text-anchor="middle" font-size="11.5" fill="#95a3b1">aligns every mirror</text><g stroke="#6f7f8f" stroke-width="1" stroke-dasharray="3 3"><line x1="320" y1="312" x2="244" y2="284"></line><line x1="440" y1="312" x2="496" y2="284"></line></g></g><text x="24" y="386" font-size="11.5" fill="#95a3b1">Any rate, wavelength or protocol passes through; each pass costs about 2 dB; reconfiguring takes milliseconds.</text></svg>