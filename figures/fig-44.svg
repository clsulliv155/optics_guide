<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 416" role="img" aria-label="A laser failure costs a front-panel swap, an engine swap or a switch swap" font-size="13"><defs><marker id="npo-fail-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">A laser failure costs a front-panel swap, an engine swap or a switch swap</text><text x="24" y="50" font-size="11.5" fill="#586572">What happens when one laser dies, by where the lasers live</text><g><text x="132" y="84" text-anchor="middle" font-weight="600" fill="#16202a">External laser</text><rect x="24" y="100" width="216" height="72" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="40" y="124" font-weight="600" fill="#16202a">What goes dark</text><text x="40" y="140" font-size="11.5" fill="#586572">every lane that laser feeds,</text><text x="40" y="156" font-size="11.5" fill="#586572">often several via a splitter</text><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M132 174V192" marker-end="url(#npo-fail-arrow)"></path><path d="M132 270V288" marker-end="url(#npo-fail-arrow)"></path></g><rect x="24" y="196" width="216" height="72" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="40" y="220" font-weight="600" fill="#16202a">The fix</text><text x="40" y="236" font-size="11.5" fill="#586572">hot-swap the laser module</text><text x="40" y="252" font-size="11.5" fill="#586572">at the front panel</text><rect x="24" y="292" width="216" height="72" rx="8" fill="#1a8a46" fill-opacity="0.12" stroke="#1a8a46" stroke-width="2"></rect><text x="40" y="316" font-weight="600" fill="#16202a">The disruption</text><text x="40" y="332" font-size="11.5" fill="#16202a">one laser group</text><text x="40" y="348" font-size="11.5" fill="#16202a">no chassis work</text></g><g><text x="380" y="84" text-anchor="middle" font-weight="600" fill="#16202a">Built-in laser, NPO</text><rect x="272" y="100" width="216" height="72" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="288" y="124" font-weight="600" fill="#16202a">What goes dark</text><text x="288" y="140" font-size="11.5" fill="#586572">that laser&#x27;s lanes,</text><text x="288" y="156" font-size="11.5" fill="#586572">often one laser per lane</text><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M380 174V192" marker-end="url(#npo-fail-arrow)"></path><path d="M380 270V288" marker-end="url(#npo-fail-arrow)"></path></g><rect x="272" y="196" width="216" height="72" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="288" y="220" font-weight="600" fill="#16202a">The fix</text><text x="288" y="236" font-size="11.5" fill="#586572">unplug and replace</text><text x="288" y="252" font-size="11.5" fill="#586572">the socketed engine</text><rect x="272" y="292" width="216" height="72" rx="8" fill="#c27c0e" fill-opacity="0.12" stroke="#c27c0e" stroke-width="2"></rect><text x="288" y="316" font-weight="600" fill="#16202a">The disruption</text><text x="288" y="332" font-size="11.5" fill="#16202a">the engine&#x27;s 6.4–12.8T</text><text x="288" y="348" font-size="11.5" fill="#16202a">in a maintenance window</text></g><g><text x="628" y="84" text-anchor="middle" font-weight="600" fill="#16202a">Built-in laser, CPO</text><rect x="520" y="100" width="216" height="72" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="536" y="124" font-weight="600" fill="#16202a">What goes dark</text><text x="536" y="140" font-size="11.5" fill="#586572">that laser&#x27;s lanes,</text><text x="536" y="156" font-size="11.5" fill="#586572">often one laser per lane</text><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M628 174V192" marker-end="url(#npo-fail-arrow)"></path><path d="M628 270V288" marker-end="url(#npo-fail-arrow)"></path></g><rect x="520" y="196" width="216" height="72" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="536" y="220" font-weight="600" fill="#16202a">The fix</text><text x="536" y="236" font-size="11.5" fill="#586572">no engine-level repair;</text><text x="536" y="252" font-size="11.5" fill="#586572">replace the switch or tray</text><rect x="520" y="292" width="216" height="72" rx="8" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="2"></rect><text x="536" y="316" font-weight="600" fill="#16202a">The disruption</text><text x="536" y="332" font-size="11.5" fill="#16202a">the whole switch, which is</text><text x="536" y="348" font-size="11.5" fill="#16202a">why CPO keeps lasers outside</text></g><text x="24" y="396" font-size="11.5" fill="#586572">Stock spares by the replaceable unit: laser modules, engines or whole switches.</text></svg>