<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 380" role="img" aria-label="LPO facing FRO: each direction has one linear segment and one standard one" font-size="13"><defs><marker id="mix-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker><marker id="mix-arrow-lin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5fcf"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">LPO facing FRO: each direction has one linear segment and one standard one</text><text x="24" y="50" font-size="11.5" fill="#586572">Linear at the switch, FRO on the accelerator; each arrow is what one equalizer covers</text><g stroke="#dde3e9" stroke-width="1" stroke-dasharray="3 4"><line x1="100" x2="100" y1="132" y2="170"></line><line x1="510" x2="510" y1="132" y2="170"></line><line x1="670" x2="670" y1="132" y2="170"></line><line x1="100" x2="100" y1="226" y2="254"></line><line x1="510" x2="510" y1="226" y2="254"></line><line x1="670" x2="670" y1="226" y2="254"></line></g><text x="24" y="84" font-weight="600" fill="#16202a">Switch to accelerator</text><g><path d="M100 124H504" stroke="#1f5fcf" stroke-width="2.5" fill="none" marker-end="url(#mix-arrow-lin)"></path><path d="M516 124H664" stroke="#8794a1" stroke-width="1.5" fill="none" marker-end="url(#mix-arrow)"></path><text x="305" y="112" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">Linear: switch SerDes to the FRO DSP</text><text x="590" y="112" text-anchor="middle" font-size="11.5" fill="#16202a">Standard host link</text></g><g><rect x="24" y="170" width="152" height="56" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="100" y="194" text-anchor="middle" font-weight="600" fill="#16202a">Switch ASIC</text><text x="100" y="212" text-anchor="middle" font-size="11.5" fill="#586572">SerDes drives linear</text></g><g stroke="#8794a1" stroke-width="1.25"><line x1="176" x2="208" y1="198" y2="198"></line><line x1="580" x2="604" y1="198" y2="198"></line></g><g><rect x="208" y="170" width="140" height="56" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="278" y="194" text-anchor="middle" font-weight="600" fill="#16202a">LPO module</text><text x="278" y="212" text-anchor="middle" font-size="11.5" fill="#586572">analog, no DSP</text></g><g><line x1="348" x2="440" y1="192" y2="192" stroke="#8794a1" stroke-width="1.25"></line><line x1="348" x2="440" y1="206" y2="206" stroke="#8794a1" stroke-width="1.25"></line><text x="394" y="182" text-anchor="middle" font-size="11.5" fill="#586572">fiber pair</text></g><g><rect x="440" y="170" width="140" height="56" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="510" y="194" text-anchor="middle" font-weight="600" fill="#16202a">FRO module</text><text x="510" y="212" text-anchor="middle" font-size="11.5" fill="#586572">DSP both ways</text></g><g><rect x="604" y="170" width="132" height="56" rx="8" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="670" y="194" text-anchor="middle" font-weight="600" fill="#16202a">Accelerator</text><text x="670" y="212" text-anchor="middle" font-size="11.5" fill="#586572">standard SerDes</text></g><g><path d="M670 262H516" stroke="#8794a1" stroke-width="1.5" fill="none" marker-end="url(#mix-arrow)"></path><path d="M504 262H106" stroke="#1f5fcf" stroke-width="2.5" fill="none" marker-end="url(#mix-arrow-lin)"></path><text x="590" y="284" text-anchor="middle" font-size="11.5" fill="#16202a">Standard host link</text><text x="305" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16202a">Linear: FRO DSP to the switch SerDes</text></g><text x="24" y="312" font-weight="600" fill="#16202a">Accelerator to switch</text><text x="24" y="340" font-size="11.5" fill="#586572">Telemetry: the FRO DSP&#x27;s media-side SNR measures the whole linear segment, apart from the accelerator link;</text><text x="24" y="356" font-size="11.5" fill="#586572">the switch SerDes reports how the FRO signal arrives.</text></svg>