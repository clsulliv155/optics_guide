<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 352" role="img" aria-label="An NPO engine is a CPO engine on its own socketed substrate" font-size="13"><defs><marker id="npo-eng-fib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38c29b"></path></marker><marker id="npo-eng-las" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f08a4b"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">An NPO engine is a CPO engine on its own socketed substrate</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Schematic side view, layers not to scale; the ASIC sits a few centimeters away on the same board</text><g><rect x="24" y="72" width="464" height="32" rx="6" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="256" y="93" text-anchor="middle" font-weight="600" fill="#e4eaf0">Shared liquid cold plate</text></g><g><rect x="48" y="112" width="104" height="64" rx="6" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="100" y="148" text-anchor="middle" font-weight="600" fill="#e4eaf0">Switch ASIC</text><rect x="24" y="180" width="152" height="72" rx="6" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="100" y="220" text-anchor="middle" fill="#e4eaf0">ASIC package</text></g><g><rect x="288" y="112" width="160" height="32" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="368" y="133" text-anchor="middle" fill="#e4eaf0">EIC: drivers, TIAs</text></g><g><rect x="264" y="148" width="208" height="32" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="368" y="169" text-anchor="middle" fill="#e4eaf0">PIC: modulators, detectors</text></g><g><rect x="476" y="148" width="56" height="32" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="504" y="169" text-anchor="middle" font-weight="600" fill="#e4eaf0">FAU</text></g><g><rect x="248" y="184" width="240" height="32" rx="6" fill="#6ea2ff" fill-opacity="0.12" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="368" y="205" text-anchor="middle" font-weight="600" fill="#e4eaf0">Engine substrate</text></g><g><rect x="248" y="220" width="240" height="32" rx="6" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="368" y="241" text-anchor="middle" fill="#e4eaf0">Socket: engine unplugs here</text></g><g><rect x="624" y="112" width="112" height="140" rx="6" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="680" y="132" text-anchor="middle" font-weight="600" fill="#e4eaf0">Front panel</text><rect x="636" y="148" width="88" height="32" rx="6" fill="#38c29b" fill-opacity="0.10" stroke="#38c29b" stroke-width="1.5"></rect><text x="680" y="168" text-anchor="middle" font-size="11.5" fill="#e4eaf0">Fiber port</text><rect x="636" y="200" width="88" height="32" rx="6" fill="#f08a4b" fill-opacity="0.10" stroke="#f08a4b" stroke-width="1.5"></rect><text x="680" y="220" text-anchor="middle" font-size="11.5" fill="#e4eaf0">Laser module</text></g><g><rect x="24" y="256" width="712" height="32" rx="6" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="720" y="277" text-anchor="end" fill="#e4eaf0">Switch main board</text><path d="M150 252V272H272V252" fill="none" stroke="#6f7f8f" stroke-width="1.5"></path></g><g><path d="M534 164H634" fill="none" stroke="#38c29b" stroke-width="1.75" marker-start="url(#npo-eng-fib)" marker-end="url(#npo-eng-fib)"></path><text x="584" y="156" text-anchor="middle" font-size="11.5" fill="#95a3b1">data fiber</text></g><g><path d="M636 216H504V182" fill="none" stroke="#f08a4b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#npo-eng-las)"></path><text x="584" y="234" text-anchor="middle" font-size="11.5" fill="#95a3b1">laser light</text></g><text x="211" y="306" text-anchor="middle" font-size="11.5" fill="#e4eaf0">XSR+ traces: a few cm, about 13 dB</text><text x="24" y="330" font-size="11.5" fill="#95a3b1">Same parts as a CPO engine (section 25); the socketed substrate is what makes it near-packaged.</text></svg>