<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 320" role="img" aria-label="Every hop from the engine to the far end has a denser option coming" font-size="13"><defs><marker id="fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7f8f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">Every hop from the engine to the far end has a denser option coming</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Connectivity in a CPO or NPO switch and its cabling: what ships today (outline) and what is next (blue)</text><g fill="none" stroke="#6f7f8f" stroke-width="1.25"><path d="M152 92H168" marker-end="url(#fc-arrow)"></path><path d="M298 92H314" marker-end="url(#fc-arrow)"></path><path d="M444 92H460" marker-end="url(#fc-arrow)"></path><path d="M590 92H606" marker-end="url(#fc-arrow)"></path></g><g><rect x="24" y="72" width="128" height="40" rx="8" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="88" y="97" text-anchor="middle" font-weight="600" fill="#e4eaf0">Engine attach</text><rect x="24" y="124" width="128" height="80" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="34" y="142" font-size="11.5" font-weight="600" fill="#e4eaf0">Today</text><text x="34" y="158" font-size="11.5" fill="#e4eaf0">Fiber array (FAU),</text><text x="34" y="174" font-size="11.5" fill="#e4eaf0">glued pigtails,</text><text x="34" y="190" font-size="11.5" fill="#e4eaf0">edge or grating</text><rect x="24" y="216" width="128" height="80" rx="8" fill="#6ea2ff" fill-opacity="0.10" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="34" y="234" font-size="11.5" font-weight="600" fill="#e4eaf0">Next</text><text x="34" y="250" font-size="11.5" fill="#e4eaf0">Detachable fiber</text><text x="34" y="266" font-size="11.5" fill="#e4eaf0">connectors; glass</text><text x="34" y="282" font-size="11.5" fill="#e4eaf0">or polymer guides</text></g><g><rect x="170" y="72" width="128" height="40" rx="8" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="234" y="97" text-anchor="middle" font-weight="600" fill="#e4eaf0">Inside the box</text><rect x="170" y="124" width="128" height="80" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="180" y="142" font-size="11.5" font-weight="600" fill="#e4eaf0">Today</text><text x="180" y="158" font-size="11.5" fill="#e4eaf0">Fiber shuffles</text><text x="180" y="174" font-size="11.5" fill="#e4eaf0">and ribbons</text><text x="180" y="190" font-size="11.5" fill="#e4eaf0">to the panel</text><rect x="170" y="216" width="128" height="80" rx="8" fill="#6ea2ff" fill-opacity="0.10" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="180" y="234" font-size="11.5" font-weight="600" fill="#e4eaf0">Next</text><text x="180" y="250" font-size="11.5" fill="#e4eaf0">Blind-mate MT,</text><text x="180" y="266" font-size="11.5" fill="#e4eaf0">expanded-beam</text><text x="180" y="282" font-size="11.5" fill="#e4eaf0">ferrules</text></g><g><rect x="316" y="72" width="128" height="40" rx="8" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="380" y="97" text-anchor="middle" font-weight="600" fill="#e4eaf0">Front panel</text><rect x="316" y="124" width="128" height="80" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="326" y="142" font-size="11.5" font-weight="600" fill="#e4eaf0">Today</text><text x="326" y="158" font-size="11.5" fill="#e4eaf0">MPO-12, MPO-16;</text><text x="326" y="174" font-size="11.5" fill="#e4eaf0">LC, SN, MDC duplex;</text><text x="326" y="190" font-size="11.5" fill="#e4eaf0">MT-12 laser ports</text><rect x="316" y="216" width="128" height="80" rx="8" fill="#6ea2ff" fill-opacity="0.10" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="326" y="234" font-size="11.5" font-weight="600" fill="#e4eaf0">Next</text><text x="326" y="250" font-size="11.5" fill="#e4eaf0">MMC and SN-MT:</text><text x="326" y="266" font-size="11.5" fill="#e4eaf0">16–32 fibers, about</text><text x="326" y="282" font-size="11.5" fill="#e4eaf0">3× MPO density</text></g><g><rect x="462" y="72" width="128" height="40" rx="8" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="526" y="97" text-anchor="middle" font-weight="600" fill="#e4eaf0">Plant and trunks</text><rect x="462" y="124" width="128" height="80" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="472" y="142" font-size="11.5" font-weight="600" fill="#e4eaf0">Today</text><text x="472" y="158" font-size="11.5" fill="#e4eaf0">MPO trunks,</text><text x="472" y="174" font-size="11.5" fill="#e4eaf0">high-count ribbon</text><text x="472" y="190" font-size="11.5" fill="#e4eaf0">cables</text><rect x="462" y="216" width="128" height="80" rx="8" fill="#6ea2ff" fill-opacity="0.10" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="472" y="234" font-size="11.5" font-weight="600" fill="#e4eaf0">Next</text><text x="472" y="250" font-size="11.5" fill="#e4eaf0">VSFF panels: up</text><text x="472" y="266" font-size="11.5" fill="#e4eaf0">to 3,456 fibers</text><text x="472" y="282" font-size="11.5" fill="#e4eaf0">in one rack unit</text></g><g><rect x="608" y="72" width="128" height="40" rx="8" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="672" y="97" text-anchor="middle" font-weight="600" fill="#e4eaf0">The fiber</text><rect x="608" y="124" width="128" height="80" rx="8" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="618" y="142" font-size="11.5" font-weight="600" fill="#e4eaf0">Today</text><text x="618" y="158" font-size="11.5" fill="#e4eaf0">G.652, G.657</text><text x="618" y="174" font-size="11.5" fill="#e4eaf0">single-mode;</text><text x="618" y="190" font-size="11.5" fill="#e4eaf0">OM4, OM5</text><rect x="608" y="216" width="128" height="80" rx="8" fill="#6ea2ff" fill-opacity="0.10" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="618" y="234" font-size="11.5" font-weight="600" fill="#e4eaf0">Next</text><text x="618" y="250" font-size="11.5" fill="#e4eaf0">4-core fiber</text><text x="618" y="266" font-size="11.5" fill="#e4eaf0">(SDM4 v1.0);</text><text x="618" y="282" font-size="11.5" fill="#e4eaf0">hollow-core</text></g></svg>