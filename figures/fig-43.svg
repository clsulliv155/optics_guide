<svg xmlns="http://www.w3.org/2000/svg" width="760" height="428" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 428" role="img" aria-label="An external laser pays for its cool, swappable home in coupling loss and fiber" font-size="13"><defs><marker id="npo-lp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8794a1"></path></marker><marker id="npo-lp-heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c27c0e"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">An external laser pays for its cool, swappable home in coupling loss and fiber</text><text x="24" y="50" font-size="11.5" fill="#586572">Schematic light path in an NPO design: what each option costs before the light reaches a modulator</text><text x="24" y="84" font-weight="600" fill="#16202a">External laser: the light travels in from the front panel</text><g><rect x="24" y="96" width="124" height="72" rx="8" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.75"></rect><text x="40" y="120" font-weight="600" fill="#16202a">Laser module</text><text x="40" y="136" font-size="11.5" fill="#586572">front panel,</text><text x="40" y="152" font-size="11.5" fill="#586572">cooler, hot-swap</text></g><g><rect x="170" y="96" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="186" y="120" font-weight="600" fill="#16202a">PM fiber</text><text x="186" y="136" font-size="11.5" fill="#586572">MT connector,</text><text x="186" y="152" font-size="11.5" fill="#586572">clean end face</text></g><g><rect x="316" y="96" width="124" height="72" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.75"></rect><text x="332" y="120" font-weight="600" fill="#16202a">Fiber attach</text><text x="332" y="136" font-size="11.5" fill="#586572">fiber-to-chip</text><text x="332" y="152" font-size="11.5" fill="#586572">coupling loss</text></g><g><rect x="462" y="96" width="124" height="72" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.75"></rect><text x="478" y="120" font-weight="600" fill="#16202a">Splitter</text><text x="478" y="136" font-size="11.5" fill="#586572">one laser feeds</text><text x="478" y="152" font-size="11.5" fill="#586572">several lanes</text></g><g><rect x="608" y="96" width="124" height="72" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.75"></rect><text x="624" y="120" font-weight="600" fill="#16202a">Modulators</text><text x="624" y="136" font-size="11.5" fill="#586572">in the PIC,</text><text x="624" y="152" font-size="11.5" fill="#586572">polarized input</text></g><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M148 132H168" marker-end="url(#npo-lp-arrow)"></path><path d="M294 132H314" marker-end="url(#npo-lp-arrow)"></path><path d="M440 132H460" marker-end="url(#npo-lp-arrow)"></path><path d="M586 132H606" marker-end="url(#npo-lp-arrow)"></path></g><g><path d="M170 178V186H586V178" fill="none" stroke="#c27c0e" stroke-width="1.5"></path><text x="378" y="204" text-anchor="middle" font-size="11.5" fill="#16202a">optical loss the laser must overcome</text></g><text x="24" y="240" font-weight="600" fill="#16202a">Built-in laser: the light starts inside the engine</text><g><rect x="24" y="252" width="124" height="72" rx="8" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.75"></rect><text x="40" y="276" font-weight="600" fill="#16202a">Laser die</text><text x="40" y="292" font-size="11.5" fill="#586572">on or beside</text><text x="40" y="308" font-size="11.5" fill="#586572">the PIC</text></g><g><rect x="170" y="252" width="124" height="72" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.75"></rect><text x="186" y="276" font-weight="600" fill="#16202a">Modulators</text><text x="186" y="292" font-size="11.5" fill="#586572">no fiber</text><text x="186" y="308" font-size="11.5" fill="#586572">coupling</text></g><g><rect x="316" y="252" width="124" height="72" rx="8" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.75"></rect><text x="332" y="276" font-weight="600" fill="#16202a">Fiber attach</text><text x="332" y="292" font-size="11.5" fill="#586572">data fiber</text><text x="332" y="308" font-size="11.5" fill="#586572">out only</text></g><g><rect x="462" y="252" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="478" y="276" font-weight="600" fill="#16202a">Data fiber</text><text x="478" y="292" font-size="11.5" fill="#586572">to the front</text><text x="478" y="308" font-size="11.5" fill="#586572">panel</text></g><g><rect x="608" y="252" width="124" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8794a1" stroke-width="1.25"></rect><text x="624" y="276" font-weight="600" fill="#16202a">Front panel</text><text x="624" y="292" font-size="11.5" fill="#586572">data fiber only,</text><text x="624" y="308" font-size="11.5" fill="#586572">no laser slots</text></g><g fill="none" stroke="#8794a1" stroke-width="1.25"><path d="M148 288H168" marker-end="url(#npo-lp-arrow)"></path><path d="M294 288H314" marker-end="url(#npo-lp-arrow)"></path><path d="M440 288H460" marker-end="url(#npo-lp-arrow)"></path><path d="M586 288H606" marker-end="url(#npo-lp-arrow)"></path></g><g><rect x="24" y="348" width="270" height="56" rx="8" fill="#c27c0e" fill-opacity="0.10" stroke="#c27c0e" stroke-width="1.5"></rect><text x="40" y="372" font-weight="600" fill="#16202a">EIC and nearby ASIC</text><text x="40" y="390" font-size="11.5" fill="#586572">heat raises laser threshold</text><path d="M86 348V328" fill="none" stroke="#c27c0e" stroke-width="1.5" marker-end="url(#npo-lp-heat)"></path><text x="96" y="342" font-size="11.5" fill="#16202a">heat</text></g><g><rect x="330" y="352" width="14" height="10" rx="2" fill="#d4632a" fill-opacity="0.12" stroke="#d4632a" stroke-width="1.5"></rect><text x="352" y="361" font-size="11.5" fill="#16202a">Light source</text><rect x="330" y="370" width="14" height="10" rx="2" fill="#1f5fcf" fill-opacity="0.12" stroke="#1f5fcf" stroke-width="1.5"></rect><text x="352" y="379" font-size="11.5" fill="#16202a">Inside the socketed engine</text><rect x="330" y="388" width="14" height="10" rx="2" fill="none" stroke="#8794a1" stroke-width="1.25"></rect><text x="352" y="397" font-size="11.5" fill="#16202a">Fiber path and front panel</text></g></svg>