<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="Scale-up from the package: copper for the rack, light beyond it" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">Scale-up from the package: copper for the rack, light beyond it</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Schematic; both media plug in at the package substrate instead of at a board-edge connector</text><g><rect x="290" y="96" width="180" height="176" rx="8" fill="#19222c" stroke="#6f7f8f" stroke-width="1.5"></rect><text x="380" y="116" text-anchor="middle" font-weight="600" fill="#e4eaf0">Package substrate</text><rect x="340" y="144" width="80" height="88" rx="6" fill="none" stroke="#6f7f8f" stroke-width="1.25"></rect><text x="380" y="184" text-anchor="middle" font-weight="600" fill="#e4eaf0">Die</text><text x="380" y="202" text-anchor="middle" font-size="11.5" fill="#95a3b1">SerDes</text></g><g><rect x="298" y="148" width="28" height="80" rx="4" fill="#f08a4b" fill-opacity="0.25" stroke="#f08a4b" stroke-width="1.5"></rect><text x="312" y="292" text-anchor="middle" font-size="11.5" fill="#e4eaf0">copper socket</text></g><g><rect x="434" y="148" width="28" height="80" rx="4" fill="#6ea2ff" fill-opacity="0.25" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="448" y="292" text-anchor="middle" font-size="11.5" fill="#e4eaf0">optical engine</text></g><g><path d="M298 188H162" fill="none" stroke="#f08a4b" stroke-width="6" stroke-linecap="round"></path><text x="230" y="176" text-anchor="middle" font-size="11.5" fill="#e4eaf0">twinax, 1–2.5 m</text></g><g><path d="M462 188H598" fill="none" stroke="#6ea2ff" stroke-width="2"></path><text x="530" y="176" text-anchor="middle" font-size="11.5" fill="#e4eaf0">one fiber, both ways</text></g><g><rect x="24" y="156" width="136" height="64" rx="8" fill="#f08a4b" fill-opacity="0.1" stroke="#f08a4b" stroke-width="1.5"></rect><text x="92" y="182" text-anchor="middle" font-weight="600" fill="#e4eaf0">Next tray</text><text x="92" y="200" text-anchor="middle" font-size="11.5" fill="#95a3b1">or the backplane</text></g><g><rect x="600" y="156" width="136" height="64" rx="8" fill="#6ea2ff" fill-opacity="0.1" stroke="#6ea2ff" stroke-width="1.5"></rect><text x="668" y="182" text-anchor="middle" font-weight="600" fill="#e4eaf0">Another rack</text><text x="668" y="200" text-anchor="middle" font-size="11.5" fill="#95a3b1">under 100 m</text></g><g><text x="24" y="328" font-weight="600" fill="#e4eaf0">Co-packaged copper (CPC)</text><text x="24" y="346" font-size="11.5" fill="#e4eaf0">Skips the board trace; no lasers</text><text x="24" y="362" font-size="11.5" fill="#95a3b1">Reach still halves with each lane-rate step</text></g><g><text x="400" y="328" font-weight="600" fill="#e4eaf0">OCI optical PHY</text><text x="400" y="346" font-size="11.5" fill="#e4eaf0">200G each way on one fiber, NRZ lanes</text><text x="400" y="362" font-size="11.5" fill="#95a3b1">Silicon rings fed by external lasers</text></g></svg>