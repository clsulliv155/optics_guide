<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 470" role="img" aria-label="Each compliance point is a contract: the host owns the signal up to TP1a, the module owns TP2, TP3 and TP4" font-size="12"><text x="24" y="30" font-size="15" font-weight="600" fill="#16202a">Each test point is a contract: the host owns the signal to TP1a, the module owns TP2, TP3 and TP4</text><text x="24" y="50" font-size="11.5" fill="#586572">IEEE 802.3 AUI-C2M and PMD compliance points for a retimed pluggable, one direction shown left to right then back</text><g><rect x="24" y="124" width="70" height="52" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="59" y="146" text-anchor="middle" font-weight="600" fill="#16202a">Host</text><text x="59" y="162" text-anchor="middle" font-size="10.5" fill="#586572">ASIC</text><line x1="94" x2="196" y1="150" y2="150" stroke="#1f5fcf" stroke-width="3"></line><text x="145" y="136" text-anchor="middle" font-size="10.5" fill="#586572">host trace</text><rect x="196" y="132" width="12" height="36" fill="#8794a1"></rect><text x="145" y="166" text-anchor="middle" font-size="10.5" fill="#586572">connector at TP1a</text><rect x="208" y="118" width="150" height="64" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="283" y="142" text-anchor="middle" font-weight="600" fill="#16202a">Module</text><text x="283" y="158" text-anchor="middle" font-size="10.5" fill="#586572">DSP, driver, laser</text><text x="283" y="172" text-anchor="middle" font-size="10.5" fill="#586572">PD, TIA</text><line x1="358" x2="410" y1="140" y2="140" stroke="#d4632a" stroke-width="2.5"></line><line x1="410" x2="560" y1="140" y2="140" stroke="#d4632a" stroke-width="2.5" stroke-dasharray="6 4"></line><text x="485" y="126" text-anchor="middle" font-size="10.5" fill="#586572">fiber, the channel</text><line x1="560" x2="612" y1="160" y2="160" stroke="#d4632a" stroke-width="2.5"></line><line x1="358" x2="410" y1="160" y2="160" stroke="#d4632a" stroke-width="2.5"></line><line x1="410" x2="560" y1="160" y2="160" stroke="#d4632a" stroke-width="2.5" stroke-dasharray="6 4"></line><line x1="560" x2="612" y1="140" y2="140" stroke="#d4632a" stroke-width="2.5"></line><rect x="612" y="118" width="124" height="64" rx="6" fill="#eef2f6" stroke="#8794a1" stroke-width="1.25"></rect><text x="674" y="146" text-anchor="middle" font-weight="600" fill="#16202a">Far module</text><text x="674" y="162" text-anchor="middle" font-size="10.5" fill="#586572">and its host</text></g><g><g><line x1="94" x2="94" y1="106" y2="194" stroke="#12876a" stroke-width="1.5" stroke-dasharray="3 3"></line><circle cx="94" cy="100" r="11" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></circle></g><g><line x1="202" x2="202" y1="106" y2="194" stroke="#12876a" stroke-width="1.5" stroke-dasharray="3 3"></line><circle cx="202" cy="100" r="11" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></circle></g><g><line x1="384" x2="384" y1="106" y2="194" stroke="#12876a" stroke-width="1.5" stroke-dasharray="3 3"></line><circle cx="384" cy="100" r="11" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></circle></g><g><line x1="586" x2="586" y1="106" y2="194" stroke="#12876a" stroke-width="1.5" stroke-dasharray="3 3"></line><circle cx="586" cy="100" r="11" fill="#eef2f6" stroke="#12876a" stroke-width="1.5"></circle></g></g><g font-size="10.5" font-weight="600" fill="#12876a" text-anchor="middle"><text x="94" y="104">TP0</text><text x="202" y="104">TP1a</text><text x="384" y="104">TP2</text><text x="586" y="104">TP3</text></g><text x="230" y="212" text-anchor="middle" font-size="10.5" font-weight="600" fill="#12876a">TP4 (return path)</text><text x="94" y="210" text-anchor="middle" font-size="10.5" font-weight="600" fill="#12876a">TP4a, TP5</text><line x1="24" x2="736" y1="236" y2="236" stroke="#8794a1"></line><g font-size="11"><text x="24" y="258" font-weight="600" fill="#16202a">Point</text><text x="110" y="258" font-weight="600" fill="#16202a">What is measured there</text><text x="590" y="258" font-weight="600" fill="#16202a">Who complies</text><text x="24" y="282" font-weight="600" fill="#12876a">TP0, TP5</text><text x="110" y="282" fill="#16202a">Host ASIC pins: reference points only, used in channel models (COM)</text><text x="590" y="282" fill="#586572">Host designer</text><text x="24" y="306" font-weight="600" fill="#12876a">TP1a</text><text x="110" y="306" fill="#16202a">Host output at the connector: eye height and VEC after a reference CTLE, ERL</text><text x="590" y="306" fill="#586572">Host</text><text x="24" y="330" font-weight="600" fill="#12876a">TP2</text><text x="110" y="330" fill="#16202a">Optical output after a short patch cord: OMA outer, ER, TDECQ, RIN, wavelength</text><text x="590" y="330" fill="#586572">Module transmitter</text><text x="24" y="354" font-weight="600" fill="#12876a">TP3</text><text x="110" y="354" fill="#16202a">Optical input: sensitivity and stressed sensitivity in OMA outer, maximum power, damage</text><text x="590" y="354" fill="#586572">Module receiver</text><text x="24" y="378" font-weight="600" fill="#12876a">TP4</text><text x="110" y="378" fill="#16202a">Module electrical output: eye height and VEC, near end and after a reference host channel</text><text x="590" y="378" fill="#586572">Module</text><text x="24" y="402" font-weight="600" fill="#12876a">TP4a</text><text x="110" y="402" fill="#16202a">Host input reference after the host trace; the host must receive what TP4 allows</text><text x="590" y="402" fill="#586572">Host</text></g><text x="24" y="436" font-size="11" fill="#16202a">A retimed module isolates the two halves: the host never sees TP2 or TP3, and the fiber never sees TP1a or TP4.</text><text x="24" y="454" font-size="10.5" fill="#586572">LPO removes that isolation, so host and module are qualified as a pair. Through 100G per lane AUI-C2M has no link training; CMIS tunes the module.</text></svg>