<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 380" role="img" aria-label="IEEE copper reach shrank with each lane-rate step until racks set a 1 m floor" font-size="13"><text x="24" y="30" font-size="15" font-weight="600" fill="#e4eaf0">IEEE copper reach shrank with each lane-rate step, until racks set a 1 m floor</text><text x="24" y="50" font-size="11.5" fill="#95a3b1">Passive twinax reach objective per IEEE project, with the Nyquist frequency each lane rate must carry</text><text x="24" y="80" font-size="11.5" fill="#95a3b1">Lane rate and project</text><text x="220" y="80" font-size="11.5" fill="#95a3b1">Reach objective</text><text x="580" y="80" font-size="11.5" fill="#95a3b1">Nyquist frequency</text><g><g><line x1="220" x2="220" y1="88" y2="322" stroke="#26313d"></line><text x="220" y="340" text-anchor="middle" font-size="11.5" fill="#95a3b1">0 m</text></g><g><line x1="280" x2="280" y1="88" y2="322" stroke="#26313d"></line><text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#95a3b1">1 m</text></g><g><line x1="340" x2="340" y1="88" y2="322" stroke="#26313d"></line><text x="340" y="340" text-anchor="middle" font-size="11.5" fill="#95a3b1">2 m</text></g><g><line x1="400" x2="400" y1="88" y2="322" stroke="#26313d"></line><text x="400" y="340" text-anchor="middle" font-size="11.5" fill="#95a3b1">3 m</text></g><g><line x1="460" x2="460" y1="88" y2="322" stroke="#26313d"></line><text x="460" y="340" text-anchor="middle" font-size="11.5" fill="#95a3b1">4 m</text></g><g><line x1="520" x2="520" y1="88" y2="322" stroke="#26313d"></line><text x="520" y="340" text-anchor="middle" font-size="11.5" fill="#95a3b1">5 m</text></g><line x1="220" x2="220" y1="88" y2="322" stroke="#6f7f8f" stroke-width="1.25"></line></g><g><g><rect x="220" y="93" width="300" height="22" rx="4" fill="#f08a4b" fill-opacity="0.85" stroke="#f08a4b" stroke-width="1.5" str