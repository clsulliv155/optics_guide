/text></g><g><line x1="641.6470588235294" x2="641.6470588235294" y1="92" y2="392" stroke="#dde3e9"></line><text x="641.6470588235294" y="410" text-anchor="middle" font-size="11" fill="#586572">1550 nm</text></g><line x1="84" x2="716" y1="392" y2="392" stroke="#8794a1" stroke-width="1.25"></line><line x1="84" x2="84" y1="92" y2="392" stroke="#8794a1" stroke-width="1.25"></line></g><text x="24" y="80" font-size="11.5" fill="#586572">dBm</text><g><g><line x1="106.30588235294118" x2="136.04705882352943" y1="267.625" y2="267.625" stroke="#1a8a46" stroke-width="2.5" stroke-dasharray="none"></line><text x="110.30588235294118" y="280.625" font-size="10.5" fill="#586572">HL1 +5.9 dBm</text></g><g><line x1="106.30588235294118" x2="136.04705882352943" y1="249.5" y2="249.5" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="6 4"></line><text x="110.30588235294118" y="241.5" font-size="10.5" fill="#586572">HL1M +8.8 dBm</text></g><g><line x1="426.0235294117647" x2="500.3764705882353" y1="165.74999999999997" y2="165.74999999999997" stroke="#1a8a46" stroke-width="2.5" stroke-dasharray="none"></line></g><g><line x1="426.0235294117647" x2="500.3764705882353" y1="152.00000000000003" y2="152.00000000000003" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="6 4"></line></g><g><line x1="530.1176470588235" x2="697.4117647058823" y1="241.375" y2="241.375" stroke="#1a8a46" stroke-width="2.5" stroke-dasharray="none"></line><text x="534.1176470588235" y="254.375" font-size="10.5" fill="#586572">HL1 +10.1 dBm</text></g><g><line x1="530.1176470588235" x2="697.4117647058823" y1="171.37500000000003" y2="171.37500000000003" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="6 4"></line><text x="534.1176470588235" y="163.37500000000003" font-size="10.5" fill="#586572">HL1M +21.3 dBm</text></g><text x="506.3764705882353" y="144.00000000000003" font-size="10.5" fill="#586572">HL1 +22.2, 1M +24.4</text></g><g><g><circle cx="121.1764705882353" cy="310.75" r="5" fill="#1a8a46" stroke="#1a8a46" stroke-width="2"></circle><text x="133.1764705882353" y="314.75" text-anchor="start" font-size="11" fill="#16202a">one SR lane, VCSEL</text></g><g><circle cx="121.1764705882353" cy="254.5" r="7" fill="#eef2f6" stroke="#c27c0e" stroke-width="2"></circle><text x="133.1764705882353" y="258.5" text-anchor="start" font-size="11" fill="#16202a">an SR8 port, 8 lanes on: classed 1M</text></g><g><circle cx="463.9435294117647" cy="298.25" r="5" fill="#1a8a46" stroke="#1a8a46" stroke-width="2"></circle><text x="475.9435294117647" y="302.25" text-anchor="start" font-size="11" fill="#16202a">one DR lane</text></g><g><circle cx="463.9435294117647" cy="242" r="7" fill="#eef2f6" stroke="#1a8a46" stroke-width="2"></circle><text x="451.9435294117647" y="246" text-anchor="end" font-size="11" fill="#16202a">a DR8 port, 8 × +1 dBm</text></g><g><circle cx="463.9435294117647" cy="223.25" r="7" fill="#eef2f6" stroke="#1a8a46" stroke-width="2"></circle><text x="451.9435294117647" y="227.25" text-anchor="end" font-size="11" fill="#16202a">a DR8 port at the +4 dBm lane maximum</text></g><g><circle cx="463.9435294117647" cy="151.375" r="5" fill="#c27c0e" stroke="#c27c0e" stroke-width="2"></circle><text x="451.9435294117647" y="142.375" text-anchor="end" font-size="11" fill="#16202a">ELS cap, 24.5 dBm per fiber: HL1 only with APR</text></g><g><circle cx="641.6470588235294" cy="367" r="5" fill="#1a8a46" stroke="#1a8a46" stroke-width="2"></circle><text x="629.6470588235294" y="371" text-anchor="end" font-size="11" fill="#16202a">a 400ZR module (−10 dBm)</text></g><g><circle cx="641.6470588235294" cy="179.5" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="2"></circle><text x="629.6470588235294" y="183.5" text-anchor="end" font-size="11" fill="#16202a">an EDFA booster output</text></g><g><circle cx="567.2941176470588" cy="117" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="2"></circle><text x="555.2941176470588" y="121" text-anchor="end" font-size="11" fill="#16202a">a Raman pump, about 1 W</text></g></g><g font-size="11" fill="#586572"><circle cx="30" cy="428" r="5" fill="#1a8a46" stroke="#1a8a46" stroke-width="2"></circle><text x="42" y="432">inside hazard level 1</text><circle cx="170" cy="428" r="7" fill="#eef2f6" stroke="#1a8a46" stroke-width="2"></circle><text x="184" y="432">a whole port: lanes add in mW, not dB</text><circle cx="410" cy="428" r="5" fill="#c27c0e" stroke="#c27c0e" stroke-width="2"></circle><text x="422" y="432">1M, or safe only with APR</text><circle cx="570" cy="428" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="2"></circle><text x="582" y="432">needs ALS and procedures</text><text x="24" y="456" font-size="10.5">The 1310 nm limit rose from about +12 dBm (2004 table) to +22 dBm (2021); many datasheets still quote the older figure.</text></g></svg>