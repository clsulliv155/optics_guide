<svg xmlns="http://www.w3.org/2000/svg" width="760" height="272" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 760 272" role="img" aria-label="New fibers add capacity in space or speed in air" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="#e4eaf0">New fibers add capacity in space or speed in air</text><text x="24" y="48" font-size="11.5" fill="#95a3b1">Schematic cross-sections, not to scale; blue marks where the light travels</text><g><circle cx="95" cy="136" r="52" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="95" cy="136" r="5" fill="#6ea2ff" stroke="#6ea2ff" stroke-width="1"></circle><text x="95" y="216" text-anchor="middle" font-weight="600" fill="#e4eaf0">Standard SMF</text><text x="95" y="234" text-anchor="middle" font-size="11.5" fill="#95a3b1">one ~9 µm glass core</text><text x="95" y="250" text-anchor="middle" font-size="11.5" fill="#95a3b1">light travels in glass</text></g><g><circle cx="237" cy="136" r="52" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="219" cy="118" r="5" fill="#6ea2ff"></circle><circle cx="255" cy="118" r="5" fill="#6ea2ff"></circle><circle cx="219" cy="154" r="5" fill="#6ea2ff"></circle><circle cx="255" cy="154" r="5" fill="#6ea2ff"></circle><text x="237" y="216" text-anchor="middle" font-weight="600" fill="#e4eaf0">Uncoupled MCF</text><text x="237" y="234" text-anchor="middle" font-size="11.5" fill="#95a3b1">4 independent cores</text><text x="237" y="250" text-anchor="middle" font-size="11.5" fill="#95a3b1">fan-in/fan-out to SMF</text></g><g><circle cx="380" cy="136" r="52" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="373" cy="129" r="5" fill="#6ea2ff"></circle><circle cx="387" cy="129" r="5" fill="#6ea2ff"></circle><circle cx="373" cy="143" r="5" fill="#6ea2ff"></circle><circle cx="387" cy="143" r="5" fill="#6ea2ff"></circle><text x="380" y="216" text-anchor="middle" font-weight="600" fill="#e4eaf0">Coupled-core MCF</text><text x="380" y="234" text-anchor="middle" font-size="11.5" fill="#95a3b1">cores close; signals mix</text><text x="380" y="250" text-anchor="middle" font-size="11.5" fill="#95a3b1">needs MIMO DSP</text></g><g><circle cx="522" cy="136" r="52" fill="#19222c" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="522" cy="136" r="36" fill="var(--cds-chart-surface, none)" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="522" cy="136" r="15" fill="#6ea2ff" fill-opacity="0.3" stroke="#6ea2ff" stroke-width="1"></circle><circle cx="548" cy="136" r="10" fill="none" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="535" cy="158.5" r="10" fill="none" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="509" cy="158.5" r="10" fill="none" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="496" cy="136" r="10" fill="none" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="509" cy="113.5" r="10" fill="none" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="535" cy="113.5" r="10" fill="none" stroke="#6f7f8f" stroke-width="1.25"></circle><circle cx="553" cy="136" r="5" fill="none" stroke="#6f7f8f" stroke-width="1"></circle><circle cx="537.5" cy="162.8" r="5" fill="none" stroke="#6f7f8f" stroke-width="1"></circle><circle cx="506.5" cy="162.8" r="5" fill="none" stroke="#6f7f8f" stroke-width="1"></circle><circle cx="491" cy="136" r="5" fill="none" stroke="#6f7f8f" stroke-width="1"></circle><circle cx="506.5" cy="109.2" r="5" fill="none" stroke="#6f7f8f" stroke-width="1"></circle><circle cx="537.5" cy="109.2" r="5" fill="none" stroke="#6f7f8f" stroke-width="1"></circle><text x="522" y="216" text-anchor="middle" font-weight="600" fill="#e4eaf0">Hollow-core (DNANF)</text><text x="522" y="234" text-anchor="middle" font-size="11.5" fill="#95a3b1">air core, nested tubes</text><text x="522" y="250" text-anchor="middle" font-size="11.5" fill="#95a3b1">~30% lower latency</text></g><g><circle cx="664" 